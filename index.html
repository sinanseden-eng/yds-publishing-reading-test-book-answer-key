<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YDT Reading Test Book</title>
    <style>
        /* ── reset & base ── */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            background: #f6f8fc;
            color: #1a2332;
            padding: 20px;
        }
        .container {
            max-width: 1440px;
            margin: 0 auto;
        }

        /* ── header ── */
        header {
            background: linear-gradient(135deg, #0b1a33, #1a3a5c);
            color: #fff;
            padding: 28px 32px;
            border-radius: 20px;
            margin-bottom: 28px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 24px rgba(0, 20, 40, .2);
        }
        header h1 {
            font-weight: 600;
            font-size: 1.7rem;
            letter-spacing: -.3px;
        }
        header h1 small {
            font-weight: 400;
            font-size: 1rem;
            opacity: .75;
            margin-left: 12px;
        }
        .test-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .test-nav button {
            background: rgba(255, 255, 255, .12);
            border: none;
            color: #fff;
            padding: 8px 16px;
            border-radius: 40px;
            font-weight: 600;
            font-size: .85rem;
            cursor: pointer;
            transition: .2s;
            backdrop-filter: blur(4px);
        }
        .test-nav button:hover {
            background: rgba(255, 255, 255, .25);
        }
        .test-nav button.active {
            background: #ffd966;
            color: #0b1a33;
        }

        /* ── main layout ── */
        .reader {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        @media (max-width: 900px) {
            .reader {
                grid-template-columns: 1fr;
            }
        }

        /* ── cards ── */
        .card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, .04);
            padding: 24px 28px;
            transition: box-shadow .2s;
            border: 1px solid rgba(0, 0, 0, .04);
        }
        .card-title {
            font-weight: 600;
            font-size: 1rem;
            color: #4a5b7a;
            letter-spacing: .3px;
            text-transform: uppercase;
            font-size: .75rem;
            margin-bottom: 16px;
            border-bottom: 2px solid #eef2f7;
            padding-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-title span {
            background: #eef2f7;
            padding: 2px 12px;
            border-radius: 40px;
            font-size: .7rem;
            color: #2a3a5a;
        }

        /* ── passage ── */
        .passage-text {
            font-size: 0.98rem;
            line-height: 1.75;
            color: #1e2a3e;
            max-height: 70vh;
            overflow-y: auto;
            padding-right: 6px;
            scroll-behavior: smooth;
        }
        .passage-text p {
            margin-bottom: 1em;
        }
        .passage-text .hl {
            background: #fae77c;
            padding: 0 4px;
            border-radius: 6px;
            transition: background .25s;
            font-weight: 500;
        }
        .passage-text .hl.correct {
            background: #7bcfa6;
        }
        .passage-text .hl.wrong {
            background: #f7a1a1;
        }

        /* ── questions ── */
        .question-list {
            max-height: 70vh;
            overflow-y: auto;
            padding-right: 4px;
        }
        .q-item {
            background: #fafcff;
            border-radius: 14px;
            padding: 18px 20px;
            margin-bottom: 16px;
            border: 1px solid #e9edf4;
            transition: .2s;
        }
        .q-item:hover {
            border-color: #c8d4e6;
        }
        .q-text {
            font-weight: 600;
            font-size: .96rem;
            margin-bottom: 12px;
            color: #0f1e32;
        }
        .q-text .q-num {
            display: inline-block;
            background: #0b1a33;
            color: #fff;
            width: 26px;
            height: 26px;
            text-align: center;
            line-height: 26px;
            border-radius: 40px;
            font-size: .75rem;
            margin-right: 10px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .options label {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 14px;
            border-radius: 10px;
            background: #f4f7fc;
            border: 2px solid transparent;
            cursor: pointer;
            transition: .15s;
            font-size: .92rem;
        }
        .options label:hover {
            background: #e9eff8;
        }
        .options label .letter {
            font-weight: 700;
            color: #3a5a7a;
            min-width: 22px;
        }
        .options input[type="radio"] {
            accent-color: #1a3a5c;
            width: 18px;
            height: 18px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .options label.selected-correct {
            border-color: #2b8c5e;
            background: #e1f5ed;
        }
        .options label.selected-wrong {
            border-color: #c94a4a;
            background: #fde8e8;
        }
        .options label.show-correct {
            border-color: #2b8c5e;
            background: #e1f5ed;
        }
        .feedback {
            margin-top: 10px;
            font-size: .85rem;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 40px;
            display: inline-block;
            background: #f0f3f9;
            color: #3a4a6a;
        }
        .feedback.correct {
            background: #d4efe4;
            color: #1a6a44;
        }
        .feedback.wrong {
            background: #fce3e3;
            color: #b33a3a;
        }

        /* ── passage selector (for tests with multiple passages) ── */
        .passage-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 18px;
        }
        .passage-tabs button {
            background: #eef2f7;
            border: none;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 500;
            font-size: .8rem;
            color: #2a3a5a;
            cursor: pointer;
            transition: .2s;
        }
        .passage-tabs button:hover {
            background: #dce4ef;
        }
        .passage-tabs button.active {
            background: #0b1a33;
            color: #fff;
        }

        /* ── scrollbar ── */
        .passage-text::-webkit-scrollbar,
        .question-list::-webkit-scrollbar {
            width: 5px;
        }
        .passage-text::-webkit-scrollbar-track,
        .question-list::-webkit-scrollbar-track {
            background: #eef2f7;
            border-radius: 10px;
        }
        .passage-text::-webkit-scrollbar-thumb,
        .question-list::-webkit-scrollbar-thumb {
            background: #bcc8dd;
            border-radius: 10px;
        }

        /* ── responsive tweaks ── */
        @media (max-width: 600px) {
            body {
                padding: 12px;
            }
            header {
                padding: 18px 20px;
                flex-direction: column;
                align-items: stretch;
                gap: 14px;
            }
            header h1 {
                font-size: 1.2rem;
            }
            .card {
                padding: 16px 18px;
            }
            .q-item {
                padding: 14px 16px;
            }
            .options label {
                font-size: .85rem;
                padding: 6px 12px;
            }
        }

        /* ── status bar ── */
        .status-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-top: 20px;
            padding: 12px 20px;
            background: #eef2f7;
            border-radius: 16px;
            font-size: .85rem;
            color: #2a3a5a;
        }
        .status-bar .score {
            font-weight: 700;
            color: #0b1a33;
        }
        .status-bar .reset-btn {
            background: none;
            border: none;
            color: #4a6a8a;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 16px;
            border-radius: 40px;
            transition: .2s;
        }
        .status-bar .reset-btn:hover {
            background: #dce4ef;
        }
    </style>
</head>
<body>
    <div class="container" id="app">

        <!-- Header -->

            <div class="card">
                <div class="card-title">

                <div class="passage-tabs" id="passageTabs"></div>
                <div class="passage-text" id="passageText"></div>
            </div>

            <!-- Right: Questions -->
            <div class="card">
                <div class="card-title">
                    ❓ Sorular
                    <span id="questionCount">0 soru</span>

        <!-- Status Bar -->
        <div class="status-bar">

    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  DATA  –  Tests 1–11  (Part 1: Reading Passages)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        const DATA = {

            // ─── TEST 1 ───
            test1: {
                passages: [{
                    id: 't1p1',
                    label: 'Kraftwerk',
                    text: `<p>The German music band Kraftwerk is, for many, nothing less than the progenitor of electronic music. As these pioneering musicians continue to break old ground, decades after their first appearance, one cannot fail to notice that very few groups nowadays could lay claim to such an influential and prodigious career. Can anyone find today an equivalent to the legendary bands of the 60s, 70s or early 80s among contemporary groups? It seems that innovation is not on the agenda of the companies who control the profitable music industry. Therefore, bands tend to play safe by clinging to the most profitable, well-established and less risky forms of music. However, if music is a form of art rather than mere entertainment, the companies who dictate the rules of the game called music will have to allow for artists who are passionate, unsafe and ready to experiment.</p>`,
                    questions: [{
                        id: 't1q1',
                        text: 'It can be understood from the passage that Kraftwerk',
                        options: ['was long forgotten when people met new innovative groups',
                            'is a case of innovative music bands who dare to try new things in music',

                            'exerted influence back in the 70s and 80s',
                            'is the most famous music band in Germany due to their success in their style'
                        ],
                        answer: 1,
                        highlight: 'The German music band Kraftwerk is, for many, nothing less than the progenitor of electronic music. As these pioneering musicians continue to break old ground'
                    }, {
                        id: 't1q2',
                        text: 'It is clear from the passage that music companies',
                        options: ['try hard to give opportunities for the ones who are passionate musicians',
                            'are reluctant to invest in groups who play electronic music',
                            'would not sign a contract with an old-fashioned group like Kraftwerk',
                            'do not seek innovative musicians but those who bring money in the market',
                            'are trying to encourage experimental artists who have more potential'
                        ],
                        answer: 3,
                        highlight: 'It seems that innovation is not on the agenda of the companies who control the profitable music industry. Therefore, bands tend to play safe by clinging to the most profitable, well-established and less risky forms of music.'
                    }, {
                        id: 't1q3',
                        text: 'According to the passage, why are today\'s music groups not doing as well as those in the past?',
                        options: ['They try to make art and produce new styles instead of entertaining their audience.',
                            'They take risks in order to produce experimental styles.',
                            'The priority of music industry is to earn money rather than make art.',
                            'Music industry cannot find many innovative musicians as they used to.',
                            'Most of them play electronic music, which is not applauded by the public.'
                        ],
                        answer: 2,
                        highlight: 'It seems that innovation is not on the agenda of the companies who control the profitable music industry. Therefore, bands tend to play safe by clinging to the most profitable, well-established and less risky forms of music.'
                    }]
                }, {
                    id: 't1p2',
                    label: 'Viking surnames',
                    text: `<p>Surnames ending with the suffix -son in the area of Yorkshire in England are very common. This apparently insignificant piece of information tells a big story, though. Namely, it reflects the predominance of inhabitants who are descendants of Scandinavian Vikings in this region of Northern Britain. Many British with Scandinavian roots are trying to rediscover, revive and promote their Nordic identity. Traditions coming from the Vikings are increasingly popular, especially in remote areas in the north of Scotland. Many claim these revivals as another fashion which simply indicates the need of people to be part of a community. The criticism against resurgent traditionalism is that it has little to do with respect for tradition itself. Conversely, those who are fascinated with rediscovered roots are just trying to form some sort of collective identity within an uncertain and fragmented contemporary world.</p>`,
                    questions: [{
                        id: 't1q4',
                        text: 'It is stated in the passage that the high percentage of Nordic surnames in the area of Yorkshire',
                        options: ['shows the frequency of Viking ancestry there',
                            'proves that Vikings are still dominant there',
                            'is not the only sign of the Viking heritage in Northern Britain',

                            'has nothing to do with Scandinavian people'
                        ],
                        answer: 0,
                        highlight: 'Surnames ending with the suffix -son in the area of Yorkshire in England are very common. This apparently insignificant piece of information tells a big story, though. Namely, it reflects the predominance of inhabitants who are descendants of Scandinavian Vikings in this region of Northern Britain.'
                    }, {
                        id: 't1q5',
                        text: 'What can be inferred from the passage about the recent revival of Viking traditions in Northern Britain?',
                        options: ['It relates to the influence that Vikings exert.',
                            'It shows that many people in the area see themselves as Viking rather than British.',
                            'It can be attributed to the large number of Vikings who once lived there.',
                            'It disturbs many British people and cause unrest in the country.',
                            'It shows the need of contemporary people for a sense of belonging in a community.'
                        ],
                        answer: 4,

                    }, {
                        id: 't1q6',

                            'Ethnic minorities and their effort to safeguard their identity today',

                        ],
                        answer: 2,
                        highlight: 'Conversely, those who are fascinated with rediscovered roots are just trying to form some sort of collective identity within an uncertain and fragmented contemporary world.'
                    }]
                }, {
                    id: 't1p3',
                    label: 'Re-enactment',
                    text: `<p>What makes grown-up people all over the world dress up as knights or soldiers or as an Indian warrior or a Napoleonic soldier to re-enact battles? The phenomenon of historical re-enactment is amazing in that so many people are prepared to spend time and money to do what would have been inconceivable a few decades ago. The defenders of this new fashion say that through re-enactments they can feel history in their skin and that playing the role of a Roman legionnaire is not childish but a way to witness history from the inside. Yet, personally I believe it all boils down to an effort to gain permission to play but, of course, with more expensive toys. Fancy as these staged battles might be, they appear to me as a struggle to cling to the carelessness of childhood. On top of that, history cannot be grasped by wearing a uniform or an armour.</p>`,
                    questions: [{
                        id: 't1q7',
                        text: 'It is clear from the passage that those who partake in re-enactments',
                        options: ['feel that they want to remain children',
                            'do it for the pleasure of wearing uniforms',
                            'perceive it as a way of identifying with historical figures and events',
                            'give priority to historical accuracy and so they spend great effort to revive the events',
                            'prefer to do it in order to have fun just like children do'
                        ],
                        answer: 2,
                        highlight: 'The defenders of this new fashion say that through re-enactments they can feel history in their skin and that playing the role of a Roman legionnaire is not childish but a way to witness history from the inside.'
                    }, {
                        id: 't1q8',
                        text: 'It is evident that the writer of the passage',
                        options: ['has a great admiration for those who spend time and money to re-enact battles',
                            'sees these events as waste of resources',
                            'is very sceptical with the claims of those who participate in the re-enactments',
                            'defends the right of grown-ups to enjoy the experience of those re-enactments',
                            'believes re-enactments are necessary to witness historical events'
                        ],
                        answer: 2,
                        highlight: 'Yet, personally I believe it all boils down to an effort to gain permission to play but, of course, with more expensive toys. Fancy as these staged battles might be, they appear to me as a struggle to cling to the carelessness of childhood.'

                            'is better grasped by experiencing it through games, just like children learn through toys',
                            'cannot be understood by means of role-playing alone'
                        ],
                        answer: 4,
                        highlight: 'On top of that, history cannot be grasped by wearing a uniform or an armour.'
                    }]
                }, {
                    id: 't1p4',
                    label: 'Skull fashion',
                    text: `<p>Meet one of the love affairs of designers. It is called the skull. Everywhere, from children's woollen hats to expensive fashion accessories, skulls seem to be the must-have sensational detail. These universal symbols of death sometimes come in glittering pink, sometimes as valuable stones. Some say that designers will use anything that attracts attention. Some others even think that the frequent use of smiling or colourful skulls reflects an effort to make death more acceptable. Likewise, some even believe there is a conspiracy behind this persistent unpleasant image. Namely, they claim that, in a war-torn period of history, there is a plan to make people used to the image of death to make it seem normal, even entertaining. But most people simply find this fashion either distasteful or 'cool'. At the end of the day, beauty is in the mind of the beholder.</p>`,

                            'People\'s opinions on this trend can be manipulated by the design industry.'

                    }, {
                        id: 't1q12',
                        text: 'The passage is mostly about',
                        options: ['the unacceptable use of the symbol of death by designers',
                            'the difficult choices designers are facing',
                            'the problems arising when both morality and aesthetics are compromised',
                            'the different significance people can attribute towards the same thing',
                            'how peoples attitudes towards a specific phenomenon are formed'
                        ],
                        answer: 3,
                        highlight: 'At the end of the day, beauty is in the mind of the beholder.'
                    }]
                }, {
                    id: 't1p5',
                    label: 'London balconies',
                    text: `<p>London is a city full of balconies, especially inside its historical centre. But hardly any people can be seen on them. Londoners do not necessarily have the habit of spending time on their exquisite balconies. Conversely, in countries such as Spain or Italy, people seem to spend more time on their balconies and yards than indoors. Filled with colourful flowers, those balconies and yards are pleasantly inviting. One could assume that the different attitudes between the British and their Southern neighbours relate to weather, but even over warm summer days few British will venture the great outdoors. If one watches more closely, it is not only people but even personal items which are absent from these spaces exposed to the public eye. Eventually, it is exactly the way North Europeans perceive public as opposed to private space, in relation to their Southern counterparts, which accounts for these different attitudes. While Italians are happy to chat endlessly with neighbours, the British will avoid exposing themselves to public scrutiny, or their laundry, for that matter.</p>`,
                    questions: [{

                        answer: 1,

                    }, {
                        id: 't1q14',
                        text: 'Which of the following could be the best title for the passage?',
                        options: ['Different Cultures, Different Habits',

                        answer: 0,
                        highlight: 'Eventually, it is exactly the way North Europeans perceive public as opposed to private space, in relation to their Southern counterparts, which accounts for these different attitudes.'
                    }, {
                        id: 't1q15',
                        text: 'It is implied in the passage that',

                            'differences in habits with regard to minor issues are insignificant',
                            'one can often have the habit of using a balcony depending on the climate',

                        ],
                        answer: 0,
                        highlight: 'Eventually, it is exactly the way North Europeans perceive public as opposed to private space, in relation to their Southern counterparts, which accounts for these different attitudes.'

                }, {
                    id: 't1p6',
                    label: 'Professionalism',
                    text: `<p>So what does professionalism mean for teachers? The answer seems to be self-evident, while for many this is a useless question. Of course, professionalism is about delivering the lesson in a faultless way, planning ahead and responding to students' needs. Or is it that we are missing something here? All these nice sounding words cover up the fact that many teachers have very different definitions for all the above. What, for instance, does it mean to respond to students' needs? Who dictates what the needs or the appropriate response to them are? Well, you start to get the point: Things which are taken for granted are precisely those which have to be clearly defined before we develop a common language about what professionalism in education is about.</p>`,
                    questions: [{
                        id: 't1q16',
                        text: 'It can be understood from the passage that professionalism within education',
                        options: ['means doing whatever is asked for by students in a classroom and meeting their needs',
                            'is a term that needs to be looked at more closely',

                        highlight: 'Things which are taken for granted are precisely those which have to be clearly defined before we develop a common language about what professionalism in education is about.'
                    }, {
                        id: 't1q17',
                        text: 'Which of the following best describes the writer\'s beliefs?',
                        options: ['No one can tell what professionalism really is.',
                            'Professionalism dictates what the appropriate response to students\' needs is.',
                            'Educationalists have to find common ground on the issue of professionalism.',
                            'Many educators are unprofessional, which leads to problems in education.',
                            'There is no agreement on the importance of professionalism on education.'
                        ],
                        answer: 2,
                        highlight: 'Things which are taken for granted are precisely those which have to be clearly defined before we develop a common language about what professionalism in education is about.'
                    }, {
                        id: 't1q18',

                    text: `<p>Lyme disease is a relatively new threat spreading across Europe and North America. Humans can develop this life-threatening disease from tick bites. Deer ticks attach themselves to passersby, and if they remain unnoticed on the skin for more than 36 hours, they can contaminate the blood stream with a bacillus which can trigger Lyme disease. Not every person contaminated by this bacillus will develop this condition, which attacks the nervous system with often crippling consequences. However, the percentage of those who will do so is quite high. People should take extra precautions when walking in forests and prefer clothes with light colours which make attached ticks more visible and easy to remove afterwards. Exposed hands and especially feet are not a good idea; thus, long sleeves and trousers are advisable. There are different theories about where this bacillus came from, but there is little disagreement on what precautions should be taken.</p>`,

                    text: `<p>The greatest scientist of American history and the mastermind behind the NASA programme in the 60s was not an American but a German who invented the first ballistic missile. Wernher von Braun is the man who developed during the 1940s the extraordinary technological feat called the V2 rocket. After the first successful trial of his brainchild, he declared that the way for travelling to the stars was open! The German political and military establishment was not concerned about spaceships at that moment. However, using the same technology, the V2 wonder-weapon was effectively their last chance to turn the tide of the Second World War. Von Braun was captured by the US army in 1945, became an American citizen and played a key role in the Apollo programme which took man to the Moon. Upon immigration, he was asked at the US border if he had ever been linked to an anti-American organisation, he answered "Yes, the German Army". However, he was in fact a true servant of the USA.</p>`,

                    id: 't2p2',
                    label: 'Snails',
                    text: `<p>Snails are very slow moving creatures, and they do not seem to have a good reputation in many cultures since most people associate that nature with being lazy and not good for much. That they are not mystical or beautiful has led to more stories and cultures viewing them as something bad or evil. For instance, in Judeo-Christian culture, the snail has often been viewed as a manifestation of the deadly sin of sloth. In fact, in many early cultures, the movements of the snail were viewed as being unclean, and people were often marked with a snail as a sign of punishment. On the other hand, the Greek poet Hesiod wrote that snails signified the time to harvest by climbing the stalks, while the Aztec believed that the snail was the moon god and that the shell was his protection. And the psychologist Carl Jung noted that the snail was the representative of the self in dreams. In psychology, the soft insides are analogous to the subconscious as the shell is the conscious. Though not everyone buys this theory, many professors mention this in their lessons today.</p>`,

                    text: `<p>The women's suffrage movement in the United States began in earnest in the decades before the Civil War. During the 1820s and 30s, most states had extended the franchise to all white men, regardless of how much money or property they had. At the same time, all sorts of reform groups were proliferating across the United States and in many of these, women played a prominent role. Meanwhile, many American women were beginning to chafe against what historians have called the "Cult of True Womanhood": that is, the idea that the only "true" woman was a submissive wife and mother concerned exclusively with home and family. Put together, all of these contributed to a new way of thinking about what it meant to be a woman and a citizen of the United States. It took activists and reformers nearly 100 years to win the right to vote for women, and the campaign was not easy. Disagreements over strategy threatened to cripple the movement more than once. But on August 18, 1920, the 19th Amendment to the Constitution was finally ratified, declaring for the first time that women deserve all the rights and responsibilities of citizenship.</p>`,

                    label: 'Atlantis',
                    text: `<p>The writing of the ancient Greek philosopher Plato contained so much truth about the human condition, but one of his most famous stories, the cataclysmic destruction of the ancient civilization of Atlantis, is almost certainly false. So why is this story still repeated more than 2,300 years after Plato's death? "It's a story that captures the imagination," says James Romm, a professor of classics at Bard College in New York. "It's a great myth. It has a lot of elements that people love to fantasize about." Plato told the story of Atlantis around 360 BCE. The founders of Atlantis, he said, created a utopian civilization and became a great naval power. Their home was made up of concentric islands separated by wide moats and linked by a canal that penetrated to the centre. The lush islands contained gold, silver and other precious metals and supported an abundance of rare, exotic wildlife. There are many theories about where Atlantis was—in the Mediterranean, off the coast of Spain, even under what is now Antarctica. Plato said Atlantis existed about 9,000 years before his own time and that its story had been passed down by poets, priests and others. But Plato's writings about Atlantis are the only known records of its existence.</p>`,

                    text: `<p>Drawing or painting is, for many, a relaxing weekend pastime. For the proponents of art therapy, making art is an activity which can be not only gratifying but also therapeutic. But for the majority of the population, arts are better left to the masters. There is a widespread belief that we, the ordinary people, who are not touched by a stroke of genius, should keep safe distance from the preserve of the gifted few. This elitist perception about high art dates centuries back, at least to the days of the Renaissance. It creates a dual opposition in the minds of people, namely between the talented maker and us, the hapless masses who cannot draw a straight line. This mentality alienates most people from their own creativity as they take art either too seriously or not seriously at all. That is to say, most people think of art as either a grand endeavour or as a mere hobby. But making art is neither superhuman nor a substitute for a crossword.</p>`,

                    text: `<p>Sending letters and parcels before Christmas might become quite a tricky business in many countries across the world. Royal Mail presents a service on its website which shows the latest posting day to many countries if you want your mail to be delivered just before Christmas Day. For most countries in Europe, this date is about one month before Christmas unless airmail is used, which is a mail transport system in which at least one leg of the journey is completed by aircraft. It usually has a shorter delivery time. However, for other mainly overseas countries such as Australia or the United States, mail usually has to be posted by the end of October. If you want to make sure that your mail will be delivered in time, check the Royal Mail website. They will refund you if your mail wasn't delivered on time even though it was sent prior to the last posting day. Alternatively, if you are just after wishing somebody a nice holiday, even though it is definitely not as kind and warm as receiving a letter or a postcard, you can send them a text message.</p>`,

                    label: 'Raisins experiment',
                    text: `<p>First, we pour soda water into a large cup and drop 5-6 raisins into the liquid. They will sink to the bottom as they are slightly denser than soda. By adding a few drops of vinegar into the cup, we'll create carbon dioxide gas bubbles which will attach themselves to the rough surfaces of raisins making them float toward the top of the cup because of the increase in buoyancy. When they get to the top of the soda, most of the bubbles burst and the carbon dioxide gas escapes into the air and that causes raisins to lose buoyancy and sink back down to the bottom of the cup. The whole process, called carbonation, starts all over again until most of the carbon dioxide escapes and the soda goes flat. Furthermore, as the raisins get soggy, they become too heavy to float. We can conduct this test adding lemon juice and other acids into the soda water. This is a basic test of reaction between acids and alkalis.</p>`,

                    label: 'Armadillos',
                    text: `<p>The word armadillo refers to various armoured mammals found mainly in tropical and subtropical regions of Central and South America. Most of the 20 species inhabit open areas, such as grasslands, but some also live in forests. Armadillos live alone, in pairs or in small groups. Emerging from their burrows primarily at night, these efficient diggers use their keen sense of smell to locate food. They feed on termites and other insects, along with vegetation, small animals and larvae. The common nine-banded armadillo is used in leprosy research because it is naturally susceptible to the disease and because the microbe that causes leprosy does not grow in laboratory culture media. Armadillos are timid. When threatened, they retreat to their burrows or, if caught in the open, draw in their feet so that their armour touches the ground. Some armadillos are able to roll into a solid ball as a means of protecting their vulnerable underpants. Extinct relatives of today's armadillos included a 2-metre, 230-kg beast that roamed Florida as recently as 10,000 years ago. It is not certain whether pre-Columbian humans contributed to this armadillo's extinction.</p>`,

                    label: 'Vitamin C',
                    text: `<p>Vitamin C is an essential nutrient for our health. Therefore, our body needs a constant supply of it. It can be found in many different forms such as effervescent or chewable tablets and pills. Of course, it can also be found in food sources such as fruit, but people seem to prefer its manufactured forms as they offer large doses. For example, a 1000 mg tablet is equivalent to a large number of oranges. Swallowing a pill instead of having to eat a dozen of oranges is an obvious advantage. What the pharmaceutical companies which sell them avoid mentioning is that our body cannot absorb more than 200 mg in one go. Our greed for more is one of the factors which add pressure on these manufacturers to increase the doses to the impressive mark of 1000 mg or more. But in the end, we get our 200 mg and the satisfaction of consuming 1000 mg. The public are happy.</p>`,

                    id: 't4p3',
                    label: 'Flamingos & salmon',
                    text: `<p>Flamingos are long-legged wading birds that are usually covered in bright pink feathers. With a name that derives from the Spanish or Portuguese word meaning "flame-coloured," the birds are known for their vibrant appearance. Though it is their most-famous quality, the pink of the flamingo's feathers is not a hereditary trait. They are in fact born dull grey, but, as Encyclopaedia Britannica explains, "the bright pink colour of flamingos comes from beta carotene, a red-orange pigment that's found in high numbers within the algae, larvae, and brine shrimp that flamingos eat in their wetland environment." Salmon are similar in that sense—their meat is naturally grey as well, and wild salmon fillets are pink because the fish, when alive, feast on krill and shrimp. Farm-raised salmon fillets, therefore, shouldn't be pink when they hit our dinner plates, but they are because consumers would object to grey salmon. It is stated that salmon farmers spike their artificial diet with pinkifying pellets to make the fish look natural even though in reality, the exact opposite is true.</p>`,

                    text: `<p>Sunlight produces a so-called 'feel good' psychological factor. This is related to the chemical balance of the brain which regulates mood. Sunlight triggers the production of a specific type of chemical in the brain called endorphins which condition the way we feel. So, it is not only the case that a sunny day makes us feel happier because we like the sun, but the sun literally influences our brain in biochemical terms. Of course, it is not easy to distinguish between emotional and biochemical terms when it comes to the function of the human brain. Yet, we respond emotionally to many things we like without experiencing the immediate influx of endorphins that sunlight causes. Chronic depression in wealthy countries such as Finland is epidemic, and it shows the consequences of sunlight deprivation. As in most cases of relevant research, it is mostly the extreme chronic conditions which reveal how the brain works.</p>`,

                    label: 'Population',
                    text: `<p>About 8 billion people inhabit the Earth now. To get a better picture of this, one should consider that there are, among a huge number of threatened and endangered species, perhaps 100,000 gorillas, half as many polar bears and no more than a few thousand tigers. The human population has grown nearly tenfold especially over the last three hundred years and has increased four times in the last hundred years. This monumental historical development has had profound implications on the relationship of our species to its habitats and has greatly intensified our impact on the environment. However, no less noteworthy are the signs that the human population explosion has begun to abate in our generation. It is expected that our numbers will have risen to one and a half times what it is now by the time it stops doing so, and what's more, quite a few researchers estimate that a decline will be inevitable.</p>`,

                    id: 't4p6',
                    label: 'Collective intelligence',
                    text: `<p>Since antiquity, the social organization of insects such as ants and bees has been a source of inspiration for thinkers, politicians and philosophers. These insects appear to have highly sophisticated ways of structuring their 'societies', dividing labour, communicating information and even making collective decisions. However, on the flip side, when an insect such as an ant becomes isolated, it seems unable to behave in any meaningful way. According to scientists, this can be described as a form of collective intelligence. A colony of ants, or a beehive, is not a sum of quirkily intelligent insects, but, rather, a sum of 'units' which automatically mirror, or adapt to, what their peer group does. A very large number of insects with limited intelligence come together and form a unit which behaves in sophisticated, intelligent ways. Nowadays, computer scientists draw inspiration from these models of intelligent organization and try to develop large clusters of computers or small robots which combine forces, forming an extremely capable whole which is more than merely the sum of its parts.</p>`,

                    label: 'Carnivorous plants',
                    text: `<p>Carnivorous plants are predatory flowering plants that kill animals in order to derive nutrition from their bodies. They capture and kill prey, and they have a mechanism to facilitate digestion of the prey. They also derive a significant benefit from nutrients assimilated from the prey. To put it in more human terms, carnivorous plants eat things like insects, spiders and other small soil and water-living invertebrates, lizards, mice, rats and other small vertebrates. Carnivorous plants pull off this trick using specialized leaves that act as traps. Many traps lure prey with bright colours and nectar. Once caught and killed, the prey is digested by the plant. The plant then absorbs the nutrients made available from the corpse. Most carnivorous plants will grow without consuming prey, but they grow much faster and reproduce much better with nutrients derived from their prey. Not all plants that trap or kill animals are considered carnivorous, though. Some plants capture insects in their flowers to facilitate pollination. They don't kill the pollinators, and if some of the pollinators do die in the flower, it is not to the advantage of the plant.</p>`,

                    label: 'Drones in disasters',
                    text: `<p>The first thing disaster responders do in an emergency is find out what happened, how many people need help and what assistance the survivors need. To get an overview as quickly as possible, disaster managers use everything at their disposal: They read reports, call their local counterparts, drive to the scene of the disaster, request satellite images and check social media. Nowadays, disaster responders have another source of information at their disposal: drones. Drones are small, comparatively cheap and can quickly provide images of a disaster-affected area. Compared to satellites they have two big advantages. Firstly, drone images have a much higher resolution than satellite images, which means that disaster managers get a clearer picture of what is going on. Secondly, drones can fly under the clouds. This is particularly important after hurricanes or typhoons when it often takes two to three days before clouds dissipate and satellites are able to see the ground again. In Ecuador, for instance, following a recent earthquake, the local authorities worked closely with a network of volunteer drone pilots to find out which roads were at risk of being buried by landslides.</p>`,

                    text: `<p>Is making sign language with babies the new fad? The answer to this question is a resounding 'no'. People have been making signs—paralinguistic signals—with their babies for years. The most common reason for doing so is an intense desire on the part of a parent or caregiver to find out exactly what is going on in a baby's mind: What does she need? What does she want? What does she observe? It is a fact that infants develop the fine muscles in their hands before they develop those required for speech, so they are equipped to communicate with you before they can speak. That is why most babies invent their own 'signs' to get their meaning across. Communicating with babies via sign language has been proven to be beneficial to speech acquisition through years of research, and it is fun and inspirational.</p>`,

                    id: 't5p5',
                    label: 'Ancient dams',
                    text: `<p>The oldest known dam in the world is a masonry and earthen embankment at Jawa in the Black Desert of modern Jordan. The Jawa Dam was built in the 4th millennium BCE to hold back the waters of a small stream and allow increased irrigation production on arable land downstream. Evidence exists of another masonry-faced earthen dam built about 2700 BCE at Sadd el-Kafara, about 30km south of Cairo, Egypt. The Sadd el-Kafara failed shortly after completion when, in the absence of a spillway that could resist erosion, it was overtopped by a flood and washed away. The oldest dam still in use is a rockfill embankment about 6 metres high on the Orontes River in Syria, built about 1300 BCE for local irrigation use. The Assyrians, Babylonians and Persians built dams between 700 and 250 BCE for water supply and irrigation. Contemporary with these was the earthen Ma'rib Dam in the southern Arabian Peninsula, which was more than 15 metres high and nearly 600 metres long. Flanked by spillways, this dam delivered water to a system of irrigation canals for more than 1,000 years. Remains of the Ma'rib Dam are still evident in present-day Ma'rib, Yemen.</p>`,

                    label: 'Subliminal messages',
                    text: `<p>Subliminal messages have always been an uncanny phenomenon and often subject to scientific and public debate. A subliminal message is a signal in the form of a picture or sound that is designed to pass the normal limits of perception. This technique is sometimes used in movies and advertising to influence the subconscious of the viewer. Actually, public awareness of what we now term subliminal advertising began with the 1957 publication of Vance Packard's book, The Hidden Persuaders. Although Packard didn't use the term subliminal advertising, he did describe many of the new 'motivational research' marketing techniques being employed to sell products in the developing post-war American market. Advertisements that focused on consumers' hopes, fears, guilt and sexuality were designed to persuade them to buy products they had never realised they needed. Marketers who could reach into the hearts and minds of American consumers soon found consumers' wallets to be within easy grasp as well.</p>`,

                    text: `<p>Decades ago, mentally challenged kids were relegated to institutions, training programmes and group homes. Regarded as unteachable, they were trained to do basic menial tasks instead of being taught through reading and maths. That began to change in the 70s, when activist parents, backed by new federal laws, began pressing local school districts to mainstream intellectually disabled children and provide more community-based resources for them. At the same time, education specialists determined that many cognitively impaired children could learn more provided they received early, intensive intervention. School districts began devising programmes that mixed kids with disabilities into regular schools. Mainstreaming intellectually disabled kids paid off. The goal of many of the recent programmes is to help the children develop the skills they need to live more independently, and that means they can get jobs. For example, Ruth Barker, 23, an education major at Eagle Mountain College, is a typical undergraduate in many ways but has Down syndrome.</p>`,

                    id: 't7p1',
                    label: 'Ethical consumerism',
                    text: `<p>Ethical consumerism is a form of political activism based on the premise that purchasers consume not only goods but also, implicitly, the process used to produce them. From the point of view of ethical consumerism, consumption is a political act that sanctions the values embodied in a product's manufacture. By choosing certain products over others, consumers can embrace or reject particular environmental and labour practices and make other value claims based on the ethical values they hold. Exercising choice in this way creates incentives for producers to make production practices conform to consumer values. Successful campaigns waged by ethical consumer movements have popularized dolphin-free tuna, foods that are free of genetically modified organisms, fair-trade coffee and cosmetic products free from animal testing. The idea of using consumption as a lever of political change is rooted in boycotts organized by social movements against products, firms and even countries. As production migrates from the developed to the developing world, escaping the regulatory spheres of Western nation-states, consumer activists increasingly see ethical consumerism as a way to influence labour and environmental practices in faraway places.</p>`,

                    label: 'Witchcraft',
                    text: `<p>Witchcraft originated with the human civilization itself. The fear of the unknown and its imagined role in making our day-to-day life easy or difficult created witches and their craft. Even though witchcraft as such was practised mainly by experienced and old women, men also practised it. In ancient times, witchcraft was known as 'craft of the wise' as the wise persons were those who followed the path of nature and were in tune with its forces, had the knowledge of herbs and medicines, gave wise counsel and were held in high esteem as shamanic healers and leaders in their community. They understood that nature was superior to human beings and that human beings were simply one of the many parts of nature, both the visible and the invisible that combine to form one whole. As Chief Seattle said, "We do not own the earth; we are a part of it." They understood, unlike modern people, that what we take from nature or use, we must return in kind to maintain the balance.</p>`,

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  APP STATE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        const state = {
            currentTest: 'test1',
            currentPassageIdx: 0,
            // answers: { 't1q1': 1, ... }  // stores the selected option index
            answers: {},
            // highlight state: which question is currently highlighted
            highlightedQuestion: null,
        };

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  DOM refs
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        const $ = (id) => document.getElementById(id);
        const testNav = $('testNav');
        const passageTabs = $('passageTabs');
        const passageText = $('passageText');
        const questionList = $('questionList');
        const passageLabel = $('passageLabel');
        const questionCount = $('questionCount');
        const scoreDisplay = $('scoreDisplay');
        const resetBtn = $('resetBtn');

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  RENDER FUNCTIONS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        function getPassages() {
            const test = DATA[state.currentTest];
            return test ? test.passages : [];
        }

        function getCurrentPassage() {
            const passages = getPassages();
            return passages[state.currentPassageIdx] || null;
        }

        function renderTestNav() {
            const tests = Object.keys(DATA);
            testNav.innerHTML = tests.map((key, i) => {
                const label = key.replace('test', 'Test ');
                return `<button class="${key === state.currentTest ? 'active' : ''}" data-test="${key}">${label}</button>`;
            }).join('');
            testNav.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', () => {
                    state.currentTest = btn.dataset.test;
                    state.currentPassageIdx = 0;
                    state.answers = {};
                    state.highlightedQuestion = null;
                    renderAll();
                });
            });
        }

        function renderPassageTabs() {
            const passages = getPassages();
            passageTabs.innerHTML = passages.map((p, i) => {
                return `<button class="${i === state.currentPassageIdx ? 'active' : ''}" data-idx="${i}">${p.label}</button>`;
            }).join('');
            passageTabs.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', () => {
                    state.currentPassageIdx = parseInt(btn.dataset.idx);
                    state.answers = {};
                    state.highlightedQuestion = null;
                    renderAll();
                });
            });
        }

        function renderPassage() {
            const p = getCurrentPassage();
            if (!p) {
                passageText.innerHTML = '<p style="color:#999;">Parça bulunamadı.</p>';
                passageLabel.textContent = '—';
                return;
            }
            passageLabel.textContent = `${state.currentTest.replace('test','Test ')} · ${p.label}`;

            // Highlight: if a question is selected, we highlight its text in the passage.
            let html = p.text;
            if (state.highlightedQuestion) {
                // find the question data
                const q = p.questions.find(q => q.id === state.highlightedQuestion);
                if (q && q.highlight) {
                    // wrap the highlight text with a span
                    const hl = q.highlight.trim();
                    // escape special regex chars
                    const escaped = hl.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    const regex = new RegExp(escaped, 'g');
                    html = html.replace(regex, (match) => `<span class="hl">${match}</span>`);
                }
            }
            passageText.innerHTML = html;
        }

        function renderQuestions() {
            const p = getCurrentPassage();
            if (!p) {
                questionList.innerHTML = '<p style="color:#999;">Soru bulunamadı.</p>';
                questionCount.textContent = '0 soru';
                return;
            }
            questionCount.textContent = `${p.questions.length} soru`;

            let html = '';
            p.questions.forEach((q, idx) => {
                const selected = state.answers[q.id] !== undefined ? state.answers[q.id] : null;
                const isCorrect = selected !== null && selected === q.answer;
                const isWrong = selected !== null && selected !== q.answer;

                let optionsHtml = '';
                const letters = ['A', 'B', 'C', 'D', 'E'];
                q.options.forEach((opt, oi) => {
                    let cls = '';
                    if (selected === oi) {
                        cls = isCorrect ? 'selected-correct' : 'selected-wrong';
                    }
                    // show correct answer if user answered wrong
                    if (isWrong && oi === q.answer) {
                        cls += ' show-correct';
                    }
                    optionsHtml += `
                        <label class="${cls}">
                            <input type="radio" name="${q.id}" value="${oi}" ${selected === oi ? 'checked' : ''} />
                            <span class="letter">${letters[oi]}.</span>
                            ${opt}
                        </label>
                    `;
                });

                let feedbackHtml = '';
                if (selected !== null) {
                    feedbackHtml = `<div class="feedback ${isCorrect ? 'correct' : 'wrong'}">
                        ${isCorrect ? '✅ Doğru!' : '❌ Yanlış. Doğru cevap: ' + letters[q.answer]}
                    </div>`;
                }

                html += `
                    <div class="q-item" data-qid="${q.id}">
                        <div class="q-text"><span class="q-num">${idx+1}</span> ${q.text}</div>
                        <div class="options">${optionsHtml}</div>
                        ${feedbackHtml}
                    </div>
                `;
            });

            questionList.innerHTML = html;

            // attach event listeners to radio inputs
            questionList.querySelectorAll('input[type="radio"]').forEach(input => {
                input.addEventListener('change', (e) => {
                    const qid = input.name;
                    const val = parseInt(input.value);
                    const p = getCurrentPassage();
                    const q = p.questions.find(q => q.id === qid);
                    if (!q) return;

                    state.answers[qid] = val;
                    state.highlightedQuestion = qid;
                    renderAll();
                });
            });

            // update score
            updateScore();
        }

        function updateScore() {
            const p = getCurrentPassage();
            if (!p) { scoreDisplay.textContent = '0 / 0'; return; }
            let correct = 0;
            let total = p.questions.length;
            p.questions.forEach(q => {
                if (state.answers[q.id] !== undefined && state.answers[q.id] === q.answer) {
                    correct++;
                }
            });
            scoreDisplay.textContent = `${correct} / ${total}`;
        }

        function renderAll() {
            renderTestNav();
            renderPassageTabs();
            renderPassage();
            renderQuestions();
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  RESET
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        resetBtn.addEventListener('click', () => {
            state.answers = {};
            state.highlightedQuestion = null;
            renderAll();
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  INIT
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        renderAll();

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  KEYBOARD SHORTCUT: reset with 'r'
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        document.addEventListener('keydown', (e) => {
            if (e.key === 'r' && !e.ctrlKey && !e.metaKey) {
                resetBtn.click();
            }
        });

        console.log('📖 YDT Reading Test Book loaded! Click an answer to see the highlight in the passage.');
        console.log('🔄 Press "r" to reset all answers.');
    </script>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />

    <title>YDT Test Book – Tüm Bölümler</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #f6f8fc; color: #1a2332;
            padding: 20px;
        }
        .container { max-width: 1440px; margin: 0 auto; }

        header {
            background: linear-gradient(135deg, #0b1a33, #1a3a5c);
            color: #fff; padding: 18px 28px; border-radius: 20px;
            margin-bottom: 24px; display: flex; flex-wrap: wrap;
            align-items: center; justify-content: space-between; gap: 12px;
            box-shadow: 0 8px 24px rgba(0,20,40,.2);
        }
        header h1 { font-weight: 600; font-size: 1.5rem; }
        header h1 small { font-weight: 400; font-size: .85rem; opacity: .75; margin-left: 10px; }
        .nav-group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
        .nav-group select, .nav-group button {
            background: rgba(255,255,255,.12);
            border: none; color: #fff; padding: 6px 14px;
            border-radius: 40px; font-weight: 600; font-size: .8rem;
            cursor: pointer; transition: .2s;
        }
        .nav-group select option { color: #1a2332; background: #fff; }
        .nav-group button:hover { background: rgba(255,255,255,.25); }
        .nav-group button.active { background: #ffd966; color: #0b1a33; }

        .reader { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media (max-width:900px) { .reader { grid-template-columns: 1fr; } }

        .card {
            background: #fff; border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,.04);
            padding: 22px 26px; border: 1px solid rgba(0,0,0,.04);
        }
        .card-title {
            font-weight: 600; font-size: .8rem; text-transform: uppercase;
            color: #4a5b7a; letter-spacing: .3px; margin-bottom: 14px;
            border-bottom: 2px solid #eef2f7; padding-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .card-title span { background: #eef2f7; padding: 2px 12px; border-radius: 40px; font-size: .7rem; color: #2a3a5a; }

        .passage-text {
            font-size: .96rem; line-height: 1.75; color: #1e2a3e;
            max-height: 70vh; overflow-y: auto; padding-right: 6px;
        }
        .passage-text p { margin-bottom: 1em; }
        .passage-text .hl { background: #fae77c; padding: 0 4px; border-radius: 6px; font-weight: 500; }
        .passage-text .hl.correct { background: #7bcfa6; }
        .passage-text .blank-marker {
            display: inline-block; background: #eef2f7; border-radius: 6px;
            padding: 0 12px; color: #2a3a5a; font-weight: 700;
            border: 1px dashed #8a9bb8; min-width: 80px; text-align: center;
        }
        .passage-text .inserted { background: #d4efe4; border-radius: 6px; padding: 0 6px; font-weight: 600; }

        .question-list { max-height: 70vh; overflow-y: auto; padding-right: 4px; }
        .q-item {
            background: #fafcff; border-radius: 14px; padding: 16px 18px;
            margin-bottom: 16px; border: 1px solid #e9edf4;
        }
        .q-item:hover { border-color: #c8d4e6; }
        .q-text { font-weight: 600; font-size: .94rem; margin-bottom: 10px; color: #0f1e32; }
        .q-text .q-num {
            display: inline-block; background: #0b1a33; color: #fff;
            width: 26px; height: 26px; text-align: center; line-height: 26px;
            border-radius: 40px; font-size: .75rem; margin-right: 10px;
        }
        .options { display: flex; flex-direction: column; gap: 6px; }
        .options label {
            display: flex; align-items: center; gap: 10px;
            padding: 7px 14px; border-radius: 10px; background: #f4f7fc;
            border: 2px solid transparent; cursor: pointer; font-size: .9rem;
        }
        .options label:hover { background: #e9eff8; }
        .options label .letter { font-weight: 700; color: #3a5a7a; min-width: 22px; }
        .options input[type="radio"] { accent-color: #1a3a5c; width: 18px; height: 18px; cursor: pointer; flex-shrink: 0; }
        .options label.selected-correct { border-color: #2b8c5e; background: #e1f5ed; }
        .options label.selected-wrong { border-color: #c94a4a; background: #fde8e8; }
        .options label.show-correct { border-color: #2b8c5e; background: #e1f5ed; }

        .feedback { margin-top: 8px; font-size: .85rem; font-weight: 500; padding: 4px 14px; border-radius: 40px; display: inline-block; background: #f0f3f9; color: #3a4a6a; }
        .feedback.correct { background: #d4efe4; color: #1a6a44; }
        .feedback.wrong { background: #fce3e3; color: #b33a3a; }

        .status-bar {
            display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
            margin-top: 20px; padding: 12px 20px; background: #eef2f7; border-radius: 16px;
            font-size: .85rem; color: #2a3a5a;
        }
        .status-bar .score { font-weight: 700; color: #0b1a33; }
        .status-bar .reset-btn { background: none; border: none; color: #4a6a8a; font-weight: 600; cursor: pointer; padding: 6px 16px; border-radius: 40px; }
        .status-bar .reset-btn:hover { background: #dce4ef; }

        .passage-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        .passage-tabs button { background: #eef2f7; border: none; padding: 4px 16px; border-radius: 40px; font-weight: 500; font-size: .8rem; color: #2a3a5a; cursor: pointer; }
        .passage-tabs button:hover { background: #dce4ef; }
        .passage-tabs button.active { background: #0b1a33; color: #fff; }

        .passage-text::-webkit-scrollbar, .question-list::-webkit-scrollbar { width: 5px; }
        .passage-text::-webkit-scrollbar-track, .question-list::-webkit-scrollbar-track { background: #eef2f7; border-radius: 10px; }
        .passage-text::-webkit-scrollbar-thumb, .question-list::-webkit-scrollbar-thumb { background: #bcc8dd; border-radius: 10px; }
        @media (max-width:600px) { body { padding: 12px; } header { padding: 16px; flex-direction: column; align-items: stretch; } .card { padding: 16px; } .q-item { padding: 12px 14px; } .options label { font-size: .85rem; padding: 6px 12px; } }
    </style>
</head>

<script>
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  TÜM VERİ – Part 1 (Okuma), Part 2 (Paragraf Tamamlama),
    //  Part 3 (İlgisiz Cümle), Part 4 (Çeviri)
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    const DATA = {
        // ─── PART 1: READING PASSAGES (Test 1–11) ───
        part1: {
            name: "Okuma",
            tests: [
                // Test 1 (tam)
                {
                    id: 't1',
                    passages: [
                        {
                            id: 't1p1', label: 'Kraftwerk',
                            text: `<p>The German music band Kraftwerk is, for many, nothing less than the progenitor of electronic music. As these pioneering musicians continue to break old ground, decades after their first appearance, one cannot fail to notice that very few groups nowadays could lay claim to such an influential and prodigious career. Can anyone find today an equivalent to the legendary bands of the 60s, 70s or early 80s among contemporary groups? It seems that innovation is not on the agenda of the companies who control the profitable music industry. Therefore, bands tend to play safe by clinging to the most profitable, well-established and less risky forms of music. However, if music is a form of art rather than mere entertainment, the companies who dictate the rules of the game called music will have to allow for artists who are passionate, unsafe and ready to experiment.</p>`,
                            questions: [
                                { id: 't1q1', text: 'It can be understood from the passage that Kraftwerk', options: ['was long forgotten when people met new innovative groups', 'is a case of innovative music bands who dare to try new things in music', 'was profit-orientated and very successful', 'exerted influence back in the 70s and 80s', 'is the most famous music band in Germany due to their success in their style'], answer: 1, highlight: 'The German music band Kraftwerk is, for many, nothing less than the progenitor of electronic music. As these pioneering musicians continue to break old ground' },
                                { id: 't1q2', text: 'It is clear from the passage that music companies', options: ['try hard to give opportunities for the ones who are passionate musicians', 'are reluctant to invest in groups who play electronic music', 'would not sign a contract with an old-fashioned group like Kraftwerk', 'do not seek innovative musicians but those who bring money in the market', 'are trying to encourage experimental artists who have more potential'], answer: 3, highlight: 'It seems that innovation is not on the agenda of the companies who control the profitable music industry. Therefore, bands tend to play safe by clinging to the most profitable, well-established and less risky forms of music.' },
                                { id: 't1q3', text: 'According to the passage, why are today\'s music groups not doing as well as those in the past?', options: ['They try to make art and produce new styles instead of entertaining their audience.', 'They take risks in order to produce experimental styles.', 'The priority of music industry is to earn money rather than make art.', 'Music industry cannot find many innovative musicians as they used to.', 'Most of them play electronic music, which is not applauded by the public.'], answer: 2, highlight: 'It seems that innovation is not on the agenda of the companies who control the profitable music industry. Therefore, bands tend to play safe by clinging to the most profitable, well-established and less risky forms of music.' }
                            ]
                        },
                        {
                            id: 't1p2', label: 'Viking surnames',
                            text: `<p>Surnames ending with the suffix -son in the area of Yorkshire in England are very common. This apparently insignificant piece of information tells a big story, though. Namely, it reflects the predominance of inhabitants who are descendants of Scandinavian Vikings in this region of Northern Britain. Many British with Scandinavian roots are trying to rediscover, revive and promote their Nordic identity. Traditions coming from the Vikings are increasingly popular, especially in remote areas in the north of Scotland. Many claim these revivals as another fashion which simply indicates the need of people to be part of a community. The criticism against resurgent traditionalism is that it has little to do with respect for tradition itself. Conversely, those who are fascinated with rediscovered roots are just trying to form some sort of collective identity within an uncertain and fragmented contemporary world.</p>`,
                            questions: [
                                { id: 't1q4', text: 'It is stated in the passage that the high percentage of Nordic surnames in the area of Yorkshire', options: ['shows the frequency of Viking ancestry there', 'proves that Vikings are still dominant there', 'is not the only sign of the Viking heritage in Northern Britain', 'is exclusive to this area', 'has nothing to do with Scandinavian people'], answer: 0, highlight: 'Surnames ending with the suffix -son in the area of Yorkshire in England are very common. This apparently insignificant piece of information tells a big story, though. Namely, it reflects the predominance of inhabitants who are descendants of Scandinavian Vikings in this region of Northern Britain.' },
                                { id: 't1q5', text: 'What can be inferred from the passage about the recent revival of Viking traditions in Northern Britain?', options: ['It relates to the influence that Vikings exert.', 'It shows that many people in the area see themselves as Viking rather than British.', 'It can be attributed to the large number of Vikings who once lived there.', 'It disturbs many British people and cause unrest in the country.', 'It shows the need of contemporary people for a sense of belonging in a community.'], answer: 4, highlight: 'Many claim these revivals as another fashion which simply indicates the need of people to be part of a community.' },
                                { id: 't1q6', text: 'What is the passage mainly about?', options: ['The importance of keeping traditions alive', 'The multicultural background of Yorkshire', 'Contemporary identity issues and the way they are reflected on traditionalism', 'Ethnic minorities and their effort to safeguard their identity today', 'The difficulty to maintain an ethnic identity in the contemporary world'], answer: 2, highlight: 'Conversely, those who are fascinated with rediscovered roots are just trying to form some sort of collective identity within an uncertain and fragmented contemporary world.' }
                            ]
                        },
                        {
                            id: 't1p3', label: 'Re-enactment',
                            text: `<p>What makes grown-up people all over the world dress up as knights or soldiers or as an Indian warrior or a Napoleonic soldier to re-enact battles? The phenomenon of historical re-enactment is amazing in that so many people are prepared to spend time and money to do what would have been inconceivable a few decades ago. The defenders of this new fashion say that through re-enactments they can feel history in their skin and that playing the role of a Roman legionnaire is not childish but a way to witness history from the inside. Yet, personally I believe it all boils down to an effort to gain permission to play but, of course, with more expensive toys. Fancy as these staged battles might be, they appear to me as a struggle to cling to the carelessness of childhood. On top of that, history cannot be grasped by wearing a uniform or an armour.</p>`,
                            questions: [
                                { id: 't1q7', text: 'It is clear from the passage that those who partake in re-enactments', options: ['feel that they want to remain children', 'do it for the pleasure of wearing uniforms', 'perceive it as a way of identifying with historical figures and events', 'give priority to historical accuracy and so they spend great effort to revive the events', 'prefer to do it in order to have fun just like children do'], answer: 2, highlight: 'The defenders of this new fashion say that through re-enactments they can feel history in their skin and that playing the role of a Roman legionnaire is not childish but a way to witness history from the inside.' },
                                { id: 't1q8', text: 'It is evident that the writer of the passage', options: ['has a great admiration for those who spend time and money to re-enact battles', 'sees these events as waste of resources', 'is very sceptical with the claims of those who participate in the re-enactments', 'defends the right of grown-ups to enjoy the experience of those re-enactments', 'believes re-enactments are necessary to witness historical events'], answer: 2, highlight: 'Yet, personally I believe it all boils down to an effort to gain permission to play but, of course, with more expensive toys. Fancy as these staged battles might be, they appear to me as a struggle to cling to the carelessness of childhood.' },
                                { id: 't1q9', text: 'It is implied in the passage that history', options: ['can be experienced by re-enactments', 'is too complex to be understood by those taking part in these events', 'is too serious a field of knowledge to become part of childish re-enactments', 'is better grasped by experiencing it through games, just like children learn through toys', 'cannot be understood by means of role-playing alone'], answer: 4, highlight: 'On top of that, history cannot be grasped by wearing a uniform or an armour.' }
                            ]
                        },
                        {
                            id: 't1p4', label: 'Skull fashion',
                            text: `<p>Meet one of the love affairs of designers. It is called the skull. Everywhere, from children's woollen hats to expensive fashion accessories, skulls seem to be the must-have sensational detail. These universal symbols of death sometimes come in glittering pink, sometimes as valuable stones. Some say that designers will use anything that attracts attention. Some others even think that the frequent use of smiling or colourful skulls reflects an effort to make death more acceptable. Likewise, some even believe there is a conspiracy behind this persistent unpleasant image. Namely, they claim that, in a war-torn period of history, there is a plan to make people used to the image of death to make it seem normal, even entertaining. But most people simply find this fashion either distasteful or 'cool'. At the end of the day, beauty is in the mind of the beholder.</p>`,
                            questions: [
                                { id: 't1q10', text: 'It can be understood from the passage that the writer', options: ['does not take a clear position as to why skulls are often used by designers', 'is very critical of designers for using this unpleasant image in their creations', 'has no opinion about the issue of skulls', 'cannot understand why people get upset by what designers decide to use', 'believes that designers who use skulls are doing so because of a hidden agenda'], answer: 0, highlight: 'At the end of the day, beauty is in the mind of the beholder.' },
                                { id: 't1q11', text: 'Which of the following can be concluded from the passage?', options: ['Opinions about the use of skulls in fashion is mostly neutral because people don\'t take the issue of skulls seriously.', 'Skulls represent death, and the use of them in the fashion industry should not be accepted easily however cutely it is presented.', 'People have different opinions about the use of skulls on fashion items.', 'Designs with sparkly, colourful skulls are distasteful.', 'People\'s opinions on this trend can be manipulated by the design industry.'], answer: 2, highlight: 'Some say that designers will use anything that attracts attention. Some others even think that the frequent use of smiling or colourful skulls reflects an effort to make death more acceptable. Likewise, some even believe there is a conspiracy behind this persistent unpleasant image. But most people simply find this fashion either distasteful or \'cool\'.' },
                                { id: 't1q12', text: 'The passage is mostly about', options: ['the unacceptable use of the symbol of death by designers', 'the difficult choices designers are facing', 'the problems arising when both morality and aesthetics are compromised', 'the different significance people can attribute towards the same thing', 'how peoples attitudes towards a specific phenomenon are formed'], answer: 3, highlight: 'At the end of the day, beauty is in the mind of the beholder.' }
                            ]
                        },
                        {
                            id: 't1p5', label: 'London balconies',
                            text: `<p>London is a city full of balconies, especially inside its historical centre. But hardly any people can be seen on them. Londoners do not necessarily have the habit of spending time on their exquisite balconies. Conversely, in countries such as Spain or Italy, people seem to spend more time on their balconies and yards than indoors. Filled with colourful flowers, those balconies and yards are pleasantly inviting. One could assume that the different attitudes between the British and their Southern neighbours relate to weather, but even over warm summer days few British will venture the great outdoors. If one watches more closely, it is not only people but even personal items which are absent from these spaces exposed to the public eye. Eventually, it is exactly the way North Europeans perceive public as opposed to private space, in relation to their Southern counterparts, which accounts for these different attitudes. While Italians are happy to chat endlessly with neighbours, the British will avoid exposing themselves to public scrutiny, or their laundry, for that matter.</p>`,
                            questions: [
                                { id: 't1q13', text: 'It can be understood from the passage that North Europeans, especially the British,', options: ['believe that South Europeans are reckless', 'avoid using balconies because of their attitude towards privacy', 'do not tend to use their balconies mostly because of the cold weather', 'don\'t like to have balconies in their homes', 'think that sitting outside on a balcony is a very South European habit for their taste'], answer: 1, highlight: 'Eventually, it is exactly the way North Europeans perceive public as opposed to private space, in relation to their Southern counterparts, which accounts for these different attitudes. While Italians are happy to chat endlessly with neighbours, the British will avoid exposing themselves to public scrutiny, or their laundry, for that matter.' },
                                { id: 't1q14', text: 'Which of the following could be the best title for the passage?', options: ['Different Cultures, Different Habits', 'The Right Way to Use Balconies', 'Attraction of British Balconies', 'Change in the Styles of Buildings', 'Stereotypes of Northern Europe'], answer: 0, highlight: 'Eventually, it is exactly the way North Europeans perceive public as opposed to private space, in relation to their Southern counterparts, which accounts for these different attitudes.' },
                                { id: 't1q15', text: 'It is implied in the passage that', options: ['people\'s habits relate, to a great extent, to their cultural background', 'the cultural background can change due to the country\'s geographical location', 'differences in habits with regard to minor issues are insignificant', 'one can often have the habit of using a balcony depending on the climate', 'the weather dictates different habits'], answer: 0, highlight: 'Eventually, it is exactly the way North Europeans perceive public as opposed to private space, in relation to their Southern counterparts, which accounts for these different attitudes.' }
                            ]
                        },
                        {
                            id: 't1p6', label: 'Professionalism',
                            text: `<p>So what does professionalism mean for teachers? The answer seems to be self-evident, while for many this is a useless question. Of course, professionalism is about delivering the lesson in a faultless way, planning ahead and responding to students' needs. Or is it that we are missing something here? All these nice sounding words cover up the fact that many teachers have very different definitions for all the above. What, for instance, does it mean to respond to students' needs? Who dictates what the needs or the appropriate response to them are? Well, you start to get the point: Things which are taken for granted are precisely those which have to be clearly defined before we develop a common language about what professionalism in education is about.</p>`,
                            questions: [
                                { id: 't1q16', text: 'It can be understood from the passage that professionalism within education', options: ['means doing whatever is asked for by students in a classroom and meeting their needs', 'is a term that needs to be looked at more closely', 'creates great opportunities for learners as well as teachers', 'does not mean much to many teachers, let alone students', 'is luckily a commonly accepted term that is adopted in classrooms'], answer: 1, highlight: 'Things which are taken for granted are precisely those which have to be clearly defined before we develop a common language about what professionalism in education is about.' },
                                { id: 't1q17', text: 'Which of the following best describes the writer\'s beliefs?', options: ['No one can tell what professionalism really is.', 'Professionalism dictates what the appropriate response to students\' needs is.', 'Educationalists have to find common ground on the issue of professionalism.', 'Many educators are unprofessional, which leads to problems in education.', 'There is no agreement on the importance of professionalism on education.'], answer: 2, highlight: 'Things which are taken for granted are precisely those which have to be clearly defined before we develop a common language about what professionalism in education is about.' },
                                { id: 't1q18', text: 'The passage is mainly about', options: ['the importance of employing really professional teachers', 'the problem of unprofessional teachers who do not realise what education is about', 'modern ideas about professionalism in education', 'the tension between those who have a vision about education and those who don\'t', 'the necessity of making out the concept of professionalism in education'], answer: 4, highlight: 'Things which are taken for granted are precisely those which have to be clearly defined before we develop a common language about what professionalism in education is about.' }
                            ]
                        },
                        {
                            id: 't1p7', label: 'Sales psychology',
                            text: `<p>We all know how alluring sales are for customers. What most of us don't know is how sales work. That is, most of us have no idea what it is exactly that makes people rush into shops when sales are on. Psychologists have proven that prospective customers do not really pay so much attention to what they are going to spend as how much they are going to save when they grab a bargain. In other words, when a consumer sees an item reduced from 70 pounds to 40, she or he is not going to think this is going to cost me 40 but hey, by buying this I'm saving 30. So, all a cunning merchant has to do is pump up the initial price by, for example, 25% and then reduce it by the same percentage, presenting it as a 'sale'.</p>`,
                            questions: [
                                { id: 't1q19', text: 'It can be understood from the passage that the writer', options: ['knows well why and how sales work on customers', 'believes that merchants should put goods into sale after increasing their prices', 'encourages merchants to raise their prices so that they can afford to sell on sale', 'finds it unacceptable for merchants to put items on sales after raising their price', 'believes sales are effectively necessary for customers'], answer: 0, highlight: 'Psychologists have proven that prospective customers do not really pay so much attention to what they are going to spend as how much they are going to save when they grab a bargain.' },
                                { id: 't1q20', text: 'The passage implies that the ways people make their choices before buying a good', options: ['depend on the price of an item', 'are usually related to their need for it', 'are a subject researched by psychologists for a long time', 'can be easily manipulated by merchants', 'are usually variable depending on the season the sales take place in'], answer: 3, highlight: 'So, all a cunning merchant has to do is pump up the initial price by, for example, 25% and then reduce it by the same percentage, presenting it as a \'sale\'.' },
                                { id: 't1q21', text: 'According to the writer, which of the following is true when a product is down to 40 pounds from 70?', options: ['A sensible consumer should better buy an item without thinking much.', 'The consumer will prioritise opportunity over expenditure and is likely to buy it.', 'It is the right time for the consumer to buy an item.', 'The consumer should just think of how much they will save by buying it.', 'People should think only if they really need a particular item rather than focus on the price tag.'], answer: 1, highlight: 'when a consumer sees an item reduced from 70 pounds to 40, she or he is not going to think this is going to cost me 40 but hey, by buying this I\'m saving 30.' }
                            ]
                        },
                        {
                            id: 't1p8', label: 'Lyme disease',
                            text: `<p>Lyme disease is a relatively new threat spreading across Europe and North America. Humans can develop this life-threatening disease from tick bites. Deer ticks attach themselves to passersby, and if they remain unnoticed on the skin for more than 36 hours, they can contaminate the blood stream with a bacillus which can trigger Lyme disease. Not every person contaminated by this bacillus will develop this condition, which attacks the nervous system with often crippling consequences. However, the percentage of those who will do so is quite high. People should take extra precautions when walking in forests and prefer clothes with light colours which make attached ticks more visible and easy to remove afterwards. Exposed hands and especially feet are not a good idea; thus, long sleeves and trousers are advisable. There are different theories about where this bacillus came from, but there is little disagreement on what precautions should be taken.</p>`,
                            questions: [
                                { id: 't1q22', text: 'It can be understood from the passage that there are uncertain assumptions about', options: ['which measures should be taken when a tick bites a human', 'the origin of the bacillus', 'what carries the disease', 'how the disease can be passed on to humans', 'the relation of ticks to the disease'], answer: 1, highlight: 'There are different theories about where this bacillus came from' },
                                { id: 't1q23', text: 'What is the author\'s primary purpose in this passage?', options: ['To explain the consequences of Lyme disease', 'To give examples of possible symptoms of Lyme disease', 'To inform the reader about Lyme disease', 'To present where Lyme disease is spreading', 'To teach people which precautions to take against Lyme disease'], answer: 2, highlight: 'Lyme disease is a relatively new threat spreading across Europe and North America.' },
                                { id: 't1q24', text: 'It is implied in the passage that if a deer tick stays more than 36 hours attached on a person', options: ['it has little affect on diseases', 'it becomes less dangerous for the body', 'it may infect the body for a short time', 'the bacillus will possibly die as it can\'t survive that long', 'it runs a considerable risk of a potentially fatal disease'], answer: 4, highlight: 'if they remain unnoticed on the skin for more than 36 hours, they can contaminate the blood stream with a bacillus which can trigger Lyme disease.' }
                            ]
                        }
                    ]

                        {
                            id: 'p2t1q1', label: 'Soru 1',
                            text: `<p>Neptune has 13 known moons, six of which were discovered by Voyager 2. <span class="blank-marker">___</span> This moon is the coldest body yet visited in our solar system as temperatures on its surface are about -235 degrees Celsius. Despite this deep freeze, Voyager 2 discovered geysers spewing icy material upward more than eight kilometres.</p>`,
                            questions: [
                                { id: 'p2t1q1', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['Neptune\'s winds are three times stronger than Jupiter\'s winds and nine times stronger than those of Earth.', 'The main axis of Neptune\'s magnetic field is "tipped over" by about 47 degrees compared with the planet\'s rotation axis.', 'Neptune\'s atmosphere extends to great depths, gradually merging into water.', 'The largest, Triton, orbits Neptune in a direction opposite to the direction of the planet\'s rotation.', 'Nearly 4.5 billion kilometres from the Sun, Neptune orbits the Sun once every 165 years.'], answer: 3, highlight: 'The largest, Triton, orbits Neptune in a direction opposite to the direction of the planet\'s rotation.' }
                            ]
                        },
                        {
                            id: 'p2t1q2', label: 'Soru 2',
                            text: `<p>There is no fixed length for a musical. However, most musicals range from one and a half hours to three hours. They are generally presented in two acts with one intermission ten to twenty minutes long. The first act is frequently longer than the second act. <span class="blank-marker">___</span></p>`,
                            questions: [
                                { id: 'p2t1q2', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['In addition, there are vibrant musical theatre scenes in many countries in Europe.', 'The three main components of musicals are the music, the lyrics and the book.', 'It can range from a short one-act entertainment to several acts and several hours in length.', 'It is better if it is performed in the language of its audience.', 'There is less time to develop drama in a musical than in a straight play of equivalent length.'], answer: 2, highlight: 'It can range from a short one-act entertainment to several acts and several hours in length.' }
                            ]
                        },
                        {
                            id: 'p2t1q3', label: 'Soru 3',
                            text: `<p>Tristan and Isolde were two lovers who were much more popular before Romeo and Juliet. As in Shakespeare's, the legend of Tristan and Isolde is the tragic tale of two lovers fated to share a forbidden but undying love. <span class="blank-marker">___</span> However, while Shakespeare doesn't tell us what happens after their characters' death, we know that Tristan and Isolde are buried in Cornwall. From Isolde's grave a rose tree grows, and from Tristan's comes a vine that wraps itself around the tree. It's a sign that the two lovers cannot be parted in death.</p>`,
                            questions: [
                                { id: 'p2t1q3', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['Every time the vine is cut, it gracefully grows again.', 'Romeo and Juliet are two lovers who both pass away tragically.', 'Tristan and Isolde are a lot more than mythological characters.', 'Tristan dies of grief, thinking that Isolde has betrayed him, and Isolde dies over his dead body.', 'While the details of the story may differ, the overall plot structure remains much the same.'], answer: 3, highlight: 'Tristan dies of grief, thinking that Isolde has betrayed him, and Isolde dies over his dead body.' }
                            ]
                        },
                        {
                            id: 'p2t1q4', label: 'Soru 4',
                            text: `<p>Sign language is often used by people with hearing loss. In the United States, for example, American Sign Language is primarily used, while in the United Kingdom, British Sign Language is most commonly used. <span class="blank-marker">___</span> Although it may seem that all forms of sign language are universal, they are usually very different from one another.</p>`,
                            questions: [
                                { id: 'p2t1q4', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['One of the earliest written records of a sign language is in Plato\'s Cratylus.', 'There are many kinds of sign language in different places all over the world.', 'Sign languages do not have a formal written form.', 'American Sign Language is thought to be the fourth most commonly used language.', 'The Internet now allows people who are hard of hearing to talk via video links.'], answer: 1, highlight: 'There are many kinds of sign language in different places all over the world.' }
                            ]
                        },
                        {
                            id: 'p2t1q5', label: 'Soru 5',
                            text: `<p>The Gulf Stream is an ocean current that brings warm water from the Gulf of Mexico into the Atlantic Ocean. It extends along the eastern coast of the United States and Canada and influences the climate of the east coast of Florida, keeping temperatures there warmer in the winter and cooler in the summer than the other south-eastern states. Since the Gulf Stream also extends towards Europe, it warms western European countries as well. <span class="blank-marker">___</span> If it weren't for the warm water of the Gulf Stream, it would suffer from much lower temperatures.</p>`,
                            questions: [
                                { id: 'p2t1q5', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['While the waters of the North Atlantic will cool as a result of changes in the flow, it\'s likely that the UK will see impacts of climate change.', 'For instance, England is the same distance from the equator as cold regions of Canada, yet England enjoys a much warmer climate.', 'As the warm water comes in, colder, denser water sinks and begins moving south, eventually flowing along the bottom of the ocean all the way to Antarctica.', 'Whether they are located far inland or right by the coast, all the European countries greatly benefit from the current\'s warming effect.', 'Satellite images of sea surface temperature can show the path of the warm Gulf Stream current with great precision.'], answer: 1, highlight: 'For instance, England is the same distance from the equator as cold regions of Canada, yet England enjoys a much warmer climate.' }
                            ]
                        },
                        {
                            id: 'p2t1q6', label: 'Soru 6',
                            text: `<p>Humans have always looked at the heavens and wondered about the nature of the objects seen in the night sky. With the advances in technology in the 20th century, it became possible to send machines and animals and then people above Earth's atmosphere into outer space. Well before technology made these achievements possible, however, space exploration had already captured the minds of many people. <span class="blank-marker">___</span> It perhaps also reveals why space exploration has been a common and enduring theme in literature and art.</p>`,
                            questions: [
                                { id: 'p2t1q6', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['For most of the latter 20th century, only national governments could afford the very high costs of launching people and machines into space.', 'Space flight enables humans to explore the universe and understand the many objects and phenomena that are better observed from a space perspective.', 'The strong hold that space travel has always had on the imagination may well explain why people consent at their great peril to travel into space.', 'As centuries of speculative fiction in books make clear, one giant leap for mankind was taken by the human spirit.', 'Regardless, Gagarin still set the record as the first person to leave Earth\'s orbit and travel into space.'], answer: 2, highlight: 'The strong hold that space travel has always had on the imagination may well explain why people consent at their great peril to travel into space.' }
                            ]
                        },
                        {
                            id: 'p2t1q7', label: 'Soru 7',
                            text: `<p>Rembrandt is generally considered one of the greatest painters in European art history and the most important in Dutch history. His contributions to art came in a period that historians call the Dutch Golden Age. <span class="blank-marker">___</span> On the other hand, his paintings were popular throughout his lifetime and his reputation as an artist remained high.</p>`,
                            questions: [
                                { id: 'p2t1q7', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['Rembrandt\'s greatest creative triumphs are exemplified especially in his portraits of his contemporaries.', 'At the end of 1631 Rembrandt began to practise as a professional artist for the first time.', 'At one time ninety paintings were counted as his self-portraits, but it is now known that he had his students\' copies.', 'Although having achieved youthful success as a painter, he later led a tragic life and suffered financial hardship.', 'In the 1650s, Rembrandt\'s style changed again, in which colours became richer and brush strokes more pronounced.'], answer: 3, highlight: 'Although having achieved youthful success as a painter, he later led a tragic life and suffered financial hardship.' }
                            ]
                        },
                        {
                            id: 'p2t1q8', label: 'Soru 8',
                            text: `<p>She was raised by her father because her mother had passed away when she was young. One year on Mother's Day, she decided that the hard work of fathers like her own and like many others deserved a day for recognition too. She decided to celebrate her new holiday in June because that was the month her wonderful father had been born in. <span class="blank-marker">___</span></p>`,
                            questions: [

                            ]
                        },
                        {
                            id: 'p2t1q9', label: 'Soru 9',
                            text: `<p>Water shortages can occur in any country because the average daily consumption of water has risen dramatically per person in recent years. <span class="blank-marker">___</span> To overcome these problems, people are encouraged to limit their consumption, and the water companies are being forced to repair pipes.</p>`,
                            questions: [

                            ]
                        },

                            text: `<p>Although tornadoes can happen at any time of the year, they are especially common during spring and early summer. <span class="blank-marker">___</span> However, April appears to be the deadliest month—an average of 27 tornado deaths occurred during this month between 1950 and 1999, and one of the all-time worst tornado disasters occurred on April 26, 1989.</p>`,
                            questions: [

                        {
                            id: 'p2t1q11', label: 'Soru 11',
                            text: `<p>The word Iguana is derived from a Spanish form of the Taino name for the species Iwana. <span class="blank-marker">___</span> In the more than two centuries since then, no less than 17 species and subspecies have been identified. They are organised into nine broad categories including rock iguanas, desert iguanas and green iguanas.</p>`,

                            text: `<p>The advantages of biomass energy, obtained by burning organic material, may be offset by environmental concerns. Unlike most other renewable sources, biomass fuels can create air pollution and desertification problems when used on a wide scale. Moreover, in arid regions, a common sequence of events produces a scenario of environmental destruction, which ultimately leads to desertification. <span class="blank-marker">___</span></p>`,

                            text: `<p>Divers need a series of equipment for scuba diving including a wetsuit, scuba and regulator. They wear the scuba, so they can breathe under water. The scuba contains a cylinder of compressed air, which divers carry on their backs. Divers breathe through a regulator, which decompresses the air as it comes out of the cylinder. <span class="blank-marker">___</span></p>`,

                        {
                            id: 'p2t1q17', label: 'Soru 17',
                            text: `<p>While many people associate traditional spas with Roman baths, there is evidence of spa-type therapies dating back thousands of years when there was a belief in the curative powers of mineral waters. One of the first written accounts of bathing being used as a curative process was by ancient Greek philosopher Hippocrates, who advocated that the way to health is to have an aromatic bath every day. <span class="blank-marker">___</span> Its influence can be seen today in everything from mineral-infused treatments to thalassotherapy—swimming in seawater to heal the skin.</p>`,

                            text: `<p>Polio is an infectious disease which has been eradicated from many countries through vaccination programmes. <span class="blank-marker">___</span> Others may be advised when travelling to parts of the world where there is a special risk of a disease. Most are given by injection, although one form of polio vaccine is given by drops, for swallowing.</p>`,

                        {

                            text: `<p><strong>Kaynak cümle:</strong> Economic growth, which is a necessary condition for economic development, is not sufficient on its own to ensure an increase in economic welfare.</p>`,
                            questions: [

                        {
                            id: 'p4t1q13', label: 'Soru 13',
                            text: `<p><strong>Kaynak cümle:</strong> Unfortunately, many Indigenous languages that convey communities' histories, traditions, ways of thinking and environmental knowledge are in danger of disappearing.</p>`,
                            questions: [
                                { id: 'p4t1q13', text: 'Bu cümleye anlamca en yakın Türkçe çeviri hangisidir?', options: ['Ne yazık ki, yok olma tehlikesiyle karşı karşıya olan pek çok dil, toplumların tarihlerini, geleneklerini, düşünme şekillerini ve çevresel bilgilerini bize aktarır.', 'Ne yazık ki, toplumların tarihlerini, geleneklerini, düşünme şekillerini ve çevresel bilgilerini aktaran ve yok olma tehlikesiyle karşı karşıya olan pek çok dil vardır.', 'Ne yazık ki, toplumların tarihlerini, geleneklerini, düşünme şekillerini ve çevresel bilgilerini aktaran pek çok yerli dil yok olma tehlikesiyle karşı karşıyadır.', 'Ne yazık ki, pek çok yerli dil toplumların tarihlerini, geleneklerini, düşünme şekillerini ve çevresel bilgilerini aktarırken yok olma tehlikesiyle de karşı karşıyadır.', 'Bazı toplumlar, ne yazık ki, tarihlerini, geleneklerini, düşünme şekillerini ve çevresel bilgilerini aktaran yerli dillerle birlikte yok olma tehlikesiyle karşı karşıyadır.'], answer: 2, highlight: 'Unfortunately, many Indigenous languages that convey communities\' histories, traditions, ways of thinking and environmental knowledge are in danger of disappearing.' }
                            ]

                        {
                            id: 'p4t1q14', label: 'Soru 14',

                            questions: [

                            ]

                        {
                            id: 'p4t1q15', label: 'Soru 15',
                            text: `<p><strong>Kaynak cümle:</strong> In order to understand why people do the things they do and think the way they think, holism proposes that it is necessary to look at the entire person.</p>`,
                            questions: [
                                { id: 'p4t1q15', text: 'Bu cümleye anlamca en yakın Türkçe çeviri hangisidir?', options: ['İnsanların yaptıkları şeyleri neden yaptıkları ve neden düşündükleri şekilde düşündüklerini anlamak için, bütüncülük, insanın bütününe bakmanın gerekli olduğunu ileri sürer.', 'Bütüncülük, insanın bütününe bakmanın insanların yaptıkları şeyleri neden yaptıkları ve neden düşündükleri şekilde düşündüklerini anlamak için gerekli olduğunu ileri sürer.', 'Bütüncülük düşüncesine göre, insanların yaptıkları şeyleri neden yaptıkları ve neden düşündükleri şekilde düşündüklerini anlamak için insanın bütününe bakmak gereklidir.', 'İnsanın bütününe bakmak, bütüncülük düşüncesine göre insanların yaptıkları şeyleri neden yaptıkları ve neden düşündükleri şekilde düşündüklerini anlamak için gerekli olan tek şeydir.', 'Bütüncülük düşüncesi, insanların yaptıkları şeyleri neden yaptıkları ve neden düşündükleri şekilde düşündüklerini anlamanın insanın bütününe bakmaktan geçtiğini ileri sürer.'], answer: 0, highlight: 'In order to understand why people do the things they do and think the way they think, holism proposes that it is necessary to look at the entire person.' }

                            ]

                        {
                            id: 'p4t1q17', label: 'Soru 17',
                            text: `<p><strong>Kaynak cümle:</strong> If there are hardly any frogs in a region, this means it is not a healthy place either for wildlife or for human beings.</p>`,

                        {

                            id: 'p4t1q20', label: 'Soru 20',

                            questions: [

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  RENDER
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    function renderTestSelect() {
        const tests = getTests();
        testSelect.innerHTML = tests.map((t, i) =>
            `<option value="${i}">Test ${i+1}</option>`
        ).join('');
        testSelect.value = state.currentTestIdx;
    }

    function renderPassageTabs() {
        const passages = getPassages();
        passageTabs.innerHTML = passages.map((p, i) =>
            `<button class="${i === state.currentPassageIdx ? 'active' : ''}" data-idx="${i}">${p.label}</button>`
        ).join('');
        passageTabs.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                state.currentPassageIdx = parseInt(btn.dataset.idx);
                state.answers = {};
                state.highlightedQuestion = null;
                renderAll();
            });
        });
    }

    function renderPassage() {
        const p = getCurrentPassage();
        if (!p) { passageText.innerHTML = '<p style="color:#999;">Parça bulunamadı.</p>'; passageLabel.textContent = '—'; return; }
        const part = getPart();
        passageLabel.textContent = `${part.name} · Test ${state.currentTestIdx+1} · ${p.label}`;

        let html = p.text;
        // Part 2 özel: eğer cevap seçiliyse ve blank varsa, doğru cevabı yerleştir
        if (state.currentPart === 'part2' && state.highlightedQuestion) {
            const q = p.questions.find(q => q.id === state.highlightedQuestion);
            if (q && state.answers[q.id] !== undefined) {
                const selected = state.answers[q.id];
                const correctText = q.options[selected] || '';
                html = html.replace(/<span class="blank-marker">___<\/span>/, `<span class="inserted">${correctText}</span>`);
            }
        }

        // Highlight
        if (state.highlightedQuestion) {
            const q = p.questions.find(q => q.id === state.highlightedQuestion);
            if (q && q.highlight) {
                const hl = q.highlight.trim();
                const escaped = hl.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const regex = new RegExp(escaped, 'g');
                html = html.replace(regex, (match) => `<span class="hl">${match}</span>`);
            }
        }
        passageText.innerHTML = html;
    }

    function renderQuestions() {
        const p = getCurrentPassage();
        if (!p) { questionList.innerHTML = '<p style="color:#999;">Soru bulunamadı.</p>'; questionCount.textContent = '0 soru'; return; }
        questionCount.textContent = `${p.questions.length} soru`;

        let html = '';
        const letters = ['A','B','C','D','E'];
        p.questions.forEach((q, idx) => {
            const selected = state.answers[q.id] !== undefined ? state.answers[q.id] : null;
            const isCorrect = selected !== null && selected === q.answer;
            const isWrong = selected !== null && selected !== q.answer;

            let optsHtml = '';
            q.options.forEach((opt, oi) => {
                let cls = '';
                if (selected === oi) cls = isCorrect ? 'selected-correct' : 'selected-wrong';
                if (isWrong && oi === q.answer) cls += ' show-correct';
                optsHtml += `
                    <label class="${cls}">
                        <input type="radio" name="${q.id}" value="${oi}" ${selected === oi ? 'checked' : ''} />
                        <span class="letter">${letters[oi]}.</span> ${opt}
                    </label>
                `;
            });

            let fb = '';
            if (selected !== null) {
                fb = `<div class="feedback ${isCorrect ? 'correct' : 'wrong'}">
                    ${isCorrect ? '✅ Doğru!' : '❌ Yanlış. Doğru cevap: ' + letters[q.answer]}
                </div>`;
            }

            html += `
                <div class="q-item" data-qid="${q.id}">
                    <div class="q-text"><span class="q-num">${idx+1}</span> ${q.text}</div>
                    <div class="options">${optsHtml}</div>
                    ${fb}
                </div>
            `;
        });

        questionList.innerHTML = html;

        questionList.querySelectorAll('input[type="radio"]').forEach(inp => {
            inp.addEventListener('change', (e) => {
                const qid = inp.name;
                const val = parseInt(inp.value);
                const p = getCurrentPassage();
                const q = p.questions.find(q => q.id === qid);
                if (!q) return;
                state.answers[qid] = val;
                state.highlightedQuestion = qid;
                renderAll();
            });
        });

        updateScore();
    }

    function updateScore() {
        const p = getCurrentPassage();
        if (!p) { scoreDisplay.textContent = '0 / 0'; return; }
        let correct = 0;
        p.questions.forEach(q => {
            if (state.answers[q.id] !== undefined && state.answers[q.id] === q.answer) correct++;
        });
        scoreDisplay.textContent = `${correct} / ${p.questions.length}`;
    }

    function renderAll() {
        renderTestSelect();
        renderPassageTabs();
        renderPassage();
        renderQuestions();
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  EVENT LISTENERS
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    partSelect.addEventListener('change', () => {
        state.currentPart = partSelect.value;
        state.currentTestIdx = 0;
        state.currentPassageIdx = 0;
        state.answers = {};
        state.highlightedQuestion = null;
        renderAll();
    });

    testSelect.addEventListener('change', () => {
        state.currentTestIdx = parseInt(testSelect.value);
        state.currentPassageIdx = 0;
        state.answers = {};
        state.highlightedQuestion = null;
        renderAll();
    });

    resetBtn.addEventListener('click', () => {
        state.answers = {};
        state.highlightedQuestion = null;
        renderAll();
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'r' && !e.ctrlKey && !e.metaKey) resetBtn.click();
    });

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  INIT
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    // partSelect seçeneklerini doldur
    Object.keys(DATA).forEach(key => {
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = DATA[key].name;
        partSelect.appendChild(opt);
    });

    renderAll();
    console.log('📖 YDT Test Book – Tüm bölümler yüklendi!');
</script>
</body>
</html>

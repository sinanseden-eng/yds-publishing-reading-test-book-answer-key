<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YDT Test Book – Eksiksiz (Tüm Bölümler & Testler)</title>
    <style>
        * { box-sizing: border-box; margin:0; padding:0; }
        body { font-family: 'Segoe UI', Roboto, system-ui, sans-serif; background: #f6f8fc; color: #1a2332; padding: 20px; }
        .container { max-width: 1440px; margin: 0 auto; }
        header {
            background: linear-gradient(135deg, #0b1a33, #1a3a5c);
            color: #fff; padding: 18px 28px; border-radius: 20px;
            margin-bottom: 24px; display: flex; flex-wrap: wrap;
            align-items: center; justify-content: space-between; gap: 12px;
            box-shadow: 0 8px 24px rgba(0,20,40,.2);
        }
        header h1 { font-weight: 600; font-size: 1.5rem; }
        header h1 small { font-weight: 400; font-size: .85rem; opacity: .75; margin-left: 10px; }
        .nav-group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
        .nav-group select, .nav-group button {
            background: rgba(255,255,255,.12);
            border: none; color: #fff; padding: 6px 14px;
            border-radius: 40px; font-weight: 600; font-size: .8rem;
            cursor: pointer; transition: .2s;
        }
        .nav-group select option { color: #1a2332; background: #fff; }
        .nav-group button:hover { background: rgba(255,255,255,.25); }
        .nav-group button.active { background: #ffd966; color: #0b1a33; }
        .reader { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media (max-width:900px) { .reader { grid-template-columns: 1fr; } }
        .card {
            background: #fff; border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,.04);
            padding: 22px 26px; border: 1px solid rgba(0,0,0,.04);
        }
        .card-title {
            font-weight: 600; font-size: .8rem; text-transform: uppercase;
            color: #4a5b7a; letter-spacing: .3px; margin-bottom: 14px;
            border-bottom: 2px solid #eef2f7; padding-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .card-title span { background: #eef2f7; padding: 2px 12px; border-radius: 40px; font-size: .7rem; color: #2a3a5a; }
        .passage-text {
            font-size: .96rem; line-height: 1.75; color: #1e2a3e;
            max-height: 70vh; overflow-y: auto; padding-right: 6px;
        }
        .passage-text p { margin-bottom: 1em; }
        .passage-text .hl { background: #fae77c; padding: 0 4px; border-radius: 6px; font-weight: 500; }
        .passage-text .hl.correct { background: #7bcfa6; }
        .passage-text .blank-marker {
            display: inline-block; background: #eef2f7; border-radius: 6px;
            padding: 0 12px; color: #2a3a5a; font-weight: 700;
            border: 1px dashed #8a9bb8; min-width: 80px; text-align: center;
        }
        .passage-text .inserted { background: #d4efe4; border-radius: 6px; padding: 0 6px; font-weight: 600; }
        .question-list { max-height: 70vh; overflow-y: auto; padding-right: 4px; }
        .q-item {
            background: #fafcff; border-radius: 14px; padding: 16px 18px;
            margin-bottom: 16px; border: 1px solid #e9edf4;
        }
        .q-item:hover { border-color: #c8d4e6; }
        .q-text { font-weight: 600; font-size: .94rem; margin-bottom: 10px; color: #0f1e32; }
        .q-text .q-num {
            display: inline-block; background: #0b1a33; color: #fff;
            width: 26px; height: 26px; text-align: center; line-height: 26px;
            border-radius: 40px; font-size: .75rem; margin-right: 10px;
        }
        .options { display: flex; flex-direction: column; gap: 6px; }
        .options label {
            display: flex; align-items: center; gap: 10px;
            padding: 7px 14px; border-radius: 10px; background: #f4f7fc;
            border: 2px solid transparent; cursor: pointer; font-size: .9rem;
        }
        .options label:hover { background: #e9eff8; }
        .options label .letter { font-weight: 700; color: #3a5a7a; min-width: 22px; }
        .options input[type="radio"] { accent-color: #1a3a5c; width: 18px; height: 18px; cursor: pointer; flex-shrink: 0; }
        .options label.selected-correct { border-color: #2b8c5e; background: #e1f5ed; }
        .options label.selected-wrong { border-color: #c94a4a; background: #fde8e8; }
        .options label.show-correct { border-color: #2b8c5e; background: #e1f5ed; }
        .feedback { margin-top: 8px; font-size: .85rem; font-weight: 500; padding: 4px 14px; border-radius: 40px; display: inline-block; background: #f0f3f9; color: #3a4a6a; }
        .feedback.correct { background: #d4efe4; color: #1a6a44; }
        .feedback.wrong { background: #fce3e3; color: #b33a3a; }
        .status-bar {
            display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
            margin-top: 20px; padding: 12px 20px; background: #eef2f7; border-radius: 16px;
            font-size: .85rem; color: #2a3a5a;
        }
        .status-bar .score { font-weight: 700; color: #0b1a33; }
        .status-bar .reset-btn { background: none; border: none; color: #4a6a8a; font-weight: 600; cursor: pointer; padding: 6px 16px; border-radius: 40px; }
        .status-bar .reset-btn:hover { background: #dce4ef; }
        .passage-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        .passage-tabs button { background: #eef2f7; border: none; padding: 4px 16px; border-radius: 40px; font-weight: 500; font-size: .8rem; color: #2a3a5a; cursor: pointer; }
        .passage-tabs button:hover { background: #dce4ef; }
        .passage-tabs button.active { background: #0b1a33; color: #fff; }
        .passage-text::-webkit-scrollbar, .question-list::-webkit-scrollbar { width: 5px; }
        .passage-text::-webkit-scrollbar-track, .question-list::-webkit-scrollbar-track { background: #eef2f7; border-radius: 10px; }
        .passage-text::-webkit-scrollbar-thumb, .question-list::-webkit-scrollbar-thumb { background: #bcc8dd; border-radius: 10px; }
        @media (max-width:600px) { body { padding: 12px; } header { padding: 16px; flex-direction: column; align-items: stretch; } .card { padding: 16px; } .q-item { padding: 12px 14px; } .options label { font-size: .85rem; padding: 6px 12px; } }
    </style>
</head>
<body>
<div class="container" id="app">
    <header>
        <h1>📖 YDT Test Book <small>tüm bölümler & testler (eksiksiz)</small></h1>
        <div class="nav-group">
            <select id="partSelect">
                <option value="part1">Part 1 – Okuma</option>
                <option value="part2">Part 2 – Paragraf Tamamlama</option>
                <option value="part3">Part 3 – İlgisiz Cümle</option>
                <option value="part4">Part 4 – Çeviri</option>
            </select>
            <select id="testSelect"></select>
            <span style="opacity:0.6;font-size:.75rem;">cevaba tıkla → parçada highlight</span>
        </div>
    </header>

    <div class="reader">
        <div class="card">
            <div class="card-title"><span>📄 Parça</span><span id="passageLabel">—</span></div>
            <div class="passage-tabs" id="passageTabs"></div>
            <div class="passage-text" id="passageText"></div>
        </div>
        <div class="card">
            <div class="card-title"><span>❓ Sorular</span><span id="questionCount">0 soru</span></div>
            <div class="question-list" id="questionList"></div>
        </div>
    </div>

    <div class="status-bar">
        <span>✅ <span class="score" id="scoreDisplay">0 / 0</span> doğru</span>
        <button class="reset-btn" id="resetBtn">⟳ Tüm cevapları sıfırla</button>
    </div>
</div>

<script>
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  TÜM VERİ – EKSİKSİZ (Part 1 Test 1-11, Part 2 Test 1-3,
//  Part 3 Test 1-3, Part 4 Test 1-2)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

const DATA = {
    part1: {
        name: "Okuma",
        tests: [
            // ===== TEST 1 (Tam) =====
            {
                id: 't1',
                passages: [
                    { id: 't1p1', label: 'Kraftwerk', text: `<p>The German music band Kraftwerk is, for many, nothing less than the progenitor of electronic music. As these pioneering musicians continue to break old ground, decades after their first appearance, one cannot fail to notice that very few groups nowadays could lay claim to such an influential and prodigious career. Can anyone find today an equivalent to the legendary bands of the 60s, 70s or early 80s among contemporary groups? It seems that innovation is not on the agenda of the companies who control the profitable music industry. Therefore, bands tend to play safe by clinging to the most profitable, well-established and less risky forms of music. However, if music is a form of art rather than mere entertainment, the companies who dictate the rules of the game called music will have to allow for artists who are passionate, unsafe and ready to experiment.</p>`, questions: [{ id: 't1q1', text: 'It can be understood from the passage that Kraftwerk', options: ['was long forgotten when people met new innovative groups', 'is a case of innovative music bands who dare to try new things in music', 'was profit-orientated and very successful', 'exerted influence back in the 70s and 80s', 'is the most famous music band in Germany due to their success in their style'], answer: 1, highlight: 'The German music band Kraftwerk is, for many, nothing less than the progenitor of electronic music. As these pioneering musicians continue to break old ground' }, { id: 't1q2', text: 'It is clear from the passage that music companies', options: ['try hard to give opportunities for the ones who are passionate musicians', 'are reluctant to invest in groups who play electronic music', 'would not sign a contract with an old-fashioned group like Kraftwerk', 'do not seek innovative musicians but those who bring money in the market', 'are trying to encourage experimental artists who have more potential'], answer: 3, highlight: 'It seems that innovation is not on the agenda of the companies who control the profitable music industry. Therefore, bands tend to play safe by clinging to the most profitable, well-established and less risky forms of music.' }, { id: 't1q3', text: 'According to the passage, why are today\'s music groups not doing as well as those in the past?', options: ['They try to make art and produce new styles instead of entertaining their audience.', 'They take risks in order to produce experimental styles.', 'The priority of music industry is to earn money rather than make art.', 'Music industry cannot find many innovative musicians as they used to.', 'Most of them play electronic music, which is not applauded by the public.'], answer: 2, highlight: 'It seems that innovation is not on the agenda of the companies who control the profitable music industry. Therefore, bands tend to play safe by clinging to the most profitable, well-established and less risky forms of music.' }] },
                    { id: 't1p2', label: 'Viking surnames', text: `<p>Surnames ending with the suffix -son in the area of Yorkshire in England are very common. This apparently insignificant piece of information tells a big story, though. Namely, it reflects the predominance of inhabitants who are descendants of Scandinavian Vikings in this region of Northern Britain. Many British with Scandinavian roots are trying to rediscover, revive and promote their Nordic identity. Traditions coming from the Vikings are increasingly popular, especially in remote areas in the north of Scotland. Many claim these revivals as another fashion which simply indicates the need of people to be part of a community. The criticism against resurgent traditionalism is that it has little to do with respect for tradition itself. Conversely, those who are fascinated with rediscovered roots are just trying to form some sort of collective identity within an uncertain and fragmented contemporary world.</p>`, questions: [{ id: 't1q4', text: 'It is stated in the passage that the high percentage of Nordic surnames in the area of Yorkshire', options: ['shows the frequency of Viking ancestry there', 'proves that Vikings are still dominant there', 'is not the only sign of the Viking heritage in Northern Britain', 'is exclusive to this area', 'has nothing to do with Scandinavian people'], answer: 0, highlight: 'Surnames ending with the suffix -son in the area of Yorkshire in England are very common. This apparently insignificant piece of information tells a big story, though. Namely, it reflects the predominance of inhabitants who are descendants of Scandinavian Vikings in this region of Northern Britain.' }, { id: 't1q5', text: 'What can be inferred from the passage about the recent revival of Viking traditions in Northern Britain?', options: ['It relates to the influence that Vikings exert.', 'It shows that many people in the area see themselves as Viking rather than British.', 'It can be attributed to the large number of Vikings who once lived there.', 'It disturbs many British people and cause unrest in the country.', 'It shows the need of contemporary people for a sense of belonging in a community.'], answer: 4, highlight: 'Many claim these revivals as another fashion which simply indicates the need of people to be part of a community.' }, { id: 't1q6', text: 'What is the passage mainly about?', options: ['The importance of keeping traditions alive', 'The multicultural background of Yorkshire', 'Contemporary identity issues and the way they are reflected on traditionalism', 'Ethnic minorities and their effort to safeguard their identity today', 'The difficulty to maintain an ethnic identity in the contemporary world'], answer: 2, highlight: 'Conversely, those who are fascinated with rediscovered roots are just trying to form some sort of collective identity within an uncertain and fragmented contemporary world.' }] },
                    { id: 't1p3', label: 'Re-enactment', text: `<p>What makes grown-up people all over the world dress up as knights or soldiers or as an Indian warrior or a Napoleonic soldier to re-enact battles? The phenomenon of historical re-enactment is amazing in that so many people are prepared to spend time and money to do what would have been inconceivable a few decades ago. The defenders of this new fashion say that through re-enactments they can feel history in their skin and that playing the role of a Roman legionnaire is not childish but a way to witness history from the inside. Yet, personally I believe it all boils down to an effort to gain permission to play but, of course, with more expensive toys. Fancy as these staged battles might be, they appear to me as a struggle to cling to the carelessness of childhood. On top of that, history cannot be grasped by wearing a uniform or an armour.</p>`, questions: [{ id: 't1q7', text: 'It is clear from the passage that those who partake in re-enactments', options: ['feel that they want to remain children', 'do it for the pleasure of wearing uniforms', 'perceive it as a way of identifying with historical figures and events', 'give priority to historical accuracy and so they spend great effort to revive the events', 'prefer to do it in order to have fun just like children do'], answer: 2, highlight: 'The defenders of this new fashion say that through re-enactments they can feel history in their skin and that playing the role of a Roman legionnaire is not childish but a way to witness history from the inside.' }, { id: 't1q8', text: 'It is evident that the writer of the passage', options: ['has a great admiration for those who spend time and money to re-enact battles', 'sees these events as waste of resources', 'is very sceptical with the claims of those who participate in the re-enactments', 'defends the right of grown-ups to enjoy the experience of those re-enactments', 'believes re-enactments are necessary to witness historical events'], answer: 2, highlight: 'Yet, personally I believe it all boils down to an effort to gain permission to play but, of course, with more expensive toys. Fancy as these staged battles might be, they appear to me as a struggle to cling to the carelessness of childhood.' }, { id: 't1q9', text: 'It is implied in the passage that history', options: ['can be experienced by re-enactments', 'is too complex to be understood by those taking part in these events', 'is too serious a field of knowledge to become part of childish re-enactments', 'is better grasped by experiencing it through games, just like children learn through toys', 'cannot be understood by means of role-playing alone'], answer: 4, highlight: 'On top of that, history cannot be grasped by wearing a uniform or an armour.' }] },
                    { id: 't1p4', label: 'Skull fashion', text: `<p>Meet one of the love affairs of designers. It is called the skull. Everywhere, from children's woollen hats to expensive fashion accessories, skulls seem to be the must-have sensational detail. These universal symbols of death sometimes come in glittering pink, sometimes as valuable stones. Some say that designers will use anything that attracts attention. Some others even think that the frequent use of smiling or colourful skulls reflects an effort to make death more acceptable. Likewise, some even believe there is a conspiracy behind this persistent unpleasant image. Namely, they claim that, in a war-torn period of history, there is a plan to make people used to the image of death to make it seem normal, even entertaining. But most people simply find this fashion either distasteful or 'cool'. At the end of the day, beauty is in the mind of the beholder.</p>`, questions: [{ id: 't1q10', text: 'It can be understood from the passage that the writer', options: ['does not take a clear position as to why skulls are often used by designers', 'is very critical of designers for using this unpleasant image in their creations', 'has no opinion about the issue of skulls', 'cannot understand why people get upset by what designers decide to use', 'believes that designers who use skulls are doing so because of a hidden agenda'], answer: 0, highlight: 'At the end of the day, beauty is in the mind of the beholder.' }, { id: 't1q11', text: 'Which of the following can be concluded from the passage?', options: ['Opinions about the use of skulls in fashion is mostly neutral because people don\'t take the issue of skulls seriously.', 'Skulls represent death, and the use of them in the fashion industry should not be accepted easily however cutely it is presented.', 'People have different opinions about the use of skulls on fashion items.', 'Designs with sparkly, colourful skulls are distasteful.', 'People\'s opinions on this trend can be manipulated by the design industry.'], answer: 2, highlight: 'Some say that designers will use anything that attracts attention. Some others even think that the frequent use of smiling or colourful skulls reflects an effort to make death more acceptable. Likewise, some even believe there is a conspiracy behind this persistent unpleasant image. But most people simply find this fashion either distasteful or \'cool\'.' }, { id: 't1q12', text: 'The passage is mostly about', options: ['the unacceptable use of the symbol of death by designers', 'the difficult choices designers are facing', 'the problems arising when both morality and aesthetics are compromised', 'the different significance people can attribute towards the same thing', 'how peoples attitudes towards a specific phenomenon are formed'], answer: 3, highlight: 'At the end of the day, beauty is in the mind of the beholder.' }] },
                    { id: 't1p5', label: 'London balconies', text: `<p>London is a city full of balconies, especially inside its historical centre. But hardly any people can be seen on them. Londoners do not necessarily have the habit of spending time on their exquisite balconies. Conversely, in countries such as Spain or Italy, people seem to spend more time on their balconies and yards than indoors. Filled with colourful flowers, those balconies and yards are pleasantly inviting. One could assume that the different attitudes between the British and their Southern neighbours relate to weather, but even over warm summer days few British will venture the great outdoors. If one watches more closely, it is not only people but even personal items which are absent from these spaces exposed to the public eye. Eventually, it is exactly the way North Europeans perceive public as opposed to private space, in relation to their Southern counterparts, which accounts for these different attitudes. While Italians are happy to chat endlessly with neighbours, the British will avoid exposing themselves to public scrutiny, or their laundry, for that matter.</p>`, questions: [{ id: 't1q13', text: 'It can be understood from the passage that North Europeans, especially the British,', options: ['believe that South Europeans are reckless', 'avoid using balconies because of their attitude towards privacy', 'do not tend to use their balconies mostly because of the cold weather', 'don\'t like to have balconies in their homes', 'think that sitting outside on a balcony is a very South European habit for their taste'], answer: 1, highlight: 'Eventually, it is exactly the way North Europeans perceive public as opposed to private space, in relation to their Southern counterparts, which accounts for these different attitudes. While Italians are happy to chat endlessly with neighbours, the British will avoid exposing themselves to public scrutiny, or their laundry, for that matter.' }, { id: 't1q14', text: 'Which of the following could be the best title for the passage?', options: ['Different Cultures, Different Habits', 'The Right Way to Use Balconies', 'Attraction of British Balconies', 'Change in the Styles of Buildings', 'Stereotypes of Northern Europe'], answer: 0, highlight: 'Eventually, it is exactly the way North Europeans perceive public as opposed to private space, in relation to their Southern counterparts, which accounts for these different attitudes.' }, { id: 't1q15', text: 'It is implied in the passage that', options: ['people\'s habits relate, to a great extent, to their cultural background', 'the cultural background can change due to the country\'s geographical location', 'differences in habits with regard to minor issues are insignificant', 'one can often have the habit of using a balcony depending on the climate', 'the weather dictates different habits'], answer: 0, highlight: 'Eventually, it is exactly the way North Europeans perceive public as opposed to private space, in relation to their Southern counterparts, which accounts for these different attitudes.' }] },
                    { id: 't1p6', label: 'Professionalism', text: `<p>So what does professionalism mean for teachers? The answer seems to be self-evident, while for many this is a useless question. Of course, professionalism is about delivering the lesson in a faultless way, planning ahead and responding to students' needs. Or is it that we are missing something here? All these nice sounding words cover up the fact that many teachers have very different definitions for all the above. What, for instance, does it mean to respond to students' needs? Who dictates what the needs or the appropriate response to them are? Well, you start to get the point: Things which are taken for granted are precisely those which have to be clearly defined before we develop a common language about what professionalism in education is about.</p>`, questions: [{ id: 't1q16', text: 'It can be understood from the passage that professionalism within education', options: ['means doing whatever is asked for by students in a classroom and meeting their needs', 'is a term that needs to be looked at more closely', 'creates great opportunities for learners as well as teachers', 'does not mean much to many teachers, let alone students', 'is luckily a commonly accepted term that is adopted in classrooms'], answer: 1, highlight: 'Things which are taken for granted are precisely those which have to be clearly defined before we develop a common language about what professionalism in education is about.' }, { id: 't1q17', text: 'Which of the following best describes the writer\'s beliefs?', options: ['No one can tell what professionalism really is.', 'Professionalism dictates what the appropriate response to students\' needs is.', 'Educationalists have to find common ground on the issue of professionalism.', 'Many educators are unprofessional, which leads to problems in education.', 'There is no agreement on the importance of professionalism on education.'], answer: 2, highlight: 'Things which are taken for granted are precisely those which have to be clearly defined before we develop a common language about what professionalism in education is about.' }, { id: 't1q18', text: 'The passage is mainly about', options: ['the importance of employing really professional teachers', 'the problem of unprofessional teachers who do not realise what education is about', 'modern ideas about professionalism in education', 'the tension between those who have a vision about education and those who don\'t', 'the necessity of making out the concept of professionalism in education'], answer: 4, highlight: 'Things which are taken for granted are precisely those which have to be clearly defined before we develop a common language about what professionalism in education is about.' }] },
                    { id: 't1p7', label: 'Sales psychology', text: `<p>We all know how alluring sales are for customers. What most of us don't know is how sales work. That is, most of us have no idea what it is exactly that makes people rush into shops when sales are on. Psychologists have proven that prospective customers do not really pay so much attention to what they are going to spend as how much they are going to save when they grab a bargain. In other words, when a consumer sees an item reduced from 70 pounds to 40, she or he is not going to think this is going to cost me 40 but hey, by buying this I'm saving 30. So, all a cunning merchant has to do is pump up the initial price by, for example, 25% and then reduce it by the same percentage, presenting it as a 'sale'.</p>`, questions: [{ id: 't1q19', text: 'It can be understood from the passage that the writer', options: ['knows well why and how sales work on customers', 'believes that merchants should put goods into sale after increasing their prices', 'encourages merchants to raise their prices so that they can afford to sell on sale', 'finds it unacceptable for merchants to put items on sales after raising their price', 'believes sales are effectively necessary for customers'], answer: 0, highlight: 'Psychologists have proven that prospective customers do not really pay so much attention to what they are going to spend as how much they are going to save when they grab a bargain.' }, { id: 't1q20', text: 'The passage implies that the ways people make their choices before buying a good', options: ['depend on the price of an item', 'are usually related to their need for it', 'are a subject researched by psychologists for a long time', 'can be easily manipulated by merchants', 'are usually variable depending on the season the sales take place in'], answer: 3, highlight: 'So, all a cunning merchant has to do is pump up the initial price by, for example, 25% and then reduce it by the same percentage, presenting it as a \'sale\'.' }, { id: 't1q21', text: 'According to the writer, which of the following is true when a product is down to 40 pounds from 70?', options: ['A sensible consumer should better buy an item without thinking much.', 'The consumer will prioritise opportunity over expenditure and is likely to buy it.', 'It is the right time for the consumer to buy an item.', 'The consumer should just think of how much they will save by buying it.', 'People should think only if they really need a particular item rather than focus on the price tag.'], answer: 1, highlight: 'when a consumer sees an item reduced from 70 pounds to 40, she or he is not going to think this is going to cost me 40 but hey, by buying this I\'m saving 30.' }] },
                    { id: 't1p8', label: 'Lyme disease', text: `<p>Lyme disease is a relatively new threat spreading across Europe and North America. Humans can develop this life-threatening disease from tick bites. Deer ticks attach themselves to passersby, and if they remain unnoticed on the skin for more than 36 hours, they can contaminate the blood stream with a bacillus which can trigger Lyme disease. Not every person contaminated by this bacillus will develop this condition, which attacks the nervous system with often crippling consequences. However, the percentage of those who will do so is quite high. People should take extra precautions when walking in forests and prefer clothes with light colours which make attached ticks more visible and easy to remove afterwards. Exposed hands and especially feet are not a good idea; thus, long sleeves and trousers are advisable. There are different theories about where this bacillus came from, but there is little disagreement on what precautions should be taken.</p>`, questions: [{ id: 't1q22', text: 'It can be understood from the passage that there are uncertain assumptions about', options: ['which measures should be taken when a tick bites a human', 'the origin of the bacillus', 'what carries the disease', 'how the disease can be passed on to humans', 'the relation of ticks to the disease'], answer: 1, highlight: 'There are different theories about where this bacillus came from' }, { id: 't1q23', text: 'What is the author\'s primary purpose in this passage?', options: ['To explain the consequences of Lyme disease', 'To give examples of possible symptoms of Lyme disease', 'To inform the reader about Lyme disease', 'To present where Lyme disease is spreading', 'To teach people which precautions to take against Lyme disease'], answer: 2, highlight: 'Lyme disease is a relatively new threat spreading across Europe and North America.' }, { id: 't1q24', text: 'It is implied in the passage that if a deer tick stays more than 36 hours attached on a person', options: ['it has little affect on diseases', 'it becomes less dangerous for the body', 'it may infect the body for a short time', 'the bacillus will possibly die as it can\'t survive that long', 'it runs a considerable risk of a potentially fatal disease'], answer: 4, highlight: 'if they remain unnoticed on the skin for more than 36 hours, they can contaminate the blood stream with a bacillus which can trigger Lyme disease.' }] }

            {

                    { id: 't2p1', label: 'Wernher von Braun', text: `<p>The greatest scientist of American history and the mastermind behind the NASA programme in the 60s was not an American but a German who invented the first ballistic missile. Wernher von Braun is the man who developed during the 1940s the extraordinary technological feat called the V2 rocket. After the first successful trial of his brainchild, he declared that the way for travelling to the stars was open! The German political and military establishment was not concerned about spaceships at that moment. However, using the same technology, the V2 wonder-weapon was effectively their last chance to turn the tide of the Second World War. Von Braun was captured by the US army in 1945, became an American citizen and played a key role in the Apollo programme which took man to the Moon. Upon immigration, he was asked at the US border if he had ever been linked to an anti-American organisation, he answered "Yes, the German Army". However, he was in fact a true servant of the USA.</p>`, questions: [{ id: 't2q1', text: 'Which statement is true about V2?', options: ['It was an early attempt of the Germans to conquer outer space.', 'It was a weapon Braun designed for the US army.', 'It was a technologically advanced German rocket.', 'It had been modified a few times since its invention.', 'It made the German Army feel excited about exploring the space.'], answer: 2, highlight: 'Wernher von Braun is the man who developed during the 1940s the extraordinary technological feat called the V2 rocket.' }, { id: 't2q2', text: 'Which of the following can be understood from the passage?', options: ['The rocket Wernher von Braun designed was essentially a way to defeat the enemy.', 'Wernher von Braun\'s design changed the fate of the German army for the better way.', 'The designed rocket was effective enough to change the flow of a big war.', 'Wernher von Braun designed the V2 rocket for the American programme against his free will.', 'The V2 rocket was the most advanced weapon US army had available in its arsenal.'], answer: 2, highlight: 'using the same technology, the V2 wonder-weapon was effectively their last chance to turn the tide of the Second World War.' }, { id: 't2q3', text: 'It can be understood from the passage that Wernher von Braun', options: ['worked against the US for most of his life', 'was a staunch anti-American when he went to the US', 'remained a captive of the Americans until the 60s', 'declared upon arrival in the US that he had cooperated with a hostile army', 'went to America to continue the V2 programme'], answer: 3, highlight: 'Upon immigration, he was asked at the US border if he had ever been linked to an anti-American organisation, he answered "Yes, the German Army".' }] },
                    { id: 't2p2', label: 'Snails', text: `<p>Snails are very slow moving creatures, and they do not seem to have a good reputation in many cultures since most people associate that nature with being lazy and not good for much. That they are not mystical or beautiful has led to more stories and cultures viewing them as something bad or evil. For instance, in Judeo-Christian culture, the snail has often been viewed as a manifestation of the deadly sin of sloth. In fact, in many early cultures, the movements of the snail were viewed as being unclean, and people were often marked with a snail as a sign of punishment. On the other hand, the Greek poet Hesiod wrote that snails signified the time to harvest by climbing the stalks, while the Aztec believed that the snail was the moon god and that the shell was his protection. And the psychologist Carl Jung noted that the snail was the representative of the self in dreams. In psychology, the soft insides are analogous to the subconscious as the shell is the conscious. Though not everyone buys this theory, many professors mention this in their lessons today.</p>`, questions: [{ id: 't2q4', text: 'According to the passage, the snail', options: ['is celebrated in many cultures', 'symbolises dirty people in various cultures', 'has never been mentioned by scholars', 'symbolises laziness in some cultures', 'has never been regarded as a sign of unwillingness to work'], answer: 3, highlight: 'in Judeo-Christian culture, the snail has often been viewed as a manifestation of the deadly sin of sloth.' }, { id: 't2q5', text: 'It can be understood from the passage that', options: ['the Greek thought that the harvest would be bad if there were snails on the stalks', 'it is impossible to find anything that depicts the snail as being self-reliant', 'the snail is associated with anything but punishment', 'the Aztec attributed quite gloomy characteristics to the snail', 'not all cultures have detested the snail'], answer: 4, highlight: 'On the other hand, the Greek poet Hesiod wrote that snails signified the time to harvest by climbing the stalks, while the Aztec believed that the snail was the moon god' }, { id: 't2q6', text: 'Which of the following can be understood from the passage?', options: ['Carl Jung was fond of snails.', 'No scholars use Jung\'s analogy today.', 'Jung likened the soft part of a snail to the subconscious.', 'Jung considered the self in dreams as evil as the snail.', 'Jung was an expert on the anatomy of the snail.'], answer: 2, highlight: 'In psychology, the soft insides are analogous to the subconscious as the shell is the conscious.' }] },
                    { id: 't2p3', label: 'Vintage clothing', text: `<p>Vintage clothing is a fad which took Britain and most of Western Europe by storm. Nowadays, clothing styles from the fifties through the eighties are in demand by youths who were not even born when these clothes were first worn. Most vintage clothes are second-hand, authentic pieces. However, many designers today follow the bright colours and extravagant style of these otherwise bygone eras. The benefits of selling an unwanted, old item as a rarity for a high price are easy to see. As long as the public demand remains high, there are handsome profits for the merchants involved in this lucrative trade. Fashion designers are benefiting as well because they can draw inspiration from the vast pool of the past. Some cynics speculate that contemporary designers are recycling the ideas of the past as they are simply not talented enough to come up with their own revolution in fashion.</p>`, questions: [{ id: 't2q7', text: 'It is clear from the passage that vintage clothes', options: ['are already used items sold at trendy shops', 'are either remakes of old designs or used as second-hand', 'are low quality replicas of the clothes of 50s, 60s and 80s', 'are good quality for their price', 'are usually fake items or second-hand'], answer: 1, highlight: 'Most vintage clothes are second-hand, authentic pieces. However, many designers today follow the bright colours and extravagant style of these otherwise bygone eras.' }, { id: 't2q8', text: 'The underlined word \'lucrative\' in the passage is closest in meaning to', options: ['financial', 'important', 'profitable', 'exceptional', 'normal'], answer: 2, highlight: 'As long as the public demand remains high, there are handsome profits for the merchants involved in this lucrative trade.' }, { id: 't2q9', text: 'It is implied in the passage that fashion designers related to vintage clothes', options: ['tend to choose the way of less effort to make money', 'try to create a new revolution in fashion', 'think that traditional clothes look a lot more elegant on people', 'use old ideas because they like tradition', 'would rather not rely on what has been already created by others'], answer: 0, highlight: 'Some cynics speculate that contemporary designers are recycling the ideas of the past as they are simply not talented enough to come up with their own revolution in fashion.' }] },
                    { id: 't2p4', label: 'Women\'s suffrage', text: `<p>The women's suffrage movement in the United States began in earnest in the decades before the Civil War. During the 1820s and 30s, most states had extended the franchise to all white men, regardless of how much money or property they had. At the same time, all sorts of reform groups were proliferating across the United States and in many of these, women played a prominent role. Meanwhile, many American women were beginning to chafe against what historians have called the "Cult of True Womanhood": that is, the idea that the only "true" woman was a submissive wife and mother concerned exclusively with home and family. Put together, all of these contributed to a new way of thinking about what it meant to be a woman and a citizen of the United States. It took activists and reformers nearly 100 years to win the right to vote for women, and the campaign was not easy. Disagreements over strategy threatened to cripple the movement more than once. But on August 18, 1920, the 19th Amendment to the Constitution was finally ratified, declaring for the first time that women deserve all the rights and responsibilities of citizenship.</p>`, questions: [{ id: 't2q10', text: 'What can be inferred from the passage about the women\'s suffrage movement in the United States?', options: ['Different perspectives occasionally posed a risk to the movement.', 'It enjoyed an unprecedented victory prior to the 19th century.', 'Their success was largely due to the Cult of True Womanhood.', 'The women involved in it had little regard for the slaves\' rights.', 'Members almost always reached a consensus.'], answer: 0, highlight: 'Disagreements over strategy threatened to cripple the movement more than once.' }, { id: 't2q11', text: 'The underlined word \'chafe\' in the passage most nearly means', options: ['imprison', 'obey', 'feel relaxed', 'feel annoyed', 'feel free'], answer: 3, highlight: 'many American women were beginning to chafe against what historians have called the "Cult of True Womanhood"' }, { id: 't2q12', text: 'The passage mainly deals with', options: ['reform groups that helped create a new society in the US', 'the history of the women\'s suffrage movement in the US', 'the contrast between the Cult of True Womanhood and the women\'s suffrage', 'the current status of women in the US', 'the obstacles encountered during the fight to win the right to vote for women'], answer: 1, highlight: 'The women\'s suffrage movement in the United States began in earnest in the decades before the Civil War.' }] },
                    { id: 't2p5', label: 'Atlantis', text: `<p>The writing of the ancient Greek philosopher Plato contained so much truth about the human condition, but one of his most famous stories, the cataclysmic destruction of the ancient civilization of Atlantis, is almost certainly false. So why is this story still repeated more than 2,300 years after Plato's death? "It's a story that captures the imagination," says James Romm, a professor of classics at Bard College in New York. "It's a great myth. It has a lot of elements that people love to fantasize about." Plato told the story of Atlantis around 360 BCE. The founders of Atlantis, he said, created a utopian civilization and became a great naval power. Their home was made up of concentric islands separated by wide moats and linked by a canal that penetrated to the centre. The lush islands contained gold, silver and other precious metals and supported an abundance of rare, exotic wildlife. There are many theories about where Atlantis was—in the Mediterranean, off the coast of Spain, even under what is now Antarctica. Plato said Atlantis existed about 9,000 years before his own time and that its story had been passed down by poets, priests and others. But Plato's writings about Atlantis are the only known records of its existence.</p>`, questions: [{ id: 't2q13', text: 'The author of the passage', options: ['collaborated with James Romm to refute the myth Plato created', 'witnessed things that confirmed Plato\'s story of Atlantis', 'apparently envies the popularity Plato still enjoys after so many centuries', 'appears to be eager to undermine the respect others feel for Plato', 'seems to be sceptical about the story of Atlantis'], answer: 4, highlight: 'one of his most famous stories, the cataclysmic destruction of the ancient civilization of Atlantis, is almost certainly false.' }, { id: 't2q14', text: 'It can be inferred from the passage that according to Plato,', options: ['nobody before him had ever mentioned Atlantis', 'Atlantis reached its peak during his own lifetime', 'it took a long time for Atlantis to collapse', 'Atlantis met the highest standards of perfection', 'it was the founders of Atlantis that destroyed it as well'], answer: 3, highlight: 'The founders of Atlantis, he said, created a utopian civilization and became a great naval power.' }, { id: 't2q15', text: 'One point made in the passage is that', options: ['James Romm disapproves of the way people think about Atlantis', 'people located the relics from Atlantis in several places around the world', 'the story of Atlantis continues to attract people', 'what Plato said about Atlantis was corroborated by other scholars', 'wild animals were rare on Atlantis'], answer: 2, highlight: '"It\'s a story that captures the imagination," says James Romm' }] },
                    { id: 't2p6', label: 'Art for everyone', text: `<p>Drawing or painting is, for many, a relaxing weekend pastime. For the proponents of art therapy, making art is an activity which can be not only gratifying but also therapeutic. But for the majority of the population, arts are better left to the masters. There is a widespread belief that we, the ordinary people, who are not touched by a stroke of genius, should keep safe distance from the preserve of the gifted few. This elitist perception about high art dates centuries back, at least to the days of the Renaissance. It creates a dual opposition in the minds of people, namely between the talented maker and us, the hapless masses who cannot draw a straight line. This mentality alienates most people from their own creativity as they take art either too seriously or not seriously at all. That is to say, most people think of art as either a grand endeavour or as a mere hobby. But making art is neither superhuman nor a substitute for a crossword.</p>`, questions: [{ id: 't2q16', text: 'It can be understood from the passage that the writer', options: ['agrees that making art is for the few', 'doesn\'t show a tendency for an idea about how art should be perceived', 'believes that art is not something that should be seen as therapeutic', 'thinks that art cannot be a hobby but an activity for professionals', 'disagrees with those who see art as either for an elite or as a fun activity'], answer: 4, highlight: 'But making art is neither superhuman nor a substitute for a crossword.' }, { id: 't2q17', text: 'Which of the following is the closest in meaning to the underlined word \'hapless\' in the passage?', options: ['hopeful', 'unlucky', 'dangerous', 'random', 'strange'], answer: 1, highlight: 'the hapless masses who cannot draw a straight line' }, { id: 't2q18', text: 'The passage is mainly about', options: ['the importance of art for everyone', 'the distorted or simplistic perceptions most people harbour about art', 'the disputes between those who think art can be a mere hobby and those who don\'t', 'the wrong perceptions of people who either have no talent or despise the talented ones', 'the problems created by incompetent artists reducing art\'s status to a mere hobby'], answer: 1, highlight: 'This elitist perception about high art dates centuries back' }] },
                    { id: 't2p7', label: 'Vietnamese in Czech', text: `<p>One might be surprised by the fact that the second largest immigrant community in the Czech Republic are Vietnamese. The many Ukrainians living there only recently bypassed them in numbers as a result of seeking refuge from the war conflict in their home country. Vietnamese were invited as workers to East Germany and also to the present dissolved state of Czechoslovakia. The majority of the Vietnamese, who invariably used to be employed as factory workers up until the 90s, run their own small businesses. The so-called Asian restaurants are cropping up everywhere in this country. They are seldom called Vietnamese, though, as their country is associated with industrial labourers, so the more exotic name, Asian, is preferred. On top of that, despite their claim to authenticity, these restaurants adapt their food to the Czechs' expectations about taste. Czechs don't have a palate for very spicy food. Therefore, Asian restaurants try not to stray away from Czechs' culinary habits and serve what could be called Asian-fusion.</p>`, questions: [{ id: 't2q19', text: 'It is clear from the passage that Vietnamese restaurants in the Czech Republic', options: ['try to appear Asian in order to lure locals', 'offer the authentic Vietnamese taste', 'are not popular in the country due to the public\'s prejudice against Vietnamese', 'try to conform to their clients\' taste', 'have lost their identity, which is a problem'], answer: 3, highlight: 'Asian restaurants try not to stray away from Czechs\' culinary habits and serve what could be called Asian-fusion.' }, { id: 't2q20', text: 'It can be understood from the passage that in the Czech Republic', options: ['Vietnamese run most small businesses', 'most restaurants are run by foreigners', 'people have negative attitude towards Asian people and especially Vietnamese', 'people have stereotypes about the Vietnamese', 'people are used to spicy Vietnamese cuisine'], answer: 3, highlight: 'They are seldom called Vietnamese, though, as their country is associated with industrial labourers, so the more exotic name, Asian, is preferred.' }, { id: 't2q21', text: 'It is implied in the passage that the Vietnamese minority in the Czech Republic', options: ['had to adapt to the new economical developments and local conditions', 'are humiliated by most of the Czechs', 'were a lot better off when they were first invited to Czechoslovakia', 'are nowadays being gradually replaced by Ukrainians and face increased competition', 'cannot fulfil Czechs\' expectations about cuisine'], answer: 0, highlight: 'The majority of the Vietnamese, who invariably used to be employed as factory workers up until the 90s, run their own small businesses.' }] },
                    { id: 't2p8', label: 'Korean movies', text: `<p>South Korean movies have a long established reputation for too much violence, graphic detail and too much onscreen bloodshed. At first glance, it seems that Korean audiences have a particular liking for such films. However, on closer observation, things reveal a more complex situation. As the entertainment industry becomes more and more globalized, international audiences become increasingly important. Therefore, if Korean filmmakers want to have a slice of the pie from overseas revenues, they have to brand themselves more successfully. That's why, Koreans try to give to their films a particular characteristic, which will allow them to stand out from the crowd of competing productions in some respect. As a result, they invest in high levels of violence in a bid to make their production more appealing and marketable to international audiences.</p>`, questions: [{ id: 't2q22', text: 'What is true about Korean filmmakers?', options: ['They are not as successful as their contemporaries in other countries.', 'They respond to the local demand for violence, but their films are not marketable abroad.', 'They sustain a profile of violence to make their movies marketable at home and abroad.', 'They make films only for international audiences.', 'They try to make movies appealing to a minority.'], answer: 2, highlight: 'they invest in high levels of violence in a bid to make their production more appealing and marketable to international audiences.' }, { id: 't2q23', text: 'It can be understood from the passage that the violent style of Korean movies', options: ['is hardly appealing to the international film industry', 'is totally opposed to the taste of the international audience', 'is appreciated by only Korean audiences', 'tries to meet local demand as well as the demand in the global film market', 'doesn\'t make the Korean film makers a global success'], answer: 3, highlight: 'they invest in high levels of violence in a bid to make their production more appealing and marketable to international audiences.' }, { id: 't2q24', text: 'Which of the following can be inferred from the passage?', options: ['The need for marketability can dictate the style of an entire national film industry nowadays.', 'In a global market, filmmakers will have to exaggerate violence to be internationally acceptable.', 'Korean films cannot compete with other countries, so they try to appear violent.', 'The writer of the passage has fears as to the tendency of people towards violence.', 'Korean filmmakers sacrifice quality for profits by relying on violent scenes.'], answer: 0, highlight: 'As the entertainment industry becomes more and more globalized, international audiences become increasingly important.' }] }
                ]

                    { id: 't3p1', label: 'Credit card trap', text: `<p>We all know how easy it is to be lured into using a credit card and becoming seriously indebted before even realizing it. Young people are particularly prone to this sort of financial irresponsibility. They live for the present, so they can be easily conned into undermining their future. One of the most dangerous ways of putting people into deep debt is the so-called teaser rates. At the outset, the credit card company will charge a fraction of their standard interest rate, normally up to 29 per cent. Once into the trap, people will realize that after a period of happiness, their monthly payments will increase sharply and before they know, they will struggle to keep up with payments. Reading the small print on a contract is essential, but even that will not put prospective debtors on the safe side. Banks can change the terms without any legal consequences. These alterations are usually against the interests of customers who are often not even notified properly about such changes.</p>`, questions: [{ id: 't3q1', text: 'It can be understood from the passage that young people who use credit cards', options: ['frequently suffer from fraud as they are gullible', 'avoid taking responsibilities for their loans', 'are more liable to lose control of their finances', 'are particularly targeted by banks as they consume more than adults', 'do not understand the terms of their loans due to the small print on the contract'], answer: 2, highlight: 'Young people are particularly prone to this sort of financial irresponsibility. They live for the present, so they can be easily conned into undermining their future.' }, { id: 't3q2', text: 'What can be inferred from the passage about the banks?', options: ['They often charge more money than they should.', 'They change the terms of credit cards unlawfully.', 'They use tricks to increase their interest rates.', 'They are trying to maximize their profit, often while behaving in dubious ways.', 'They distort the conditions written on the contracts before customers sign them.'], answer: 3, highlight: 'Banks can change the terms without any legal consequences. These alterations are usually against the interests of customers who are often not even notified properly about such changes.' }, { id: 't3q3', text: 'Which of the following could be the best title for the passage?', options: ['How to Obtain Credit Cards', 'The Credit Card Trap', 'Teaser Rates', 'Young People\'s Irresponsible Use of Credit Cards', 'How to Use Credit Cards'], answer: 1, highlight: 'One of the most dangerous ways of putting people into deep debt is the so-called teaser rates.' }] },
                    { id: 't3p2', label: 'Bach', text: `<p>Johann Sebastian Bach is considered by many to be one of the greatest classical composers in history. However, it was not until the 19th century, long after he had died, that he was recognized as the greatest composer of the Baroque era. He was born in Eisenach, Germany, in 1685 into a musical family. His father, a court trumpeter in the service of the Duke Eisenach, taught him to play the violin and harpsichord. During his life, Bach became famous throughout Germany and shortly afterwards across Europe due to his career as a virtuoso organist rather than a composer. Bach became a father to twenty children, seven from his first marriage and thirteen from his second and the last. Unfortunately, only half of his children survived to adulthood. A less well-known fact about Bach is that he was once imprisoned for almost a month by his employer who did not want to let him go. Besieged by diabetes, he died in 1750.</p>`, questions: [{ id: 't3q4', text: 'It can be concluded from the passage that Bach', options: ['was recognized as the best composer in the history of music in the 19th century', 'became a famous composer throughout Europe at the beginning of his career', 'was originally a composer before he became a successful organist', 'while still alive became better known as an organist than a composer', 'would have taken interest in playing instruments if it hadn\'t been for his father'], answer: 3, highlight: 'During his life, Bach became famous throughout Germany and shortly afterwards across Europe due to his career as a virtuoso organist rather than a composer.' }, { id: 't3q5', text: 'One of the things which is not known by many people is that Bach', options: ['received hardly any support from his family in the early stages of his musical career', 'became famous throughout Europe late in his career', 'was a captive of his boss who didn\'t want him to leave', 'has been considered the greatest Baroque composer', 'was born in Germany into a family dealing with music'], answer: 2, highlight: 'A less well-known fact about Bach is that he was once imprisoned for almost a month by his employer who did not want to let him go.' }, { id: 't3q6', text: 'We understand from the passage that Bach', options: ['had none of his children around before his death', 'was married twice', 'had twenty children, some of whom followed in their father\'s footsteps', 'became a widower twice', 'lived in the 19th century'], answer: 1, highlight: 'Bach became a father to twenty children, seven from his first marriage and thirteen from his second' }] },
                    { id: 't3p3', label: 'Christmas mail', text: `<p>Sending letters and parcels before Christmas might become quite a tricky business in many countries across the world. Royal Mail presents a service on its website which shows the latest posting day to many countries if you want your mail to be delivered just before Christmas Day. For most countries in Europe, this date is about one month before Christmas unless airmail is used, which is a mail transport system in which at least one leg of the journey is completed by aircraft. It usually has a shorter delivery time. However, for other mainly overseas countries such as Australia or the United States, mail usually has to be posted by the end of October. If you want to make sure that your mail will be delivered in time, check the Royal Mail website. They will refund you if your mail wasn't delivered on time even though it was sent prior to the last posting day. Alternatively, if you are just after wishing somebody a nice holiday, even though it is definitely not as kind and warm as receiving a letter or a postcard, you can send them a text message.</p>`, questions: [{ id: 't3q7', text: 'Which of the following best describes the author\'s opinion?', options: ['It is a better solution to send somebody a text message rather than a postcard.', 'Royal Mail services are always delayed.', 'Receiving a Christmas letter or a postcard is now out of date.', 'Sending Christmas cards is nicer, but it requires more planning than text messaging.', 'Trying to send letters and parcels in time for Christmas is impossible.'], answer: 3, highlight: 'Alternatively, if you are just after wishing somebody a nice holiday, even though it is definitely not as kind and warm as receiving a letter or a postcard, you can send them a text message.' }, { id: 't3q8', text: 'We learn from the passage that Royal Mail', options: ['will always deliver your mail if you post it in time', 'informs the public about Christmas postal details on its website', 'will refund customers if their mail is delivered before Christmas Day', 'does not provide a service for sending Christmas mail overseas', 'doesn\'t deliver mail via air'], answer: 1, highlight: 'Royal Mail presents a service on its website which shows the latest posting day to many countries' }, { id: 't3q9', text: 'It is stated in the passage that Christmas posting to overseas countries', options: ['is more expensive via airmail', 'requires a longer time than to Europe', 'doesn\'t take so long when it is done by Royal Mail', 'is only provided by certain companies such as Royal Mail', 'is not as problematic as somewhere else'], answer: 1, highlight: 'For most countries in Europe, this date is about one month before Christmas unless airmail is used. However, for other mainly overseas countries such as Australia or the United States, mail usually has to be posted by the end of October.' }] },
                    { id: 't3p4', label: 'Raisins experiment', text: `<p>First, we pour soda water into a large cup and drop 5-6 raisins into the liquid. They will sink to the bottom as they are slightly denser than soda. By adding a few drops of vinegar into the cup, we'll create carbon dioxide gas bubbles which will attach themselves to the rough surfaces of raisins making them float toward the top of the cup because of the increase in buoyancy. When they get to the top of the soda, most of the bubbles burst and the carbon dioxide gas escapes into the air and that causes raisins to lose buoyancy and sink back down to the bottom of the cup. The whole process, called carbonation, starts all over again until most of the carbon dioxide escapes and the soda goes flat. Furthermore, as the raisins get soggy, they become too heavy to float. We can conduct this test adding lemon juice and other acids into the soda water. This is a basic test of reaction between acids and alkalis.</p>`, questions: [{ id: 't3q10', text: 'Which of the following is not true according to the passage?', options: ['Lemon juice does not work as well as vinegar.', 'The buoyancy of raisins increases when we add vinegar.', 'Soda is not as dense as raisins.', 'Soda stops creating bubbles as it loses its carbon dioxide.', 'The more raisins soak water, the heavier they become.'], answer: 0, highlight: 'We can conduct this test adding lemon juice and other acids into the soda water. This is a basic test of reaction between acids and alkalis.' }, { id: 't3q11', text: 'Which of the following can be concluded from the passage?', options: ['Raisins move up and down in water.', 'Raisins stay at the top of the liquid in a cup with soda water.', 'When we put raisins in soda water, it creates bubbles around raisins.', 'Soda is denser than raisins.', 'During carbonation, raisins move up and down.'], answer: 4, highlight: 'The whole process, called carbonation, starts all over again until most of the carbon dioxide escapes and the soda goes flat.' }, { id: 't3q12', text: 'According to the passage, the carbon dioxide bubbles', options: ['are fewer in lemon juice than they are in vinegar', 'cover the whole surface of raisins equally', 'serve as life jackets for raisins at the bottom as well as at the top of the liquid', 'are caused by mixing soda with any denser liquid', 'mostly break when they reach the top of the liquid'], answer: 4, highlight: 'When they get to the top of the soda, most of the bubbles burst and the carbon dioxide gas escapes into the air' }] },
                    { id: 't3p5', label: 'Literature review', text: `<p>The literature review for an essay should be written in three stages. The first stage ought to include a plan for what to write based on a proposal for research. The next stage concerns writing the first draft. The sections of the literary review should be organized so that they match the themes assumed to emerge within the essay. The author needs to look for similarities among the research articles and link them to the themes in literary review. In the last stage, when the data have been collected and analyzed, the first draft needs to be rewritten in order to provide a more cohesive background for the themes that came out from the data analysis. The themes on which an argument will be constructed will be included in a body of the final draft of the review along with an introduction and a conclusion.</p>`, questions: [{ id: 't3q13', text: 'According to the passage, which of the following is the key to a successful literature review?', options: ['Initial planning and rewriting after new findings from the author\'s research have come up', 'Being consistent with the form that includes introduction, body and conclusion', 'Including all the research articles within the themes', 'Finding contradictory conclusions from other works', 'Applying all the methods of research'], answer: 0, highlight: 'The first stage ought to include a plan for what to write based on a proposal for research. ... In the last stage, when the data have been collected and analyzed, the first draft needs to be rewritten' }, { id: 't3q14', text: 'It can be understood from the passage that the last stage of the literature review writing', options: ['includes a proposal for what to write', 'is identical with the second stage but doesn\'t include an introduction', 'comes after the data analysis', 'should include the articles about research with identical findings to the author\'s', 'should only include online journal articles'], answer: 2, highlight: 'In the last stage, when the data have been collected and analyzed, the first draft needs to be rewritten' }, { id: 't3q15', text: 'The main purpose of the passage is to', options: ['remind readers that preparing a draft is more important than planning', 'give examples of a literature review', 'emphasise the importance of consulting an authority in statistical research', 'warn readers about the difficulties of writing a literature review', 'explain how to write a successful literature review'], answer: 4, highlight: 'The literature review for an essay should be written in three stages.' }] },
                    { id: 't3p6', label: 'The Rescuers', text: `<p>The Rescuers is an old classic Disney story about a little girl from an orphanage. She is unfortunate enough to be adopted by a horrible Medusa, a woman whose great desire is to find the world's largest diamond, the Devil's Eye, which is hidden in a well in the area of Devil Bayou. She keeps the girl in an old pirate ship guarded by her two ferocious alligator pets as she uses her tiny figure to climb down the wall to look for the diamond. Strangely enough the girl is, in the end, saved by two mouse members of Rescue Aid Society thanks to a note she has left inside a bottle that is later found by the very two mice. Rescue Aid Society is an international organization dedicated to help abduction victims around the world shadowing the United Nations. The film has been praised by critics for inclusion of delegates from Arab countries in the Rescue Aid Society.</p>`, questions: [{ id: 't3q16', text: 'Which of the following can be understood from the passage?', options: ['Medusa has a variety of pets.', 'The girl is happy that she has been finally adopted.', 'The alligators are tamed and so they do not give harm to strangers.', 'The girl is liberated at last.', 'The girl is held captive in the well.'], answer: 3, highlight: 'the girl is, in the end, saved by two mouse members of Rescue Aid Society' }, { id: 't3q17', text: 'According to the passage,', options: ['a large group of members of the United Nations have rescued the girl', 'the girl is willingly helping Medusa to find the diamond', 'the girl is kidnapped by the Rescue Aid Society', 'the Rescuers was the first film to present Arabs as members of the UN', 'the girl is being misused by Medusa for her own desire to seize a valuable stone'], answer: 4, highlight: 'She keeps the girl in an old pirate ship guarded by her two ferocious alligator pets as she uses her tiny figure to climb down the wall to look for the diamond.' }, { id: 't3q18', text: 'The underlined word \'abduction\' in the passage is closest in meaning to', options: ['kidnapping', 'total', 'illness', 'accident', 'shock'], answer: 0, highlight: 'Rescue Aid Society is an international organization dedicated to help abduction victims around the world' }] },
                    { id: 't3p7', label: 'Armadillos', text: `<p>The word armadillo refers to various armoured mammals found mainly in tropical and subtropical regions of Central and South America. Most of the 20 species inhabit open areas, such as grasslands, but some also live in forests. Armadillos live alone, in pairs or in small groups. Emerging from their burrows primarily at night, these efficient diggers use their keen sense of smell to locate food. They feed on termites and other insects, along with vegetation, small animals and larvae. The common nine-banded armadillo is used in leprosy research because it is naturally susceptible to the disease and because the microbe that causes leprosy does not grow in laboratory culture media. Armadillos are timid. When threatened, they retreat to their burrows or, if caught in the open, draw in their feet so that their armour touches the ground. Some armadillos are able to roll into a solid ball as a means of protecting their vulnerable underpants. Extinct relatives of today's armadillos included a 2-metre, 230-kg beast that roamed Florida as recently as 10,000 years ago. It is not certain whether pre-Columbian humans contributed to this armadillo's extinction.</p>`, questions: [{ id: 't3q19', text: 'According to the passage, what is true about armadillos?', options: ['They appear mostly during the day.', 'They have grown in size over the course of history.', 'They don\'t tend to exhibit aggressive behaviour.', 'Pre-Columbian humans caused most kinds to die out.', 'The majority of them are used for medical purposes.'], answer: 2, highlight: 'Armadillos are timid. When threatened, they retreat to their burrows or, if caught in the open, draw in their feet so that their armour touches the ground.' }, { id: 't3q20', text: 'It can be inferred that armadillos', options: ['inhabit all the continents except America', 'contribute to the growth of larvae', 'are disease-resistant', 'refrain from eating meat', 'rely on their sense of smell to detect food'], answer: 4, highlight: 'these efficient diggers use their keen sense of smell to locate food.' }, { id: 't3q21', text: 'The passage primarily focuses on', options: ['the similarities between different armadillo species', 'the diet and behaviour of armadillos', 'how armadillos adapt to the environment', 'the ways armadillos protect against predators', 'the contrast between different armadillo types'], answer: 1, highlight: 'The word armadillo refers to various armoured mammals...' }] },
                    { id: 't3p8', label: 'Cheap airlines', text: `<p>Cheap flight tickets and a large number of low-cost airlines have changed the way we travel. In the beginning, most people were delighted as they could grab a bargain. Having to pay for in-flight lunch, having to book months in advance or having to land at remote airports appeared as small inconvenience. But the list seems to grow bigger: having to cram into a smaller space, to put up with barely adequate service with non-refundable tickets, baggage restrictions, long queues and so on. All these issues may spoil the experience of flying, making it more of an unpleasant experience. One of the most gratifying things about flying abroad for leisure is the sense of being taken care of, even of feeling privileged and a bit important; if only for a few hours. Now, cheap flights might appeal to thousands who try to travel for less, but they have also turned travelling into a boring, lesser thing.</p>`, questions: [{ id: 't3q22', text: 'It is clear from this passage that cheap flights', options: ['are good opportunities to have the experience of travelling', 'enable more people to experience the pleasure of flying', 'are dull and can take the joy out of a trip', 'have brought a lot of advantages to passengers', 'should be provided all over the world'], answer: 2, highlight: 'cheap flights might appeal to thousands who try to travel for less, but they have also turned travelling into a boring, lesser thing.' }, { id: 't3q23', text: 'It can be understood from the passage that the so-called cheap airlines', options: ['undermine safety by lowering the standards', 'are in effect deceiving travellers by not offering what they are supposed to', 'can have negative effects on tourism in the long run', 'compromise the travelling experience badly, so it makes sense to avoid them', 'do not stand by their promises, letting down those who want to enjoy their flight'], answer: 3, highlight: 'All these issues may spoil the experience of flying, making it more of an unpleasant experience.' }, { id: 't3q24', text: 'The passage is mainly about', options: ['the trouble airlines go through due to the fact that they sell cheap tickets', 'the problems cheap flights pose concerning risks', 'the side effects of otherwise temptingly cheap ways of travelling', 'the travellers who think they are privileged and need pampering during their flights', 'encouraging people to travel by air'], answer: 2, highlight: 'cheap flights might appeal to thousands who try to travel for less, but they have also turned travelling into a boring, lesser thing.' }] }
                ]
            },

            {

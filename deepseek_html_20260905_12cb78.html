                    { id: 'p3t1q1', label: 'Soru 1', text: `<p>(I) Grape leaves are a staple in Turkish cuisine. (II) Think of the traditional dish stuffed grape leaves, or dolmas, served in Turkish homes and restaurants. (III) Pick grape leaves fresh off the vine in late spring or early summer when the tender leaves are plentiful. (IV) If you have access to grapevines—in a vineyard, growing on an arbor in your yard, or growing wild—you have a treasure trove of taste at hand. (V) Then, use them in Turkish recipes or preserve and store them for later use.</p>`, questions: [{ id: 'p3t1q1', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 2, highlight: '(III) Pick grape leaves fresh off the vine in late spring or early summer when the tender leaves are plentiful.' }] },
                    { id: 'p3t1q2', label: 'Soru 2', text: `<p>(I) A great deal of the intentional marine turtle harvest worldwide is for the food industry. (II) In many parts of the world, the meat of sea turtles is considered a delicacy. (III) Texts dating back to the 5th century BCE describe sea turtles as exotic delicacies in ancient China too. (IV) Historically, many coastal communities around the world have depended on sea turtles as a source of protein. (V) Tortoiseshell is a traditional decorative ornamental material used in Chinese and Japanese cultures.</p>`, questions: [{ id: 'p3t1q2', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 4, highlight: '(V) Tortoiseshell is a traditional decorative ornamental material used in Chinese and Japanese cultures.' }] },
                    { id: 'p3t1q3', label: 'Soru 3', text: `<p>(I) The Channel Tunnel between England and France is regarded by many people as one of the most remarkable construction achievements ever. (II) The tunnel underwent a series of tests at the time. (III) Indeed, some might say it is one of the wonders of the world. (IV) However, much of it is underground, with only the two terminals at either end being obviously connected to the project. (V) Thus, it is now difficult to visualize the scale of the project.</p>`, questions: [{ id: 'p3t1q3', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 1, highlight: '(II) The tunnel underwent a series of tests at the time.' }] },
                    { id: 'p3t1q4', label: 'Soru 4', text: `<p>(I) When a child cannot watch television, play video games or is not participating in a scheduled "externally focused" activity, he becomes internally focused on something else. (II) It is commonly thought that play is the opposite of work. (III) Yet, it is through play that we do much of our learning. (IV) We learn best when we are having fun. (V) Play, more than any other activity, fuels the healthy development of children and the continued healthy development of adults.</p>`, questions: [{ id: 'p3t1q4', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 0, highlight: '(I) When a child cannot watch television, play video games or is not participating in a scheduled "externally focused" activity, he becomes internally focused on something else.' }] },
                    { id: 'p3t1q5', label: 'Soru 5', text: `<p>(I) A Tale of Two Cities, a novel by Charles Dickens, contrasts the social and political events taking place in Paris and London during and prior to the French Revolution in the mid-to-late eighteenth century. (II) Dickens draws unsettling parallels between the two cities. (III) While doing that, he vividly depicts abject poverty, appalling starvation, rampant crime, ruthless capital punishment and aristocratic greed. (IV) On the contrary, class struggle is an inevitable theme in a novel revolving around the French Revolution. (V) The novel questions the degree to which the French revolutionaries of the late eighteenth century upheld enlightenment-era ideals of rational thought, tolerance and liberty.</p>`, questions: [{ id: 'p3t1q5', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 3, highlight: '(IV) On the contrary, class struggle is an inevitable theme in a novel revolving around the French Revolution.' }] },
                    { id: 'p3t1q6', label: 'Soru 6', text: `<p>(I) Being green helps the red-eyed tree frog blend in with tree leaves. (II) This keeps it hidden from both the insects it eats and the predators that want to eat it. (III) Red-eyed tree frogs are active at night and rest during the day. (IV) When one of these frogs sits still on a green leaf, legs tucked in and eyes shut, it is practically invisible. (V) However, when they open their huge, red eyes, they become visible and can be detected on the leaf.</p>`, questions: [{ id: 'p3t1q6', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 2, highlight: '(III) Red-eyed tree frogs are active at night and rest during the day.' }] },
                    { id: 'p3t1q7', label: 'Soru 7', text: `<p>(I) Traditional Chinese medicine explains that health is the result of a harmonious balance of the complementary extremes of "yin" and "yang" of the life force known as "qi," pronounced "chi." (II) Illness is said to be the consequence of an imbalance of these forces. (III) How acupuncture works scientifically remains unclear. (IV) Qi is said to flow through pathways in the human body. (V) These are accessible through 350 acupuncture points in the body and inserting needles into these points is said to bring the energy flow back into proper balance.</p>`, questions: [{ id: 'p3t1q7', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 2, highlight: '(III) How acupuncture works scientifically remains unclear.' }] },
                    { id: 'p3t1q8', label: 'Soru 8', text: `<p>(I) Museums attract thousands of people around the world as major cultural sites. (II) They developed from privately owned 'cabinets or chambers of curiosity' where wealthy collectors exhibited strange and spectacular items which captured the public imagination. (III) Throughout their history, museums had a lot to say about the collectors' or their patrons' beliefs and priorities. (IV) They didn't reveal anything about those who actually had produced the artefacts on display, though. (V) But it is very difficult these days to measure the effects a museum visit has on those visitors.</p>`, questions: [{ id: 'p3t1q8', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 4, highlight: '(V) But it is very difficult these days to measure the effects a museum visit has on those visitors.' }] },
                    { id: 'p3t1q9', label: 'Soru 9', text: `<p>(I) Planting millions of trees in strategic locations could do wonders for halting the expansion of current deserts. (II) The government is currently planting a nearly 3,000-mile-long belt of trees along the edge of the Gobi Desert to put brakes on dust storms and prevent dune migration. (III) Furthermore, slowing the progress of desertification will require a worldwide campaign to improve agricultural methods, regenerate plant life and conserve precious soil fertility. (IV) A similar "green wall" is being considered along the frontier of the Sahara. (V) On a smaller scale, simply planting trees around fields will cut winds that contribute to erosion of topsoil.</p>`, questions: [{ id: 'p3t1q9', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 2, highlight: '(III) Furthermore, slowing the progress of desertification will require a worldwide campaign to improve agricultural methods, regenerate plant life and conserve precious soil fertility.' }] },
                    { id: 'p3t1q10', label: 'Soru 10', text: `<p>(I) Exercise is not just about aerobic capacity and muscle size; it's much more than that. (II) Exercise builds and strengthens muscles, which can protect the bones from injury and support and protect joints. (III) People who exercise regularly tend to do so because it gives them an enormous sense of wellbeing. (IV) They feel more energetic throughout the day, sleep better at night, have sharper memories and feel more relaxed and positive about themselves and their lives. (V) Besides, it's also a powerful medicine for many common mental health challenges.</p>`, questions: [{ id: 'p3t1q10', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 1, highlight: '(II) Exercise builds and strengthens muscles, which can protect the bones from injury and support and protect joints.' }] },
                    { id: 'p3t1q11', label: 'Soru 11', text: `<p>(I) Big companies employ workers to invent new games, but many games are invented by ordinary people with a good idea. (II) An unemployed architect thought up Scrabble in 1931. (III) It is thought that chess began in China or India around 1,400 years ago. (IV) Monopoly was invented in 1933 during the Great Depression by an American salesman. (V) The dice game Yahtzee was invented in 1956 by a Canadian couple to play on their yacht.</p>`, questions: [{ id: 'p3t1q11', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 2, highlight: '(III) It is thought that chess began in China or India around 1,400 years ago.' }] },
                    { id: 'p3t1q12', label: 'Soru 12', text: `<p>(I) Sir Wilfred Thesiger, a British explorer, is considered among the greatest in the 20th century. (II) Born in Addis Ababa, Ethiopia, on 3 June 1910, he returned to the country again in 1930 after completing his education in Britain. (III) His collection of photographs was donated to a museum in the UK. (IV) During his travels throughout the Arabian Peninsula, he took over 40,000 photographs. (V) And he compiled all of them in his book, Arabian Sands, recognized as one of the great records of early travel in Arabia.</p>`, questions: [{ id: 'p3t1q12', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 2, highlight: '(III) His collection of photographs was donated to a museum in the UK.' }] },
                    { id: 'p3t1q13', label: 'Soru 13', text: `<p>(I) In his architectural works, Michelangelo defied the conventions of his time. (II) Michelangelo drew extensively as a child, and his father placed him under the tutelage of Ghirlandaio, a respected artist of the day. (III) After one unproductive year, Michelangelo became the student of Bertoldo di Giovanni, a sculptor employed by the Medici family. (IV) From 1490 to 1492, Michelangelo lived with the Medici; during this time he learned from such philosophers as Ficino, Landino, Poliziano and Savonarola. (V) Although Michelangelo claimed that he was self-taught, one might perceive in his work the influence of such artists as Leonardo, Giotto and Poliziano.</p>`, questions: [{ id: 'p3t1q13', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 0, highlight: '(I) In his architectural works, Michelangelo defied the conventions of his time.' }] },
                    { id: 'p3t1q14', label: 'Soru 14', text: `<p>(I) Our ears allow us to detect sounds, which pass through the air as waves of varying pressure. (II) Vertebrates have a pair of ears, placed symmetrically on opposite sides of the head. (III) On reaching the ear, the waves travel through several structures to the cochlea in the inner ear. (IV) There, receptor cells produce signals that go to the brain. (V) The human ear can detect sounds over a very wide range of pitch and loudness, from the high-pitched squeaks of a mouse to the roar of a passenger jet.</p>`, questions: [{ id: 'p3t1q14', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 1, highlight: '(II) Vertebrates have a pair of ears, placed symmetrically on opposite sides of the head.' }] },
                    { id: 'p3t1q15', label: 'Soru 15', text: `<p>(I) Today, many people are attracted to the idea of learning how to fold origami figures because paper is a cheap craft supply. (II) When origami was first practiced, though, it was a craft only for the elite. (III) Japanese monks folded origami figures for religious purposes. (IV) Origami was also used in various formal ceremonies, such as the practice of folding paper butterflies to adorn sake bottles at a Japanese couple's wedding reception. (V) Since paper degraded as it aged, it was hard to come up with an exact timeline for the invention of origami.</p>`, questions: [{ id: 'p3t1q15', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 4, highlight: '(V) Since paper degraded as it aged, it was hard to come up with an exact timeline for the invention of origami.' }] }
                ]
            },
            // Test 2 (Tam – 15 soru)
            {
                id: 'p3t2',
                passages: [
                    { id: 'p3t2q1', label: 'Soru 1', text: `<p>(I) For most people, the process of smelling gives little information concerning the ingredients of a substance. (II) Humans have a very keen sense of smell. (III) We can detect thousands of different smells. (IV) This ability relies on the presence of special sensory receptors in the upper part of the nose. (V) When stimulated by odour molecules, these receptors send signals along nerves to the brain for processing.</p>`, questions: [{ id: 'p3t2q1', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 0, highlight: '(I) For most people, the process of smelling gives little information concerning the ingredients of a substance.' }] },
                    { id: 'p3t2q2', label: 'Soru 2', text: `<p>(I) A caravan was a group of merchants, pilgrims or travelers journeying together, usually for mutual protection in deserts or other hostile regions. (II) The animal most commonly used in caravans was the camel because of its ability to go without water for several days and its loading capacity. (III) In some areas, the camel was harnessed to a cart, but usually the load was divided into two parts and secured on either side of the camel's back. (IV) Therefore, the timing of caravans was governed by the availability of water and pasture. (V) In hot weather, on a long journey, a camel characteristically carried about 350 pounds while on shorter journeys the animal's load might be increased to 1,000 pounds.</p>`, questions: [{ id: 'p3t2q2', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 3, highlight: '(IV) Therefore, the timing of caravans was governed by the availability of water and pasture.' }] },
                    { id: 'p3t2q3', label: 'Soru 3', text: `<p>(I) Teeth come in four main types: incisors, canines, premolars and molars. (II) Each is shaped for a specific function. (III) People have two sets of teeth during their lives: the 20 milk teeth emerge between the ages of about six months and three years. (IV) Sharks, for example, grow a new set of teeth every two weeks to replace worn teeth. (V) The 32 permanent teeth emerge from the age of about six years into the early twenties.</p>`, questions: [{ id: 'p3t2q3', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 3, highlight: '(IV) Sharks, for example, grow a new set of teeth every two weeks to replace worn teeth.' }] },
                    { id: 'p3t2q4', label: 'Soru 4', text: `<p>(I) According to Plato, most of us live in a world of relative ignorance. (II) We are even comfortable with that ignorance because it is all we know. (III) Plato likens uneducated people to prisoners chained in a cave and unable to see the reality. (IV) When we first start facing truth, the process may be frightening. (V) However, once we've tasted the truth, we won't ever want to go back to being ignorant.</p>`, questions: [{ id: 'p3t2q4', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 3, highlight: '(IV) When we first start facing truth, the process may be frightening.' }] },
                    { id: 'p3t2q5', label: 'Soru 5', text: `<p>(I) Whales communicate with one another by making eerie, low-frequency moaning noises. (II) Sound travels over four times as fast in water than it does on land, making whale communication far quicker than human communication. (III) When their vision is limited, they use echolocation, an astonishing type of sensing mechanism. (IV) The sounds that whales make can travel hundreds or even thousands of miles across entire oceans. (V) They may be used for long-range contact, call for assembly, search for mates, greeting, threat or individual identification.</p>`, questions: [{ id: 'p3t2q5', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 2, highlight: '(III) When their vision is limited, they use echolocation, an astonishing type of sensing mechanism.' }] },
                    { id: 'p3t2q6', label: 'Soru 6', text: `<p>(I) Early skyscrapers were built with thick, heavy walls of solid brick, stone or concrete. (II) Ever since the first skyscraper in Chicago, more and more buildings reaching the sky have been constructed. (III) Now the skyscrapers are being built with a steel framework that supports the weight of the building. (IV) This takes the place of the old solid walls and makes it possible for them to be built to greater height. (V) The idea came mostly from engineers who were able to see a skyscraper framework as a kind of steel bridge that could carry the building on its own.</p>`, questions: [{ id: 'p3t2q6', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 1, highlight: '(II) Ever since the first skyscraper in Chicago, more and more buildings reaching the sky have been constructed.' }] },
                    { id: 'p3t2q7', label: 'Soru 7', text: `<p>(I) Mother Teresa was a Catholic nun of Albanian ethnicity and Indian citizenship. (II) She founded the Missionaries of Charity in Calcutta, India, in 1950. (III) For over 45 years, she ministered to the poor, sick, orphaned and dying, while guiding the Missionaries of Charity's expansion. (IV) Following her death, she was beatified by Pope John Paul II and given the title Blessed Teresa of Calcutta. (V) Olivia Hussey acted as Mother Teresa in the Italian television ministers.</p>`, questions: [{ id: 'p3t2q7', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 4, highlight: '(V) Olivia Hussey acted as Mother Teresa in the Italian television ministers.' }] },
                    { id: 'p3t2q8', label: 'Soru 8', text: `<p>(I) It's interesting to see how the development of the hot-air balloon has gone full circle on itself. (II) At the very start, the first balloonists burnt materials onboard for balloon to generate heat to propel the envelope into the air. (III) A balloon is really one of the simplest forms of aircraft. (IV) This practice then became obsolete as gas and helium designs were introduced as it was considered safer and more reliable than flying with an open flame. (V) It is only within the last 50 or so years that hot air balloons have come back into interest.</p>`, questions: [{ id: 'p3t2q8', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 2, highlight: '(III) A balloon is really one of the simplest forms of aircraft.' }] },
                    { id: 'p3t2q9', label: 'Soru 9', text: `<p>(I) In the world, English is the most common language. (II) A language is both a communication tool and a system of abstraction with which we interact with the world. (III) All widely used languages are composed of a spoken form and a written form. (IV) We receive meaningful information from the outside world by listening and reading, and we send out our intentions to the world by talking and writing. (V) In between, we use vocabulary to manipulate and process information or to think.</p>`, questions: [{ id: 'p3t2q9', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 0, highlight: '(I) In the world, English is the most common language.' }] },
                    { id: 'p3t2q10', label: 'Soru 10', text: `<p>(I) Pasteur was a chemist who showed that food decays because of microorganisms, such as bacteria. (II) Pasteur's later work on diseases included work on fowl cholera. (III) He found that heat treatment killed these microbes. (IV) This process, pasteurization, is still used to preserve foods. (V) Pasteur also showed how bacteria can cause disease and developed the use of vaccines to control them.</p>`, questions: [{ id: 'p3t2q10', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 1, highlight: '(II) Pasteur\'s later work on diseases included work on fowl cholera.' }] },
                    { id: 'p3t2q11', label: 'Soru 11', text: `<p>(I) The human race, in its constant struggle to improve its standard of living, has invariably depended on colossal amounts of electric power. (II) A present-day estimate indicates that we need 320 billion kilowatt-hours of energy every day. (III) Today, most of this enormous requirement is addressed by burning fossil fuels. (IV) While it can be used to supplement the world's ever depleting reserves of traditional fossil fuels, it is not a 100% clean, nonpolluting alternative. (V) So far, they have catered to our energy needs very efficiently, but they are rapidly depleting.</p>`, questions: [{ id: 'p3t2q11', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 3, highlight: '(IV) While it can be used to supplement the world\'s ever depleting reserves of traditional fossil fuels, it is not a 100% clean, nonpolluting alternative.' }] },
                    { id: 'p3t2q12', label: 'Soru 12', text: `<p>(I) This audio book, very interestingly told and discreetly educational, takes the listener into the world of poet Emily Dickinson. (II) As well as a fascinating account of two lives, the story is pleasantly informative about the 19th century American life. (III) The choice of narrator in any story is crucial for the way the story is perceived by the readers. (IV) It is told from a friend's point of view, and the narrator Flo Gibson's voice, endearingly authentic, is ideal for this type of nostalgia. (V) Her voice reveals a kind and experienced character, one who is willing to confide in her audience without excessive drama.</p>`, questions: [{ id: 'p3t2q12', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 2, highlight: '(III) The choice of narrator in any story is crucial for the way the story is perceived by the readers.' }] },
                    { id: 'p3t2q13', label: 'Soru 13', text: `<p>(I) Checkers or draughts, as it is known in England, has ancient roots. (II) The exceptions to this are the United States, Canada and Australia, where the name "checkers" is preferred. (III) It is thought that the earliest form of checkers was a game discovered in an archaeological dig at Ur in Iraq. (IV) Carbon dating makes it appear that this game was played around 3000 BCE. (V) However, the game used a slightly different board, a different number of pieces and no one is quite certain of the exact rules.</p>`, questions: [{ id: 'p3t2q13', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 1, highlight: '(II) The exceptions to this are the United States, Canada and Australia, where the name "checkers" is preferred.' }] },
                    { id: 'p3t2q14', label: 'Soru 14', text: `<p>(I) Exercising regularly to keep physically fit is an essential part of a healthy lifestyle. (II) Even moderate exercise performed regularly helps protect against diseases and prolongs life expectancy. (III) In a fit person, this rate returns to normal within a few minutes. (IV) As well as being enjoyable and improving strength, regular exercise improves the efficiency of the muscles, the heart and the whole circulatory system. (V) It also helps prevent a person from becoming overweight, which has many negative effects on health.</p>`, questions: [{ id: 'p3t2q14', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 2, highlight: '(III) In a fit person, this rate returns to normal within a few minutes.' }] },
                    { id: 'p3t2q15', label: 'Soru 15', text: `<p>(I) When light rays reach the retina, they trigger chemical changes in different light-absorbing substances in the rod and cone cells. (II) Whenever we are awake, our eyes work constantly to collect information about the world. (III) These trigger electrical signals in the cells. (IV) The rods and cones link to a system of connecting nerve cells. (V) These perform some initial processing of the signals and then transmit them along optic nerve fibres to the brain.</p>`, questions: [{ id: 'p3t2q15', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 1, highlight: '(II) Whenever we are awake, our eyes work constantly to collect information about the world.' }] }
                ]
            },
            // Test 3 (Tam – 15 soru)
            {
                id: 'p3t3',
                passages: [
                    { id: 'p3t3q1', label: 'Soru 1', text: `<p>(I) When air is inhaled, it passes down the trachea, also called as the windpipe. (II) This splits into two airways called main bronchi, which go to the two lungs. (III) Each bronchus is then divided into smaller bronchi, which then split into bronchioles. (IV) These terminate in groups of tiny air sacs called alveoli. (V) Structures in the respiratory system are also vital to speech.</p>`, questions: [{ id: 'p3t3q1', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 4, highlight: '(V) Structures in the respiratory system are also vital to speech.' }] },
                    { id: 'p3t3q2', label: 'Soru 2', text: `<p>(I) The job of the digestive system is to break down the food we eat into smaller units called nutrients. (II) The nutrients are then absorbed into the bloodstream and fuel the body's activities. (III) The mouth takes in food and begins the digestive process, which continues in the stomach. (IV) The food then passes to the intestines, which complete the process. (V) Each day the pancreas releases about 1.5 litres of enzyme-containing juice into the tract.</p>`, questions: [{ id: 'p3t3q2', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 4, highlight: '(V) Each day the pancreas releases about 1.5 litres of enzyme-containing juice into the tract.' }] },
                    { id: 'p3t3q3', label: 'Soru 3', text: `<p>(I) Pots and pans were once considered to be precious possessions. (II) In the 14th century in England, the pieces of cookware—iron pots, griddles, spits and frying pans—were numbered among the king's jewels. (III) They are now exhibited in the British Museum. (IV) They were difficult to come by, thus extremely valuable. (V) When the king went on a journey or made a visit, these pieces travelled along in a separate coach.</p>`, questions: [{ id: 'p3t3q3', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 2, highlight: '(III) They are now exhibited in the British Museum.' }] },
                    { id: 'p3t3q4', label: 'Soru 4', text: `<p>(I) The Caribbean Islands are strung out in a long line between Mexico and Venezuela. (II) Some of these islands are no more than tiny uninhabited rocks while others are quite large with sizeable populations. (III) The word "Caribbean" has multiple uses, the principal ones being geographical and political. (IV) In the 18th and the 19th centuries, the whole region was dominated by European colonial powers that brought African slaves to the islands to harvest sugarcane. (V) Today, the descendants of those slaves make up a large part of the islands' population.</p>`, questions: [{ id: 'p3t3q4', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 2, highlight: '(III) The word "Caribbean" has multiple uses, the principal ones being geographical and political.' }] },
                    { id: 'p3t3q5', label: 'Soru 5', text: `<p>(I) The famous eruption of Krakatoa in 1883 has been estimated as the biggest bang in recorded history, heard over 3000 miles away. (II) It killed over 36,000 people, and destroyed more than 3/4 of its island, literally blowing it to pieces. (III) All of this is well known. (IV) Krakatoa itself is the reformation of an earlier volcano. (V) What is less well known is that this same volcano is a repeat offender, and it is still with us.</p>`, questions: [{ id: 'p3t3q5', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 2, highlight: '(III) All of this is well known.' }] },
                    { id: 'p3t3q6', label: 'Soru 6', text: `<p>(I) Frankenstein is the last name of the scientist who created the monster. (II) The monster is never given a name. (III) Mary Shelley, the writer of the novel, turned her nightmare into a fascinating piece of writing. (IV) It can be assumed that Frankenstein is a fitting name for the monster, therefore, should share his creator's last name. (V) However, nowhere in the novel does the monster get referred to as "Frankenstein".</p>`, questions: [{ id: 'p3t3q6', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 2, highlight: '(III) Mary Shelley, the writer of the novel, turned her nightmare into a fascinating piece of writing.' }] },
                    { id: 'p3t3q7', label: 'Soru 7', text: `<p>(I) Cabbage soup is very popular in central and eastern Europe. (II) Broadly speaking, cabbage varieties come in two groups, classified as early and late. (III) The early varieties mature fast, in about 45 days. (IV) They produce small heads which do not keep well and are intended for consumption while fresh. (V) The late cabbage matures in about 87 days, produces a larger head, and they don't burst as quickly as early cabbages.</p>`, questions: [{ id: 'p3t3q7', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 0, highlight: '(I) Cabbage soup is very popular in central and eastern Europe.' }] },
                    { id: 'p3t3q8', label: 'Soru 8', text: `<p>(I) The environmental movement is a diverse scientific, social and political movement. (II) In general terms, environmentalists advocate the sustainable management of resources and the protection of the natural environment through changes in public policy and individual behaviour. (III) In its recognition of humanity as a participant in ecosystems, the movement is centred around ecology, health and human rights. (IV) Environmentalism as a movement covers broad areas of institutional oppression. (V) Examples of these oppressions are consumption of ecosystems and natural resources into waste.</p>`, questions: [{ id: 'p3t3q8', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 3, highlight: '(IV) Environmentalism as a movement covers broad areas of institutional oppression.' }] },
                    { id: 'p3t3q9', label: 'Soru 9', text: `<p>(I) A blood diamond is a diamond sold to finance terrorism or other violent acts including civil war. (II) The blood diamond trade has been recognized as a global problem, with terrorist organizations in a wide range of nations benefiting from the trade. (III) The blood diamond problem is most severe in Africa, in countries like Liberia, Angola and Sierra Leone. (IV) Leonardo Di Caprio acted in Blood Diamond that tells the story of a diamond smuggler in 2006. (V) International organizations such as the United Nations have enacted resolutions to combat the sale of blood diamonds.</p>`, questions: [{ id: 'p3t3q9', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 3, highlight: '(IV) Leonardo Di Caprio acted in Blood Diamond that tells the story of a diamond smuggler in 2006.' }] },
                    { id: 'p3t3q10', label: 'Soru 10', text: `<p>(I) Although the guillotine is most famous for its use during the French Revolution, its original usage was not by the French. (II) It is known to have been first used as a device of punishment by the Scots in the 12th century. (III) In the 15th century, the Italians adapted its usage. (IV) King Louis XVI and Queen Marie Antoinette were executed in 1793. (V) It was not accepted as a form of capital punishment in France until 1792.</p>`, questions: [{ id: 'p3t3q10', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 3, highlight: '(IV) King Louis XVI and Queen Marie Antoinette were executed in 1793.' }] },
                    { id: 'p3t3q11', label: 'Soru 11', text: `<p>(I) The boundary between language and gesture, or verbal and nonverbal communication, can be hard to identify. (II) Gestures can be categorized as either speech-independent or speech-related. (III) Speech-independent gestures are dependent upon culturally accepted interpretations and have a direct verbal translation. (IV) Speech-related gestures are used in parallel with verbal speech to emphasize the message that is being communicated. (V) Speech-related gestures are intended to provide supplemental information to a verbal message such as pointing to an object of discussion.</p>`, questions: [{ id: 'p3t3q11', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 0, highlight: '(I) The boundary between language and gesture, or verbal and nonverbal communication, can be hard to identify.' }] },
                    { id: 'p3t3q12', label: 'Soru 12', text: `<p>(I) People all over the world are concerned about the problem of hunger. (II) Many individuals and religious, national and international organisations have worked to eliminate this terrible problem. (III) However, their efforts have met with only limited success. (IV) On the one hand, supplying food to people has always depended on agricultural production, and agricultural production has always depended on weather conditions. (V) It is widely agreed that more effective measures need to be taken to solve the problem of hunger quickly and effectively.</p>`, questions: [{ id: 'p3t3q12', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 3, highlight: '(IV) On the one hand, supplying food to people has always depended on agricultural production, and agricultural production has always depended on weather conditions.' }] },
                    { id: 'p3t3q13', label: 'Soru 13', text: `<p>(I) The communicative teaching method works by placing you in real life situations encountered in everyday life. (II) In this respect, it is different from other methods of language teaching that rely on repetition and drills. (III) Another important method that uses repetition and drills is audio-visual method. (IV) The communicative method is lively, varied and full of possibilities since the emphasis is placed on communication. (V) The key to this method is the constant interaction between the student and the teacher or between pairs or groups of students.</p>`, questions: [{ id: 'p3t3q13', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 2, highlight: '(III) Another important method that uses repetition and drills is audio-visual method.' }] },
                    { id: 'p3t3q14', label: 'Soru 14', text: `<p>(I) Atlantis was believed to be a rich and important island nation that was located along the edge of the Atlantis Ocean near the Strait of Gibraltar. (II) Its existence was first described by Plato in his work Timeaus. (III) His another important work is Republic. (IV) Plato said that Atlantis was a great empire and was believed to be the most powerful nation in the world. (V) The nation had developed an impressive civilization and had had great military success.</p>`, questions: [{ id: 'p3t3q14', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 2, highlight: '(III) His another important work is Republic.' }] },
                    { id: 'p3t3q15', label: 'Soru 15', text: `<p>(I) Having good tires on your bike is the single most important thing you can do to improve your bike's ability to handle winter conditions. (II) Tires that are knobby and are made of a sticky compound will help grip when mountain biking in snow. (III) If you will be riding in a lot of icy conditions, get tires with studs. (IV) Mountain biking in snow is very difficult with regular platform pedals. (V) If you only want to spend money on one studded tire, it will be more effective if you put it on the front.</p>`, questions: [{ id: 'p3t3q15', text: 'Anlam bütünlüğünü bozan cümle hangisidir?', options: ['I', 'II', 'III', 'IV', 'V'], answer: 3, highlight: '(IV) Mountain biking in snow is very difficult with regular platform pedals.' }] }
                ]

    part4: {

            {

                passages: [
                    { id: 'p4t1q1', label: 'Soru 1', text: `<p><strong>Kaynak cümle:</strong> About 240 million years ago, all the land on the Earth's surface was in the form of one vast continent that extended from one pole to the other.</p>`, questions: [{ id: 'p4t1q1', text: 'Bu cümleye anlamca en yakın Türkçe çeviri hangisidir?', options: ['Neredeyse 240 milyon yıl önce, dünya yüzeyinde tek bir devasa kıta şeklinde olan tüm kara parçaları bir kutuptan diğerine uzanmaktaydı.', 'Yaklaşık 240 milyon yıl önce, dünya yüzeyindeki tüm kara parçaları tek bir kıta şeklindeydi ve bir kutuptan diğerine uzanmaktaydı.', 'Yaklaşık 240 milyon yıl önce, dünya yüzeyindeki tüm kara parçaları, bir kutuptan diğerine uzanan devasa bir kıta şeklindeydi.', 'Neredeyse 240 milyon yıl önce, bir kutuptan diğerine uzanan tüm kara parçaları dünya yüzeyinde devasa bir kıta oluşturmuştu.', 'Yaklaşık 240 milyon yıl önce, dünya yüzeyindeki tüm kara parçaları ve bir uçtan diğerine uzanan kutuplar devasa bir kıta şeklindeydi.'], answer: 2, highlight: 'About 240 million years ago, all the land on the Earth\'s surface was in the form of one vast continent that extended from one pole to the other.' }] },
                    { id: 'p4t1q2', label: 'Soru 2', text: `<p><strong>Kaynak cümle:</strong> The large, brilliant fireball seen by thousands in at least six states on December 9, 1965, was reported by the press to be a meteor.</p>`, questions: [{ id: 'p4t1q2', text: 'Bu cümleye anlamca en yakın Türkçe çeviri hangisidir?', options: ['9 Aralık 1965\'te en az altı eyalette binlerce kişinin gördüğü iri, parlak ateş topunu, basın, gök taşı olarak duyurmuştu.', '9 Aralık 1965\'te binlerce kişinin gördüğü iri, parlak ateş topunun gök taşı olduğunu basın, en az altı eyalette duyurdu.', '9 Aralık 1965\'te en az altı eyalette binlerce kişi tarafından görülen ve basın tarafından gök taşı olarak isimlendirilen cisim iri, parlak bir ateş topuydu.', '9 Aralık 1965\'te en az altı eyalette binlerce kişi tarafından görülen iri, parlak ateş topunun bir gök taşı olduğu basın tarafından duyuruldu.', '9 Aralık 1965\'te en az altı eyalette binlerce kişi iri, parlak bir ateş topu görmüştü ve bunun bir gök taşı olduğu basın tarafından duyurulmuştu.'], answer: 3, highlight: 'The large, brilliant fireball seen by thousands in at least six states on December 9, 1965, was reported by the press to be a meteor.' }] },
                    { id: 'p4t1q3', label: 'Soru 3', text: `<p><strong>Kaynak cümle:</strong> I have seen a lotion advertisement which claims that its ingredients are the most advanced anti-ageing substances on the market today.</p>`, questions: [{ id: 'p4t1q3', text: 'Bu cümleye anlamca en yakın Türkçe çeviri hangisidir?', options: ['Bugün piyasadaki yaşlanmayı geciktirici en gelişmiş maddeleri içerdiği iddia edilen bir losyon reklamı gördüm.', 'Bugün gördüğüm yaşlanmayı geciktirici losyon reklamı, ürünün piyasadaki en gelişmiş maddeleri içerdiğini iddia ediyordu.', 'Gördüğüm losyon reklamının iddia ettiği şey, ürünün içindeki maddelerin, bugün piyasadaki yaşlanmayı geciktirici en gelişmiş maddeler olduğuydu.', 'Bugün, piyasadaki yaşlanmayı geciktirici en gelişmiş maddeleri içeren bir ürün olduğu iddia edilen losyonun reklamını gördüm.', 'İçindeki maddelerin bugün piyasadaki yaşlanmayı geciktirici en gelişmiş maddeler olduğunu iddia eden bir losyon reklamı gördüm.'], answer: 4, highlight: 'I have seen a lotion advertisement which claims that its ingredients are the most advanced anti-ageing substances on the market today.' }] },
                    { id: 'p4t1q4', label: 'Soru 4', text: `<p><strong>Kaynak cümle:</strong> The result of Da Vinci's inexhaustible curiosity is not only many unfinished projects but also some of the most complex and tender representations of human nature.</p>`, questions: [{ id: 'p4t1q4', text: 'Bu cümleye anlamca en yakın Türkçe çeviri hangisidir?', options: ['Da Vinci\'nin tükenmez merakının sonucu sadece pek çok yarım kalmış proje değil, aynı zamanda insan tabiatının en karmaşık ve hassas tasvirleridir.', 'İnsan tabiatının en karmaşık ve hassas tasvirlerinin yanı sıra, Da Vinci\'nin tükenmez merakı pek çok yarım kalmış proje ile sonuçlanmıştır.', 'Da Vinci, tükenmez merakı sayesinde hem insan tabiatını en karmaşık ve hassas şekilde tasvir etmiş hem de pek çok yarım kalmış projenin sahibi olmuştur.', 'Da Vinci\'nin tükenmez merakının sonuçları pek çok bitmemiş proje ve insan tabiatının en karmaşık ve hassas tasvirleridir.', 'Da Vinci, tükenmez merakının sonucu olarak ne yarım kalmış projelerini tamamlayabilmiş ne de insan tabiatının en karmaşık ve hassas tasvirlerini ortaya koyabilmiştir.'], answer: 0, highlight: 'The result of Da Vinci\'s inexhaustible curiosity is not only many unfinished projects but also some of the most complex and tender representations of human nature.' }] },
                    { id: 'p4t1q5', label: 'Soru 5', text: `<p><strong>Kaynak cümle:</strong> Chaucer, called the father of English literature, is regarded as the first author to demonstrate the artistic features of English.</p>`, questions: [{ id: 'p4t1q5', text: 'Bu cümleye anlamca en yakın Türkçe çeviri hangisidir?', options: ['İngilizcenin sanatsal özelliklerini sergileyen ilk yazarın, İngiliz edebiyatının babası olarak adlandırılan Chaucer olduğu kabul edilir.', 'İngilizcenin sanatsal özelliklerini sergileyen ilk yazar olarak kabul edilen Chaucer, İngiliz edebiyatının babası olarak adlandırılmaktadır.', 'Chaucer, İngilizcenin sanatsal özelliklerini sergileyen ilk yazar olarak kabul edilir ve İngiliz edebiyatının babası olarak adlandırılır.', 'Chaucer, İngiliz edebiyatının babası olarak adlandırılarak İngilizcenin sanatsal özelliklerini sergileyen ilk yazar olarak kabul edilmiştir.', 'İngiliz edebiyatının babası olarak adlandırılan Chaucer, İngilizcenin sanatsal özelliklerini sergileyen ilk yazar olarak kabul edilmektedir.'], answer: 4, highlight: 'Chaucer, called the father of English literature, is regarded as the first author to demonstrate the artistic features of English.' }] },
                    { id: 'p4t1q6', label: 'Soru 6', text: `<p><strong>Kaynak cümle:</strong> Soon after storms destroyed the city, misery replaced the joy of seeing the rain experienced after months of drought.</p>`, questions: [{ id: 'p4t1q6', text: 'Bu cümleye anlamca en yakın Türkçe çeviri hangisidir?', options: ['Fırtınaların şehri yerle bir etmesinin hemen ardından yağmuru görme sevincinin yerini alan sefalet, aylarca süren kuraklıktan sonra yaşanmıştı.', 'Yağmuru görme sevincinin yerini alan şey, aylarca süren kuraklıktan sonra fırtınaların şehri yerle bir etmesinin hemen ardından yaşanan sefaletti.', 'Fırtınaların şehri yerle bir etmesinin hemen ardından, sefalet, aylarca süren kuraklıktan sonra yaşanan yağmuru görme sevincinin yerini aldı.', 'Şehrin fırtınalarla yerle bir olmasının hemen ardından, aylarca süren kuraklıktan sonra yaşanan yağmuru görme sevincinin yerini sefalet almıştı.', 'Aylarca süren kuraklıktan sonra fırtınaların şehri yerle bir etmesinin hemen ardından yaşanan sefalet, yağmuru görme sevincinin yerini aldı.'], answer: 3, highlight: 'Soon after storms destroyed the city, misery replaced the joy of seeing the rain experienced after months of drought.' }] },
                    { id: 'p4t1q7', label: 'Soru 7', text: `<p><strong>Kaynak cümle:</strong> Even after he had received the Dial Award for Poetry in 1925, E.E. Cummings had difficulty in finding a publisher.</p>`, questions: [{ id: 'p4t1q7', text: 'Bu cümleye anlamca en yakın Türkçe çeviri hangisidir?', options: ['Dial Şiir Ödülü\'nü 1925 yılında almış olsa da, E.E. Cummings, bir yayıncı bulmakta zorluk çekti.', 'Dial Şiir Ödülü\'nü alan E.E. Cummings, 1925\'ten sonra bile bir yayıncı bulmakta zorluk çekmiştir.', '1925 yılında bir yayıncı bulmada bile zorluk çeken E.E. Cummings daha sonra Dial Şiir Ödülü\'nü almıştır.', '1925 yılında Dial Şiir Ödülü\'nü aldıktan sonra bile bir yayıncı bulmakta zorlanan kişi E.E. Cummings\'tir.', '1925 yılında Dial Şiir Ödülü\'nü aldıktan sonra bile E.E. Cummings bir yayıncı bulmakta zorluk çekti.'], answer: 4, highlight: 'Even after he had received the Dial Award for Poetry in 1925, E.E. Cummings had difficulty in finding a publisher.' }] },
                    { id: 'p4t1q8', label: 'Soru 8', text: `<p><strong>Kaynak cümle:</strong> Georgia O'Keeffe, known for her paintings of New York skyscrapers, is recognized as one of America's most important and successful artists.</p>`, questions: [{ id: 'p4t1q8', text: 'Bu cümleye anlamca en yakın Türkçe çeviri hangisidir?', options: ['New York gökdelenlerinin çizimleriyle bilinen Georgia O\'Keeffe, Amerika\'nın en önemli ve başarılı sanatçılarından biri olarak tanınır.', 'Amerika\'nın en önemli ve başarılı sanatçılarından biri olan Georgia O\'Keeffe, New York gökdelenlerinin çizimleriyle bilinir.', 'Georgia O\'Keeffe, New York gökdelenlerinin çizimleriyle bilinir ve Amerika\'nın en önemli ve başarılı sanatçılarından biridir.', 'Amerika\'nın en önemli ve başarılı sanatçıları arasında olan Georgia O\'Keeffe, New York gökdelenlerinin çizimleriyle tanınmıştır.', 'Georgia O\'Keeffe, Amerika\'nın en önemli ve başarılı sanatçılarından biri olarak tanınır ve New York gökdelenlerinin çizimleriyle bilinir.'], answer: 0, highlight: 'Georgia O\'Keeffe, known for her paintings of New York skyscrapers, is recognized as one of America\'s most important and successful artists.' }] },
                    { id: 'p4t1q9', label: 'Soru 9', text: `<p><strong>Kaynak cümle:</strong> Many emigrants move together with their families towards new countries where they hope to find job opportunities not available to them in their homeland.</p>`, questions: [{ id: 'p4t1q9', text: 'Bu cümleye anlamca en yakın Türkçe çeviri hangisidir?', options: ['Birçok göçmen ve aileleri, kendi ülkelerinde elde edemedikleri iş imkanlarını bulmayı umduklarından, yeni ülkelere doğru yol alırlar.', 'Birçok göçmen, kendi ülkelerinde iş imkanı bulamayıp, aileleri ile birlikte yeni ülkelere doğru yol alırlar.', 'Kendi ülkelerinde iş imkanı elde edememiş olan birçok göçmen, aileleri ile birlikte yeni ülkelere doğru yol alırlar.', 'Birçok göçmen, ailesi ile birlikte, kendi ülkesinde elde edemediği iş imkanlarını bulmayı umduğu yeni ülkelere doğru yol alır.', 'Birçok göçmen, kendi ülkesinde mevcut olmayan iş imkanlarına kavuşabilmek ümidiyle ailesi ile birlikte, yeni bir ülkeye doğru yol alır.'], answer: 4, highlight: 'Many emigrants move together with their families towards new countries where they hope to find job opportunities not available to them in their homeland.' }] },
                    { id: 'p4t1q10', label: 'Soru 10', text: `<p><strong>Kaynak cümle:</strong> Scientific evidence shows that people's physical and behavioural traits evolved in a period of at least 5 million years.</p>`, questions: [{ id: 'p4t1q10', text: 'Bu cümleye anlamca en yakın Türkçe çeviri hangisidir?', options: ['Bilimsel kanıtlara göre, insanların fiziksel ve davranışsal özellikleri en az 5 milyon yıllık dönem içinde gelişmiştir.', 'Bilimsel kanıtlar, insanların fiziksel ve davranışsal özelliklerinin en az 5 milyon yıllık bir sürede geliştiğini göstermektedir.', 'Bilimsel kanıtlar, insanlarda son 5 milyon yılda evrimleşerek gelişen fiziksel ve davranışsal özellikler bulunduğunu göstermektedir.', 'İnsanlarda görülen fiziksel ve davranışsal özelliklerinin en az 5 milyon yılda geliştiği bilimsel olarak kanıtlanmıştır.', 'İnsanların fiziksel ve davranışsal özelliklerinin en az 5 milyon yıllık bir sürede evrimleşip geliştiği bilimsel olarak kanıtlanmıştır.'], answer: 1, highlight: 'Scientific evidence shows that people\'s physical and behavioural traits evolved in a period of at least 5 million years.' }] },
                    { id: 'p4t1q11', label: 'Soru 11', text: `<p><strong>Kaynak cümle:</strong> Concentrating on chest compressions rather than artificial respiration in emergency cases can produce better results.</p>`, questions: [{ id: 'p4t1q11', text: 'Bu cümleye anlamca en yakın Türkçe çeviri hangisidir?', options: ['Acil durumlarda daha iyi sonuç doğurabilecek şey, suni teneffüs yerine göğüs kompresyonlarına yoğunlaşmaktır.', 'Eğer acil durumlarda suni teneffüs yerine göğüs kompresyonlarına yoğunlaşılırsa, daha iyi sonuçlar ortaya çıkabilir.', 'Acil durumlarda suni teneffüse yoğunlaşmak, göğüs kompresyonları yapmaktan daha iyi sonuçlar doğurabilir.', 'Acil durumlarda suni teneffüs yerine göğüs kompresyonlarına yoğunlaşmak daha iyi sonuçlar doğurabilir.', 'Acil durumlarda suni teneffüs yapmadan önce göğüs kompresyonlarına yoğunlaşılması daha iyi sonuçlara yol açabilir.'], answer: 3, highlight: 'Concentrating on chest compressions rather than artificial respiration in emergency cases can produce better results.' }] },
                    { id: 'p4t1q12', label: 'Soru 12', text: `<p><strong>Kaynak cümle:</strong> Economic growth, which is a necessary condition for economic development, is not sufficient on its own to ensure an increase in economic welfare.</p>`, questions: [{ id: 'p4t1q12', text: 'Bu cümleye anlamca en yakın Türkçe çeviri hangisidir?', options: ['Ekonomik gelişmenin gerekli bir koşulu olan ekonomik büyüme, ekonomik refahın artışını tek başına sağlayacak güçte değildir.', 'Ekonomik gelişme için gerekli bir koşul olan ekonomik büyüme, ekonomik refahın artışını sağlamada tek başına yeterli değildir.', 'Ekonomik refahın artışını sağlamada tek başına yeterli olmayan ekonomik büyüme, ekonomik gelişmenin gerekli bir koşuludur.', 'Ekonomik büyüme ekonomik gelişme için gerekli bir koşul olsa da ekonomik refahın yeterli olarak artışını tek başına sağlayamaz.', 'Ekonomik refahın artışı ile sağlanabilen ekonomik gelişme, ekonomik büyüme için tek başına yeterli bir koşul değildir.'], answer: 1, highlight: 'Economic growth, which is a necessary condition for economic development, is not sufficient on its own to ensure an increase in economic welfare.' }] },
                    { id: 'p4t1q13', label: 'Soru 13', text: `<p><strong>Kaynak cümle:</strong> Unfortunately, many Indigenous languages that convey communities' histories, traditions, ways of thinking and environmental knowledge are in danger of disappearing.</p>`, questions: [{ id: 'p4t1q13', text: 'Bu cümleye anlamca en yakın Türkçe çeviri hangisidir?', options: ['Ne yazık ki, yok olma tehlikesiyle karşı karşıya olan pek çok dil, toplumların tarihlerini, geleneklerini, düşünme şekillerini ve çevresel bilgilerini bize aktarır.', 'Ne yazık ki, toplumların tarihlerini, geleneklerini, düşünme şekillerini ve çevresel bilgilerini aktaran ve yok olma tehlikesiyle karşı karşıya olan pek çok dil vardır.', 'Ne yazık ki, toplumların tarihlerini, geleneklerini, düşünme şekillerini ve çevresel bilgilerini aktaran pek çok yerli dil yok olma tehlikesiyle karşı karşıyadır.', 'Ne yazık ki, pek çok yerli dil toplumların tarihlerini, geleneklerini, düşünme şekillerini ve çevresel bilgilerini aktarırken yok olma tehlikesiyle de karşı karşıyadır.', 'Bazı toplumlar, ne yazık ki, tarihlerini, geleneklerini, düşünme şekillerini ve çevresel bilgilerini aktaran yerli dillerle birlikte yok olma tehlikesiyle karşı karşıyadır.'], answer: 2, highlight: 'Unfortunately, many Indigenous languages that convey communities\' histories, traditions, ways of thinking and environmental knowledge are in danger of disappearing.' }] },
                    { id: 'p4t1q14', label: 'Soru 14', text: `<p><strong>Kaynak cümle:</strong> Two pots which belong to Bronze Age and in which there are human remains have been found at the base of a standing stone in Angus.</p>`, questions: [{ id: 'p4t1q14', text: 'Bu cümleye anlamca en yakın Türkçe çeviri hangisidir?', options: ['Angus\'ta dikili bir taşın dibinde, Bakır Çağı\'na ait olan ve içinde insan kalıntıları bulunan iki çanak ortaya çıktı.', 'İçinde insan kalıntıları olan iki çanak Angus\'ta Bakır Çağı\'na ait olan dikili bir taşın dibinde bulundu.', 'Bakır Çağı\'na ait olan iki çanak, içindeki iki insanın kalıntıları ile birlikte, Angus\'ta dikili bir taşın dibinde ortaya çıkarıldı.', 'Angus\'ta dikili bir taşın dibinde bulunan iki çanağın içinde Bakır Çağı\'na ait insan kalıntıları vardı.', 'Bakır Çağı\'na ait olan ve içinde insan kalıntıları bulunan iki çanak, Angus\'ta dikili bir taşın dibinde bulundu.'], answer: 4, highlight: 'Two pots which belong to Bronze Age and in which there are human remains have been found at the base of a standing stone in Angus.' }] },
                    { id: 'p4t1q15', label: 'Soru 15', text: `<p><strong>Kaynak cümle:</strong> In order to understand why people do the things they do and think the way they think, holism proposes that it is necessary to look at the entire person.</p>`, questions: [{ id: 'p4t1q15', text: 'Bu cümleye anlamca en yakın Türkçe çeviri hangisidir?', options: ['İnsanların yaptıkları şeyleri neden yaptıkları ve neden düşündükleri şekilde düşündüklerini anlamak için, bütüncülük, insanın bütününe bakmanın gerekli olduğunu ileri sürer.', 'Bütüncülük, insanın bütününe bakmanın insanların yaptıkları şeyleri neden yaptıkları ve neden düşündükleri şekilde düşündüklerini anlamak için gerekli olduğunu ileri sürer.', 'Bütüncülük düşüncesine göre, insanların yaptıkları şeyleri neden yaptıkları ve neden düşündükleri şekilde düşündüklerini anlamak için insanın bütününe bakmak gereklidir.', 'İnsanın bütününe bakmak, bütüncülük düşüncesine göre insanların yaptıkları şeyleri neden yaptıkları ve neden düşündükleri şekilde düşündüklerini anlamak için gerekli olan tek şeydir.', 'Bütüncülük düşüncesi, insanların yaptıkları şeyleri neden yaptıkları ve neden düşündükleri şekilde düşündüklerini anlamanın insanın bütününe bakmaktan geçtiğini ileri sürer.'], answer: 0, highlight: 'In order to understand why people do the things they do and think the way they think, holism proposes that it is necessary to look at the entire person.' }] },
                    { id: 'p4t1q16', label: 'Soru 16', text: `<p><strong>Kaynak cümle:</strong> The population of the world, having grown very slowly for the most of human history, more than doubled in the last half century.</p>`, questions: [{ id: 'p4t1q16', text: 'Bu cümleye anlamca en yakın Türkçe çeviri hangisidir?', options: ['Dünya nüfusu son yarım yüzyılda iki kattan fazla artmış olsa da insanlık tarihinin büyük bir bölümünde çok yavaş büyümüştür.', 'Dünya nüfusu insanlık tarihi boyunca yavaşça artmıştır ancak son yarım yüzyılda iki kattan fazla artış görülmüştür.', 'Dünya nüfusu son yarım yüzyılda iki kattan fazla artmıştır fakat bu büyüme insanlık tarihinin büyük bölümü boyunca çok yavaş olmuştur.', 'İnsanlık tarihinin büyük bölümünde yavaş büyümüş olan dünya nüfusu, son yarım yüzyılda iki kattan fazla arttı.', 'Yavaş büyüyen dünya nüfusu, insanlık tarihinin büyük bölümünün aksine, son yarım yüzyılda iki kattan fazla arttı.'], answer: 3, highlight: 'The population of the world, having grown very slowly for the most of human history, more than doubled in the last half century.' }] },
                    { id: 'p4t1q17', label: 'Soru 17', text: `<p><strong>Kaynak cümle:</strong> If there are hardly any frogs in a region, this means it is not a healthy place either for wildlife or for human beings.</p>`, questions: [{ id: 'p4t1q17', text: 'Bu cümleye anlamca en yakın Türkçe çeviri hangisidir?', options: ['Eğer bir bölgede hemen hemen hiç kurbağa yoksa, bu, orasının gerek vahşi yaşam gerekse insanlar için sağlıklı bir yer olmadığı anlamına gelir.', 'Eğer bir bölgede çok az kurbağa bulunuyorsa, bu, orasının vahşi yaşam veya insanlar için sağlıklı bir yer olmadığı anlamına gelmektedir.', 'Bir bölgede neredeyse hiç kurbağa olmaması, orasının gerek vahşi yaşam gerekse insanlar için sağlıklı bir yer olmadığı anlamına gelir.', 'Bir bölgenin gerek vahşi yaşam gerekse insanlar için sağlıklı bir yer olmadığı o bölgede hemen hemen hiç kurbağa olmamasından anlaşılır.', 'Bir bölgede çok az sayıda kurbağa olması, orasının ne vahşi yaşam ne de insanlar için sağlıklı bir yer olduğu anlamına gelir.'], answer: 0, highlight: 'If there are hardly any frogs in a region, this means it is not a healthy place either for wildlife or for human beings.' }] },
                    { id: 'p4t1q18', label: 'Soru 18', text: `<p><strong>Kaynak cümle:</strong> The Ministry of Culture and Tourism will invest 2 million dollars so that the ancient sites in the southeast of the country can be reopened for tourism.</p>`, questions: [{ id: 'p4t1q18', text: 'Bu cümleye anlamca en yakın Türkçe çeviri hangisidir?', options: ['Kültür ve Turizm Bakanlığı\'nın 2 milyon dolar harcayarak yaptığı yatırım sayesinde, ülkenin güneydoğusundaki eski yerleşim yerleri yeniden turizme açılacak.', 'Kültür ve Turizm Bakanlığı\'nın ülkenin güneydoğusundaki eski yerleşim yerlerini turizme tekrar açmak için harcadığı para 2 milyon dolardır.', 'Ülkenin güneydoğusundaki eski yerleşim yerlerinin tekrar turizme açılabilmesi için Kültür ve Turizm Bakanlığı tarafından 2 milyon dolar yatırım yapılacak.', 'Kültür ve Turizm Bakanlığı\'nın tekrar turizme açılabilmesi için 2 milyon dolar bütçe ayıracağı yer, ülkenin güneydoğusundaki eski yerleşim yerleridir.', 'Kültür ve Turizm Bakanlığı, ülkenin güneydoğusundaki eski yerleşim yerlerinin yeniden turizme açılabilmesi için 2 milyon dolar yatırım yapacak.'], answer: 4, highlight: 'The Ministry of Culture and Tourism will invest 2 million dollars so that the ancient sites in the southeast of the country can be reopened for tourism.' }] },
                    { id: 'p4t1q19', label: 'Soru 19', text: `<p><strong>Kaynak cümle:</strong> After a series of experiments conducted elaborately, it was found out that muscles make up almost a half of the total human weight.</p>`, questions: [{ id: 'p4t1q19', text: 'Bu cümleye anlamca en yakın Türkçe çeviri hangisidir?', options: ['Detaylı bir şekilde yürütülen bir dizi deneyden sonra, insanlarda toplam vücut ağırlığının neredeyse yarısının kaslardan meydana geldiği anlaşıldı.', 'Toplam insan ağırlığının neredeyse yarısının kasların oluşturduğunun ortaya çıkması, yürütülen bir dizi detaylı deneyden sonra gerçekleşmiştir.', 'Detaylı bir şekilde yürütülen bir dizi deneyden sonra kasların, toplam insan ağırlığının neredeyse yarısını oluşturduğu anlaşıldı.', 'Detaylı bir şekilde yürütülen deneyler, toplam insan ağırlığının neredeyse yarısının kaslar tarafından oluşturduğunu ortaya çıkardı.', 'Bir dizi detaylı deneyin ardından kasların, toplam insan ağırlığının neredeyse yarısını oluşturduğu anlaşıldı.'], answer: 0, highlight: 'After a series of experiments conducted elaborately, it was found out that muscles make up almost a half of the total human weight.' }] },
                    { id: 'p4t1q20', label: 'Soru 20', text: `<p><strong>Kaynak cümle:</strong> Some of the paintings in ancient Egyptian tombs show activities that the deceased were involved in when they were alive and also wished to carry on in eternity.</p>`, questions: [{ id: 'p4t1q20', text: 'Bu cümleye anlamca en yakın Türkçe çeviri hangisidir?', options: ['Bazı eski Mısır mezarlarında bulunan resimler, ölülerin hayatta iken ilgi duyduğu ve ebediyette de sürdürmek istediği faaliyetleri gösterir.', 'Eski Mısır mezarlarındaki resimlerin bazıları, ölülerin hayatta iken yer aldığı ve ebediyette de sürdürmeyi dilediği faaliyetleri gösterir.', 'Ölülerin hayatta iken ilgi duyup ebediyette de sürdürmeyi arzu ettikleri faaliyetleri eski Mısır mezarlarında bulunan bazı resimler göstermektedir.', 'Eski Mısır mezarlarındaki bazı resimlerde, ölülerin hayatta iken yer aldıkları faaliyetleri ebediyette de sürdürmeyi diledikleri görülür.', 'Eski Mısır mezarlarındaki bazı resimlere göre, ölüler hayatta iken yer aldıkları faaliyetleri ebediyette de sürdürmeyi dilemişlerdir.'], answer: 1, highlight: 'Some of the paintings in ancient Egyptian tombs show activities that the deceased were involved in when they were alive and also wished to carry on in eternity.' }] },
                    { id: 'p4t1q21', label: 'Soru 21', text: `<p><strong>Kaynak cümle:</strong> Inspiring many authors including Virginia Woolf and D.H. Lawrence, Thomas Hardy's works adapted to the stage are still read with great interest today.</p>`, questions: [{ id: 'p4t1q21', text: 'Bu cümleye anlamca en yakın Türkçe çeviri hangisidir?', options: ['Virginia Woolf ve D.H. Lawrence dahil pek çok yazara ilham veren Thomas Hardy\'nin sahneye uyarlanmış eserleri bugün hala büyük ilgiyle okunmaktadır.', 'Bugün hala büyük bir ilgiyle okunan ve Virginia Woolf ve D.H. Lawrence dahil pek çok yazara ilham vermiş olan Thomas Hardy\'nin eserleri sahneye uyarlanmıştır.', 'Thomas Hardy\'nin sahneye uyarlanmış ve Virginia Woolf ve D.H. Lawrence dahil pek çok yazara ilham vermiş olan eserleri, bugün hala büyük ilgiyle okunmaktadır.', 'Bugün hala büyük bir ilgiyle okunan Thomas Hardy\'nin eserleri sahneye uyarlandığında Virginia Woolf ve D.H. Lawrence dahil pek çok yazara ilham vermiştir.', 'Thomas Hardy\'nin sahneye uyarlanmış eserleri günümüzde de hala büyük bir ilgiyle okunur ve Virginia Woolf ve D.H. Lawrence dahil pek çok yazara ilham vermiştir.'], answer: 0, highlight: 'Inspiring many authors including Virginia Woolf and D.H. Lawrence, Thomas Hardy\'s works adapted to the stage are still read with great interest today.' }] },
                    { id: 'p4t1q22', label: 'Soru 22', text: `<p><strong>Kaynak cümle:</strong> If you are in a marathon and lose at least three per cent of your total body weight during the competition, your chance of getting to the finish line faster is higher.</p>`, questions: [{ id: 'p4t1q22', text: 'Bu cümleye anlamca en yakın Türkçe çeviri hangisidir?', options: ['Bir maraton sırasında toplam vücut ağırlığınızın en az yüzde üçünü kaybedebilirseniz, bitiş çizgisine daha çabuk varma şansınız yüksek olur.', 'Bir maraton koşusundaysanız ve müsabaka sırasında toplam vücut ağırlığınızın en az yüzde üçünü kaybederseniz, bitiş çizgisine daha çabuk varma şansınız daha yüksektir.', 'Eğer bir maraton koşusundaysanız ve toplam vücut ağırlığınızın en az yüzde üçünü kaybederseniz, müsabaka sırasında bitiş çizgisine daha çabuk varma şansına sahip olursunuz.', 'Eğer bir maraton koşusunda bitiş çizgisine daha çabuk varma şansına sahip olduysanız, müsabaka sırasında vücut ağırlığınızın en az yüzde üçünü kaybetmişsiniz demektir.', 'Maraton koşusu sırasında toplam vücut ağırlığının en az yüzde üçünü kaybedenlerdenseniz, bitiş çizgisine daha çabuk varma şansınız daha yüksektir.'], answer: 1, highlight: 'If you are in a marathon and lose at least three per cent of your total body weight during the competition, your chance of getting to the finish line faster is higher.' }] },
                    { id: 'p4t1q23', label: 'Soru 23', text: `<p><strong>Kaynak cümle:</strong> Exploring Turkish Cultures, a 2011 book by Laurence Raw, has offered new insights into Turkish cultures both past and present.</p>`, questions: [{ id: 'p4t1q23', text: 'Bu cümleye anlamca en yakın Türkçe çeviri hangisidir?', options: ['Hem geçmişteki hem de günümüzdeki Türk kültürlerine yeni anlayışlar getiren Türk Kültürlerini Keşfetmek, Laurence Raw\'un 2011 tarihli kitabıdır.', 'Laurence Raw tarafından yazılan 2011 tarihli Türk Kültürlerini Keşfetmek hem geçmişteki hem de günümüzdeki Türk kültürlerine yeni anlayışlar getiren bir kitaptır.', 'Laurence Raw\'un 2011 tarihli kitabı Türk Kültürlerini Keşfetmek hem geçmişteki hem de günümüzdeki Türk kültürlerine yeni anlayışlar getirmiştir.', 'Geçmişteki ve günümüzdeki Türk kültürlerine yeni anlayışlar getiren Türk Kültürlerini Keşfetmek adlı yeni kitap, Laurence Raw tarafından 2011\'de yazılmıştır.', 'Türk Kültürlerini Keşfetmek adlı 2011 tarihli kitabında Laurence Raw hem geçmişteki hem de günümüzdeki Türk kültürlerine yeni anlayışlar getirmiştir.'], answer: 2, highlight: 'Exploring Turkish Cultures, a 2011 book by Laurence Raw, has offered new insights into Turkish cultures both past and present.' }] },
                    { id: 'p4t1q24', label: 'Soru 24', text: `<p><strong>Kaynak cümle:</strong> A language learner should keep in mind that the grammar of a language teaches you how to say something correctly, not what to say.</p>`, questions: [{ id: 'p4t1q24', text: 'Bu cümleye anlamca en yakın Türkçe çeviri hangisidir?', options: ['Dil öğrenen bir kişi şunu unutmamalıdır ki bir dilin dilbilgisi, bir şeyi doğru şekilde nasıl söyleyeceğinizi öğretir, ne söyleyeceğinizi değil.', 'Dil öğrenen bir kişi, bir dilin dilbilgisinin yalnızca bir şeyi doğru şekilde nasıl söyleyeceğinizi değil, ne söyleyeceğinizi de öğrettiğini unutmamalıdır.', 'Bir dilin dilbilgisinin, ne söyleyeceğini değil bir şeyin doğru şekilde nasıl söyleyeceğini öğrettiği, dil öğrenen bir kişi tarafından unutulmamalıdır.', 'Dil öğrenen bir kişi tarafından unutulmaması gereken şey, bir dilin dilbilgisinin, bir şeyin doğru şekilde nasıl söyleyeceğini öğrettiği ancak ne söyleyeceğini öğretmediğidir.', 'Dil öğrenen bir kişi şunu unutmamalıdır ki bir dilin dilbilgisi, ne bir şeyi doğru şekilde nasıl söyleyeceğinizi ne de ne söyleyeceğinizi öğretir.'], answer: 0, highlight: 'A language learner should keep in mind that the grammar of a language teaches you how to say something correctly, not what to say.' }] }
                ]
            },

                    { id: 'p4t2q1', label: 'Soru 1', text: `<p><strong>Kaynak cümle:</strong> Çin'in güney bölgelerinde yaşayan insanların başlıca besin kaynağı olan pirinç, aynı zamanda sirke yapımında da kullanılmaktadır.</p>`, questions: [{ id: 'p4t2q1', text: 'Bu cümleye anlamca en yakın İngilizce çeviri hangisidir?', options: ['Rice, used in producing vinegar in Southern China, also serves as the major food source for the people living there.', 'Rice is not only the major food source for the people of Southern China but also an ingredient used in the making of vinegar.', 'Apart from being the major source of food for people in the south of China, rice is also used in making vinegar.', 'The people of Southern China use rice as a main food source as well as using it in the production of vinegar.', 'The major food source for the people living in the southern regions of China, rice is also used in the production of vinegar.'], answer: 4, highlight: 'Çin\'in güney bölgelerinde yaşayan insanların başlıca besin kaynağı olan pirinç, aynı zamanda sirke yapımında da kullanılmaktadır.' }] },
                    { id: 'p4t2q2', label: 'Soru 2', text: `<p><strong>Kaynak cümle:</strong> Öğretim kadrosunu dünyanın en iyi üniversitelerinden seçen Fransa'daki EDHEC Risk Enstitüsü, mesleki gelişim için olağanüstü bir alt yapı oluşturmaktadır.</p>`, questions: [{ id: 'p4t2q2', text: 'Bu cümleye anlamca en yakın İngilizce çeviri hangisidir?', options: ['The EDHEC Risk Institute in France, which creates an extraordinary platform for professional development, draws its faculty from the world\'s best universities.', 'An extraordinary platform for professional development is created by the EDHEC Risk Institute in France, which draws its faculty from the world\'s best universities.', 'Drawing its faculty from the world\'s best universities, the EDHEC Risk Institute in France creates an extraordinary background for professional development.', 'The EDHEC Risk Institute, which draws its faculty from the world\'s best universities and creates an extraordinary platform for professional development, is in France.', 'The EDHEC Risk Institute in France draws its faculty from the world\'s best universities and creates an extraordinary platform for professional development.'], answer: 4, highlight: 'Öğretim kadrosunu dünyanın en iyi üniversitelerinden seçen Fransa\'daki EDHEC Risk Enstitüsü, mesleki gelişim için olağanüstü bir alt yapı oluşturmaktadır.' }] },
                    { id: 'p4t2q3', label: 'Soru 3', text: `<p><strong>Kaynak cümle:</strong> Ünlü ressam Pablo Picasso'nun bir şaheseri, Londra'daki Sotheby's müzayede evinde 70 milyon dolara satıldı.</p>`, questions: [{ id: 'p4t2q3', text: 'Bu cümleye anlamca en yakın İngilizce çeviri hangisidir?', options: ['What was sold for 70 million dollars at Sotheby\'s auction house in London is a masterpiece by the famous painter, Pablo Picasso.', 'Sotheby\'s auction house in London sold a masterpiece by the famous painter Pablo Picasso for 70 million dollars.', 'Sotheby\'s auction house in London is where a masterpiece by the famous painter Pablo Picasso was sold for 70 million dollars.', 'A masterpiece by the famous painter Pablo Picasso was sold for 70 million dollars at Sotheby\'s auction house in London.', 'A masterpiece by the famous painter Pablo Picasso, which was sold at Sotheby\'s auction house in London, fetched 70 million dollars.'], answer: 3, highlight: 'Ünlü ressam Pablo Picasso\'nun bir şaheseri, Londra\'daki Sotheby\'s müzayede evinde 70 milyon dolara satıldı.' }] },

    }
};

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  APP STATE & RENDER
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

const state = {
    currentPart: 'part1',
    currentTestIdx: 0,
    currentPassageIdx: 0,
    answers: {},
    highlightedQuestion: null,
};

const $ = (id) => document.getElementById(id);
const partSelect = $('partSelect');
const testSelect = $('testSelect');
const passageTabs = $('passageTabs');
const passageText = $('passageText');
const questionList = $('questionList');
const passageLabel = $('passageLabel');
const questionCount = $('questionCount');
const scoreDisplay = $('scoreDisplay');
const resetBtn = $('resetBtn');

function getPart() { return DATA[state.currentPart]; }
function getTests() { const p = getPart(); return p ? p.tests : []; }
function getCurrentTest() { const tests = getTests(); return tests[state.currentTestIdx] || null; }
function getPassages() { const test = getCurrentTest(); return test ? test.passages : []; }
function getCurrentPassage() { const passages = getPassages(); return passages[state.currentPassageIdx] || null; }

function renderTestSelect() {
    const tests = getTests();
    testSelect.innerHTML = tests.map((t, i) => `<option value="${i}">Test ${i+1}</option>`).join('');
    testSelect.value = state.currentTestIdx;
}

function renderPassageTabs() {
    const passages = getPassages();
    passageTabs.innerHTML = passages.map((p, i) =>
        `<button class="${i === state.currentPassageIdx ? 'active' : ''}" data-idx="${i}">${p.label}</button>`
    ).join('');
    passageTabs.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => {
            state.currentPassageIdx = parseInt(btn.dataset.idx);
            state.answers = {};
            state.highlightedQuestion = null;
            renderAll();
        });
    });
}

function renderPassage() {
    const p = getCurrentPassage();
    if (!p) { passageText.innerHTML = '<p style="color:#999;">Parça bulunamadı.</p>'; passageLabel.textContent = '—'; return; }
    const part = getPart();
    passageLabel.textContent = `${part.name} · Test ${state.currentTestIdx+1} · ${p.label}`;

    let html = p.text;
    if (state.currentPart === 'part2' && state.highlightedQuestion) {
        const q = p.questions.find(q => q.id === state.highlightedQuestion);
        if (q && state.answers[q.id] !== undefined) {
            const selected = state.answers[q.id];
            const correctText = q.options[selected] || '';
            html = html.replace(/<span class="blank-marker">___<\/span>/, `<span class="inserted">${correctText}</span>`);
        }
    }

    if (state.highlightedQuestion) {
        const q = p.questions.find(q => q.id === state.highlightedQuestion);
        if (q && q.highlight) {
            const hl = q.highlight.trim();
            const escaped = hl.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(escaped, 'g');
            html = html.replace(regex, (match) => `<span class="hl">${match}</span>`);
        }
    }
    passageText.innerHTML = html;
}

function renderQuestions() {
    const p = getCurrentPassage();
    if (!p) { questionList.innerHTML = '<p style="color:#999;">Soru bulunamadı.</p>'; questionCount.textContent = '0 soru'; return; }
    questionCount.textContent = `${p.questions.length} soru`;

    let html = '';
    const letters = ['A','B','C','D','E'];
    p.questions.forEach((q, idx) => {
        const selected = state.answers[q.id] !== undefined ? state.answers[q.id] : null;
        const isCorrect = selected !== null && selected === q.answer;
        const isWrong = selected !== null && selected !== q.answer;

        let optsHtml = '';
        q.options.forEach((opt, oi) => {
            let cls = '';
            if (selected === oi) cls = isCorrect ? 'selected-correct' : 'selected-wrong';
            if (isWrong && oi === q.answer) cls += ' show-correct';
            optsHtml += `
                <label class="${cls}">
                    <input type="radio" name="${q.id}" value="${oi}" ${selected === oi ? 'checked' : ''} />
                    <span class="letter">${letters[oi]}.</span> ${opt}
                </label>
            `;
        });

        let fb = '';
        if (selected !== null) {
            fb = `<div class="feedback ${isCorrect ? 'correct' : 'wrong'}">
                ${isCorrect ? '✅ Doğru!' : '❌ Yanlış. Doğru cevap: ' + letters[q.answer]}
            </div>`;
        }

        html += `
            <div class="q-item" data-qid="${q.id}">
                <div class="q-text"><span class="q-num">${idx+1}</span> ${q.text}</div>
                <div class="options">${optsHtml}</div>
                ${fb}
            </div>
        `;
    });

    questionList.innerHTML = html;
    questionList.querySelectorAll('input[type="radio"]').forEach(inp => {
        inp.addEventListener('change', (e) => {
            const qid = inp.name;
            const val = parseInt(inp.value);
            const p = getCurrentPassage();
            const q = p.questions.find(q => q.id === qid);
            if (!q) return;
            state.answers[qid] = val;
            state.highlightedQuestion = qid;
            renderAll();
        });
    });
    updateScore();
}

function updateScore() {
    const p = getCurrentPassage();
    if (!p) { scoreDisplay.textContent = '0 / 0'; return; }
    let correct = 0;
    p.questions.forEach(q => {
        if (state.answers[q.id] !== undefined && state.answers[q.id] === q.answer) correct++;
    });
    scoreDisplay.textContent = `${correct} / ${p.questions.length}`;
}

function renderAll() {
    renderTestSelect();
    renderPassageTabs();
    renderPassage();
    renderQuestions();
}

partSelect.addEventListener('change', () => {
    state.currentPart = partSelect.value;
    state.currentTestIdx = 0;
    state.currentPassageIdx = 0;
    state.answers = {};
    state.highlightedQuestion = null;
    renderAll();
});

testSelect.addEventListener('change', () => {
    state.currentTestIdx = parseInt(testSelect.value);
    state.currentPassageIdx = 0;
    state.answers = {};
    state.highlightedQuestion = null;
    renderAll();
});

resetBtn.addEventListener('click', () => {
    state.answers = {};
    state.highlightedQuestion = null;
    renderAll();
});

document.addEventListener('keydown', (e) => {
    if (e.key === 'r' && !e.ctrlKey && !e.metaKey) resetBtn.click();
});

// Part seçeneklerini doldur
Object.keys(DATA).forEach(key => {
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = DATA[key].name;
    partSelect.appendChild(opt);
});

renderAll();
console.log('📖 YDT Test Book – tüm bölümler ve testler eksiksiz yüklendi!');
</script>
</body>
</html>

            // Test 2 (Tam – PDF'den 18 soru)
            {
                id: 'p2t2',
                passages: [
                    { id: 'p2t2q1', label: 'Soru 1', text: `<p><span class="blank-marker">___</span> It produces the digestive juice called bile and processes nutrients to be used by the body. It plays a role in regulating blood sugar levels and stores many important substances such as iron and some vitamins. Other functions of the liver include making proteins needed for blood clotting, breaking down old red blood cells and removing or breaking down any toxic substances that appear in the blood.</p>`, questions: [{ id: 'p2t2q1', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['Organ transplants are not regulated by the Food and Drug Administration.', 'A group of blood tests can be used to diagnose liver disease.', 'The liver is an essential organ that has many important functions in the body.', 'Hepatitis is a disease caused by the inflammation of the liver.', 'The internal structure of the liver is broadly similar in all vertebrates.'], answer: 2, highlight: 'The liver is an essential organ that has many important functions in the body.' }] },
                    { id: 'p2t2q2', label: 'Soru 2', text: `<p>Oxfam is a worldwide charity organization that continually tries to raise money to help the victims of natural disasters. The money is often collected by voluntary students all over the world. In some local communities in various countries, this organization also forms fund-raising groups that organize festivals, walks and lotteries with attractive prizes. <span class="blank-marker">___</span></p>`, questions: [{ id: 'p2t2q2', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['International non-governmental organizations have a history dating back to at least 1839.', 'The number of weather-related disasters has increased in the last decade.', 'Fund-raising through some activities is, therefore, considered unnecessary by some people.', 'It is often collected following a natural event that has destroyed many people\'s lives.', 'The proceeds from these events are then donated to various disaster funds.'], answer: 4, highlight: 'The proceeds from these events are then donated to various disaster funds.' }] },
                    { id: 'p2t2q3', label: 'Soru 3', text: `<p>The cut flower trade is now a major industry in both developing and developed countries, with global trade estimated to be worth more than $100 billion a year. The industry is especially important to the economies of developing countries, bringing in vital foreign exchange for investment in economic development. <span class="blank-marker">___</span> Colombia's flower exports, for example, generates an income for around 800,000 people while Kenya's flower industry provides vital income for up to two million people.</p>`, questions: [{ id: 'p2t2q3', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['Therefore, two governments in particular have recently enacted laws that prohibit the exploitation of workers.', 'However, this increase in profits invariably comes at a cost to the people.', 'Most flowers, produced on commercial farms, provide employment opportunities and improved livelihoods.', 'The flower industry employs a largely female workforce of poor, less educated and therefore vulnerable workers.', 'For a long time, the Netherlands has been leading in the market of cut flowers.'], answer: 2, highlight: 'Most flowers, produced on commercial farms, provide employment opportunities and improved livelihoods.' }] },
                    { id: 'p2t2q4', label: 'Soru 4', text: `<p>Tapeworms are parasites that live in other animals, including humans. They have hooks and suckers on their head to attach themselves to the animal's gut wall. <span class="blank-marker">___</span> However, they absorb food through the surface of their body.</p>`, questions: [{ id: 'p2t2q4', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['True tapeworms have both male and female reproductive systems in their bodies.', 'Some suggest that each should be considered a single organism.', 'There are worms that live in freshwater, seawater and even on the seashore.', 'They have neither a mouth nor a digestive system.', 'Some worms living in the ground help to condition the soil.'], answer: 3, highlight: 'They have neither a mouth nor a digestive system.' }] },
                    { id: 'p2t2q5', label: 'Soru 5', text: `<p>The development of refrigerated ice rinks started the transformation of ice skating from a seasonal pastime to a major sport and a source of entertainment. The first rink with artificially frozen ice, a private one, the Glacarium, was opened in London in 1876. The first artificially frozen rink in the United States was installed in the old Madison Square Garden in New York City in 1879. Throughout the century, more and more public rinks with artificially produced ice appeared. <span class="blank-marker">___</span> It also allowed ice skating to spread to regions with warm climates.</p>`, questions: [{ id: 'p2t2q5', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['Outdoor ice skating may have had a more universal appeal throughout that period, though.', 'Ice skating improved their balance, and it helped their legs to become more flexible as well.', 'A major improvement came from the United States in 1850 when E.W. Bushnell introduced the all-steel skate, which replaced the wooden footplate.', 'The ability to create sheets of ice inside large arenas gave rise to both skating sports and ice shows, which became a popular fun activity in the 20th century.', 'These groups, with other national groups formed in the interim, soon founded the International Skating Union.'], answer: 3, highlight: 'The ability to create sheets of ice inside large arenas gave rise to both skating sports and ice shows, which became a popular fun activity in the 20th century.' }] },
                    { id: 'p2t2q6', label: 'Soru 6', text: `<p>Most Americans think that ice cream is as American as baseball and apple pie. <span class="blank-marker">___</span> The Roman emperor Nero may have made a kind of ice cream. He hired hundreds of men to bring snow and ice from the mountains. He used it to make cold drinks. Hundreds of years later, traveller Marco Polo was also recorded to bring back recipes for frozen milk from China.</p>`, questions: [{ id: 'p2t2q6', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['Americans alone eat more than two billion quarts a year.', 'But ice cream was known long before America was discovered.', 'American colonists were the first to use the term "ice cream".', 'Ice cream is often called The Great American Dessert.', 'The history of ice cream also becomes a history of American culture and tastes.'], answer: 1, highlight: 'But ice cream was known long before America was discovered.' }] },
                    { id: 'p2t2q7', label: 'Soru 7', text: `<p>Peter the Great was a Russian czar in the late 17th century, best known for his extensive reforms in an attempt to establish Russia as a great nation. Indeed, under Peter's rule, Russia did become a great European nation. In 1721, he proclaimed Russia an empire and was accorded the title of Emperor of All Russia. The high taxes that often accompanied his various reforms led to revolts among citizens, which were immediately suppressed by the imposing ruler. Besides, Peter was a man who drank excessively and harboured violent tendencies. <span class="blank-marker">___</span></p>`, questions: [{ id: 'p2t2q7', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['Although he proved to be an effective leader, Peter was also known to be cruel and tyrannical.', 'Mirroring Western culture, he modernized the Russian alphabet, introduced the Julian calendar and established the first Russian newspaper.', 'Peter focused on the development of science and recruited several experts to educate his people about technological advancements.', 'Peter overcame opposition from the country\'s medieval aristocracy and initiated a series of changes that affected all areas of Russian life.', 'Peter inherited a nation that was severely underdeveloped compared to the culturally prosperous European countries.'], answer: 0, highlight: 'Although he proved to be an effective leader, Peter was also known to be cruel and tyrannical.' }] },
                    { id: 'p2t2q8', label: 'Soru 8', text: `<p>A new view of nature emerged, replacing the Greek view that had dominated science for almost 2,000 years. Science became an autonomous discipline, distinct from both philosophy and theology, and it came to be regarded as having practical goals. By the end of this period, it may not be too much to say that science had replaced Christianity as the central point of European civilization. <span class="blank-marker">___</span></p>`, questions: [{ id: 'p2t2q8', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['It was not until the 19th century that the term science came into regular use.', 'Some scholars assert that Christianity actually caused the birth of science.', 'During the 16th and 17th centuries, scientific thought underwent a revolution.', 'Greek science reached a zenith with the work of Ptolemy in the 2nd century CE.', 'Physics, in its modern sense, was founded in the mid-19th century as a synthesis of several older sciences.'], answer: 2, highlight: 'During the 16th and 17th centuries, scientific thought underwent a revolution.' }] },
                    { id: 'p2t2q9', label: 'Soru 9', text: `<p>Despite improvements in medical technology and sleep research, experts today still have not reached a conclusion about why people dream. Some say, for example, dreams are a way to process all the events and emotions we experience throughout the day. They believe dreams play an important role in mental and emotional health. Similarly, other experts claim dreams are a form of problem-solving practices. They provide us with a safe place to get our problems sorted out. <span class="blank-marker">___</span></p>`, questions: [{ id: 'p2t2q9', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['Research results regarding the function of dreaming in animals remain disputable.', 'Others claim dreams are simply a bodily function, much like blinking or breathing.', 'There seems to be a consensus that they serve some adaptive function for survival, though.', 'Yet, most experts now agree that dreams can occur at any time during the sleep cycle.', 'They have, however, put forward some interesting theories that should be further elaborated.'], answer: 1, highlight: 'Others claim dreams are simply a bodily function, much like blinking or breathing.' }] },
                    { id: 'p2t2q10', label: 'Soru 10', text: `<p>Chinese flu was first discovered in China's Fujian province in 2002. It was determined to be a particularly virulent flu strain that posed a serious threat, especially to children. However, it fortunately did not turn out to be quite as big a threat as they expected, apart from causing some damage in Europe during that year. It still continues to occur in limited numbers each flu season. <span class="blank-marker">___</span></p>`, questions: [{ id: 'p2t2q10', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['In contrast, the swine flu pandemic seen in 2009 seriously affected not only children, but also the elderly.', 'Chinese flu can be hard to distinguish from other flu strains at first.', 'The best way to prevent getting Chinese flu or any other flu virus is to get a flu shot.', 'In fact, most flu viruses are more serious for the very old and very young.', 'Doctors predicted that this flu strain could affect over six million people in the UK in 2003.'], answer: 4, highlight: 'Doctors predicted that this flu strain could affect over six million people in the UK in 2003.' }] },
                    { id: 'p2t2q11', label: 'Soru 11', text: `<p>American literature as a whole is the written or literary work produced in the area of the United States and its preceding colonies. Therefore, its literary tradition begins as linked to the broader tradition of English literature. However, unique American characteristics that were eventually added now cause it to be considered a separate literary path and tradition. <span class="blank-marker">___</span></p>`, questions: [{ id: 'p2t2q11', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['During its early history, America was a series of British colonies on the eastern coast of the present-day USA.', 'The first item printed in Pennsylvania was in German and was the largest book printed in any of the colonies.', 'In fact, Captain John Smith could be considered the first author in American literature.', 'The first explorations and conquests of the continent were made by the Spanish and the Portuguese.', 'Some say that American literature consists of all literature ever written by or for Americans in any era.'], answer: 0, highlight: 'During its early history, America was a series of British colonies on the eastern coast of the present-day USA.' }] },
                    { id: 'p2t2q12', label: 'Soru 12', text: `<p><span class="blank-marker">___</span> But in fact, the modern automobile was invented in Germany by Karl Benz in 1885. The first American cars were made by the Duryea Brothers in 1892. In 1908, Ford produced an inexpensive assembly line car, the Model T.</p>`, questions: [{ id: 'p2t2q12', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['The first ambulance was created for Napoleon\'s army in 1792.', 'There are approximately 600 million passenger cars worldwide.', 'Most people think Henry Ford invented the automobile in the first place.', 'Ford\'s complex safety procedures reduced the rate of injury.', 'Most automobiles today are propelled by an internal combustion engine.'], answer: 2, highlight: 'Most people think Henry Ford invented the automobile in the first place.' }] },
                    { id: 'p2t2q13', label: 'Soru 13', text: `<p><span class="blank-marker">___</span> Composting is a way to minimize those methane emissions, but it does a lot more than that. Because compost is used as a fertilizer, it reduces the need for chemical options, which can be harsh on the earth. Compost is also capable of capturing and eliminating some vapours and gases which can have a harmful impact on your health, with side effects ranging from nausea to throat irritation.</p>`, questions: [{ id: 'p2t2q13', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['After a purification process, methane can be used as fuel, for heating or for the production of chemicals.', 'About 700,000 tonnes of organic waste material is composted in Western Australia each year.', 'Some scientists believe methane to be wrongly blamed for global greenhouse gas emissions.', 'When the food in your trash goes to a landfill, it emits methane, a greenhouse gas that contributes to climate change.', 'Methane is a colourless and odourless gas that occurs abundantly in nature and as a product of certain human activities.'], answer: 3, highlight: 'When the food in your trash goes to a landfill, it emits methane, a greenhouse gas that contributes to climate change.' }] },
                    { id: 'p2t2q14', label: 'Soru 14', text: `<p>A hybrid-electric vehicle (HEV) has both a petrol engine and an electric motor. The petrol engine is the main power source, and it's smaller than the engines of conventional cars. The vehicle requires this additional power from electric motor during overtaking, hill climbing and accelerating from stop. <span class="blank-marker">___</span></p>`, questions: [{ id: 'p2t2q14', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['The electric motor, on the other hand, functions only when more power is needed.', 'Some car makers have shifted their focus from traditional cars to HEVs.', 'Since HEVs failed to pass high endurance tests, more research is needed to develop them.', 'Rising oil prices are one of the main reasons why more people show demand for electric cars.', 'Hybrid vehicles lag behind conventional cars when it comes to top speed.'], answer: 0, highlight: 'The electric motor, on the other hand, functions only when more power is needed.' }] },
                    { id: 'p2t2q15', label: 'Soru 15', text: `<p>Lighthouses are structures located along the shorelines of large bodies of water. For tourists, for example, they can be an interesting place to visit, explore and photograph. For historians, however, they are a window to the past and a reminder of a different way of life. <span class="blank-marker">___</span></p>`, questions: [{ id: 'p2t2q15', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['Painters use them to give variety on their canvas occupied by sea or ocean.', 'According to many, they aren\'t protected well.', 'Today they merely function as a lighthouse.', 'Loneliness was what lighthouses were said to connote in the past.', 'They can symbolize many different things for different groups.'], answer: 4, highlight: 'They can symbolize many different things for different groups.' }] },
                    { id: 'p2t2q16', label: 'Soru 16', text: `<p>When you start your homework, tackle the hardest assignments first. <span class="blank-marker">___</span> However, you'll have the most energy and focus when you begin, so it's best to use this mental power on the subjects that are most challenging. Later, when you're more tired, you can focus on the simpler things.</p>`, questions: [{ id: 'p2t2q16', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['Most students\' attention spans aren\'t very long to listen to the teacher without a break.', 'It\'s tempting to start with the easy stuff to get it out of the way.', 'Sitting for too long without relaxing will make you less productive.', 'Once your homework is done, you can check it over again.', 'Naturally, this makes you hate the subject that you study.'], answer: 1, highlight: 'It\'s tempting to start with the easy stuff to get it out of the way.' }] },
                    { id: 'p2t2q17', label: 'Soru 17', text: `<p>Almost everyone has felt homesick at some time, whether you have gone to college, moved to another city or travelled for vacation. <span class="blank-marker">___</span> It means you have family and friends worth missing and a place you want to return to when your adventure away from home is over.</p>`, questions: [{ id: 'p2t2q17', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['Contrary to common belief, homesickness isn\'t only for kids.', 'Going off to college is another common trigger that people encounter with.', 'Once the new people become more familiar, feelings of homesickness go away.', 'You can miss something as simple as your bed.', 'Remember that there\'s a good side to homesickness too.'], answer: 4, highlight: 'Remember that there\'s a good side to homesickness too.' }] },
                    { id: 'p2t2q18', label: 'Soru 18', text: `<p><span class="blank-marker">___</span> You've probably heard people discussing other types of medical therapy, such as physical therapy or chemotherapy. But the word "therapy" is most often used to mean psychotherapy—psychological help to deal with stress or other mental problems.</p>`, questions: [{ id: 'p2t2q18', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['There\'s nothing wrong with getting help with problems that are hard to solve alone.', 'Through therapy, people learn about themselves and expand their sense of self.', 'If you think that therapy is just for mental health, you are mistaken.', 'Psychotherapy is a process that\'s a lot like learning.', 'Some psychotherapists specialize in working with a certain age group.'], answer: 2, highlight: 'If you think that therapy is just for mental health, you are mistaken.' }] }
                ]
            },
            // Test 3 (Tam – PDF'den 18 soru)
            {
                id: 'p2t3',
                passages: [
                    { id: 'p2t3q1', label: 'Soru 1', text: `<p><span class="blank-marker">___</span> You've probably heard people discussing other types of medical therapy, such as physical therapy or chemotherapy. But the word "therapy" is most often used to mean psychotherapy—psychological help to deal with stress or other mental problems.</p>`, questions: [{ id: 'p2t3q1', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['There\'s nothing wrong with getting help with problems that are hard to solve alone.', 'Through therapy, people learn about themselves and expand their sense of self.', 'If you think that therapy is just for mental health, you are mistaken.', 'Psychotherapy is a process that\'s a lot like learning.', 'Some psychotherapists specialize in working with a certain age group.'], answer: 2, highlight: 'If you think that therapy is just for mental health, you are mistaken.' }] },
                    { id: 'p2t3q2', label: 'Soru 2', text: `<p>Sometimes, video games cause more health troubles than benefits. People who spend too much time sitting while playing video games don't get enough exercise. <span class="blank-marker">___</span> These can vary from stress and anxiety to back or sight problems, but the most important of all is becoming overweight or obese.</p>`, questions: [{ id: 'p2t3q2', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['Lack of exercise can play a role in many health problems.', 'Studies show that certain types of video games may improve hand-eye coordination.', 'Certain people might even become addicted to playing video games.', 'However, the positive aspects of playing video games cannot be ignored.', 'It is better to stimulate your brain with strategy games.'], answer: 0, highlight: 'Lack of exercise can play a role in many health problems.' }] },
                    { id: 'p2t3q3', label: 'Soru 3', text: `<p>Play is children's work. Through play, children learn to socialize with others and form relationships as well as develop skills of empathy, cooperation and self-regulation. <span class="blank-marker">___</span> It is during this type of play that a child will work to master a new experience prior to putting it into practice in real life.</p>`, questions: [{ id: 'p2t3q3', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['Play that teaches children the functional use of many different materials helps them to discover the world around them.', 'High-quality preschool programmes often aim to strengthen social and emotional skills of children.', 'More importantly, preschool programmes should lay a foundation for curiosity and love of learning.', 'Children typically continue to pursue their interest in something until it is mastered.', 'The play-based environment with a loving caretaker is very important for a child\'s psychological development.'], answer: 3, highlight: 'Children typically continue to pursue their interest in something until it is mastered.' }] },
                    { id: 'p2t3q4', label: 'Soru 4', text: `<p>Nearly all Antarctic tourism is sea-based, meaning that your transportation, meals and accommodation are combined in one neat package, your ship, so that no infrastructure has to be built ashore in Antarctica's delicate environment. <span class="blank-marker">___</span></p>`, questions: [{ id: 'p2t3q4', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['Larger ships would cause more environmental damage and create an enormous rescue challenge in case of an accident.', 'With these shallow-draft boats, known as Zodiacs, you can visit penguin rookeries.', 'Several dozen ships now cruise to the Antarctic Peninsula each year.', 'This also allows you to visit many different places rather than stay in one spot.', 'Tourists visit Antarctica only during the summer, from November through March.'], answer: 3, highlight: 'This also allows you to visit many different places rather than stay in one spot.' }] },
                    { id: 'p2t3q5', label: 'Soru 5', text: `<p>School violence isn't easy to understand. <span class="blank-marker">___</span> Some are just following behaviour they've seen at home, on the streets or in video games, movies or television. Sometimes, people who turn violent are victims of teasing who've hit a limit and feel like they would do anything to make it stop.</p>`, questions: [{ id: 'p2t3q5', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['That\'s why it\'s important to get help.', 'There is no single reason why students become violent.', 'Many schools have implemented programmes to fight these problems.', 'If you start feeling unsafe at school, talk to a trusted adult.', 'Still, some schools have re-evaluated their safety needs.'], answer: 1, highlight: 'There is no single reason why students become violent.' }] },
                    { id: 'p2t3q6', label: 'Soru 6', text: `<p>How many of us will really lose our jobs to robots in the future? A 2018 British Academy and Royal Society report found that 10 to 30 per cent of UK jobs are "highly automatable", meaning they could soon be done by machines. Fast food preparation, admin and accountancy jobs are up next, according to the report, while drivers will eventually be replaced by autonomous vehicles. However, the report also predicts that humans will hold on to some lower-paid and manual jobs, such as caring for children and the elderly, and plumbing. <span class="blank-marker">___</span></p>`, questions: [{ id: 'p2t3q6', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['Manufacturing has already encountered substantial losses.', 'Pessimists predict that robots will jeopardize jobs across the globe.', 'Scientists are far from replicating the complexity of human hands.', 'Also, the software that processes the input from the sensors in robots is nowhere near as sophisticated as the human brain.', 'Human reason could decide to fully develop such robots because of their potential benefits to society.'], answer: 1, highlight: 'Pessimists predict that robots will jeopardize jobs across the globe.' }] },
                    { id: 'p2t3q7', label: 'Soru 7', text: `<p>Honeybees often come to mind first when people think of pollinators. However, many different animals, including other insects (other bee species, butterflies, beetles, flies, etc.), some birds and some bats are pollinators too. <span class="blank-marker">___</span> This tremendous floral variety supports a corresponding diversity of pollinators, and the vast majority of these pollinators are insects. For example, while there are only about 1,000 vertebrate pollinator species, it's estimated that there are at least 16,000 different species of bees worldwide.</p>`, questions: [{ id: 'p2t3q7', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['Thus, in order to maintain the diversity of our natural ecosystems, we need healthy pollinator populations.', 'Indeed, there are an estimated 300,000 species of flowering plants worldwide that require animal pollinators.', 'Movement of pollen to a flower\'s stigma results in fertilization of the flower\'s eggs.', 'Furthermore, plants provide shelter and nesting habitat for many different animal species.', 'Pollination results in the production of seeds and is necessary for many plants to reproduce.'], answer: 1, highlight: 'Indeed, there are an estimated 300,000 species of flowering plants worldwide that require animal pollinators.' }] },
                    { id: 'p2t3q8', label: 'Soru 8', text: `<p>Today, most of the population of Sri Lanka consists of Sinhalese people. Tamils, who are from the north and northeast, form the largest ethnic minority. Other peoples include Moors, Burghers, Kaffirs, Malays and the aboriginal Vedda people. <span class="blank-marker">___</span></p>`, questions: [{ id: 'p2t3q8', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['Although Sinhalese is spoken by everyone, a great many Sri Lankans also speak fluent Hindi.', 'It is not difficult to ride an elephant on your very first visit to the teardrop-shaped island.', 'Ceylon, the original name of the island, lends its name to Ceylon tea.', 'The majority of these people are Buddhists, but a significant proportion is Christian.', 'Sri Lanka has a diverse range of people who live and work together.'], answer: 4, highlight: 'Sri Lanka has a diverse range of people who live and work together.' }] },
                    { id: 'p2t3q9', label: 'Soru 9', text: `<p>In many locations with a hot desert climate, maximum temperatures of 40°C to 45°C are not uncommon in summer. During colder periods of the year, night-time temperatures can drop to freezing or below due to the exceptional radiation loss under the clear skies. However, desert temperatures very rarely drop far below freezing. <span class="blank-marker">___</span></p>`, questions: [{ id: 'p2t3q9', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['Cold deserts are typically found at higher altitudes than hot desert climates are.', 'Although in most places, rain falls steadily throughout the year, the desert has only a few periods of rain per year.', 'Deserts have few trees and little vegetation to retain heat, so they cool down rapidly when the sun sets.', 'The jungle climate is much different from a desert climate.', 'Hot desert climates feature exceptionally hot periods in a year.'], answer: 2, highlight: 'Deserts have few trees and little vegetation to retain heat, so they cool down rapidly when the sun sets.' }] },
                    { id: 'p2t3q10', label: 'Soru 10', text: `<p>Developed in 1977 by Atari co-founder Nolan Bushnell and a team of designers, the Atari console connected to a standard television set and employed computer chips that featured full-colour graphics and sound. The system, originally called the Atari VCS, came bundled with two joysticks, two paddle controllers and one game cartridge. Nine games were initially offered for it. The system was also sold at Sears department stores under the name Sears Video Arcade. Sales doubled as millions purchased the console to play the popular arcade game at home. <span class="blank-marker">___</span></p>`, questions: [{ id: 'p2t3q10', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['No one paid attention to this new form of entertainment until the game\'s creator, Nolan Bushnell, formed a new company of his own called Atari.', 'The console suffered from a lack of support and sold just 250,000 units before it was discontinued, though.', 'Atari has confirmed it is making a video games console for the first time in more than 20 years.', 'Success was assured in 1980 after Atari released a home version of the Japanese video game Space Invaders.', 'However, with sales of more than 30 million over a span of decades, the Atari 2600 became one of the most popular gaming systems in history.'], answer: 4, highlight: 'However, with sales of more than 30 million over a span of decades, the Atari 2600 became one of the most popular gaming systems in history.' }] },
                    { id: 'p2t3q11', label: 'Soru 11', text: `<p>Everything started because of a real and practical need to protect the feet from outside effects. This seemingly simple human need turned into a quickly growing industry in which design was just as important as functionality. Although the main qualities of footwear have remained unchanged, looking back at the long and interesting history of shoes, you can see that the colours, materials and designs did change. Before, shoes used to be made by craftsmen, but today, they are part of a factory industry earning huge amounts of money each year. <span class="blank-marker">___</span></p>`, questions: [{ id: 'p2t3q11', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['The shoe industry has grown into a varied industry just as concerned with art as with functionality.', 'Many changes and perfected footwear models emerged during the crusades when Europeans marched to the East.', 'Primitive footwear was changed by sandals during antiquity because of the formation of social classes.', 'Peasants wore heavy and dark leather boots with a heel while the noble wore fancy footwear which often had a wooden heel.', 'It\'s hard to imagine what life was like and how people suffered when there were no shoes yet.'], answer: 0, highlight: 'The shoe industry has grown into a varied industry just as concerned with art as with functionality.' }] },
                    { id: 'p2t3q12', label: 'Soru 12', text: `<p>Recently the goatee, rarely seen out in public since the 1990s, has made something of a comeback. But by no means were beards always popular. From around 1700, hair completely disappeared from men's faces all across Europe. So unpopular was the beard, in fact, that an 1834 book, The Toilette of Health, stated that an "unshorn chin has a degenerating aspect, and is only, if at all, excusable in the lowest labourer and mechanic". <span class="blank-marker">___</span></p>`, questions: [{ id: 'p2t3q12', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['Facial hair had become associated with a rough, rustic stereotype, which went against the smooth skin of the \'polite\' gentleman.', 'The reappearance of the beard occurred during something of a crisis of fears about the quality and fighting spirit of British men.', 'Aesthetically, for example, it was claimed that only a beard lent a man\'s face its full gravity and majesty.', 'In older men, it also conveyed the impression of wisdom and a lifetime of experience.', 'Perhaps the most common claims made in support of the beard, however, were related to health.'], answer: 0, highlight: 'Facial hair had become associated with a rough, rustic stereotype, which went against the smooth skin of the \'polite\' gentleman.' }] },
                    { id: 'p2t3q13', label: 'Soru 13', text: `<p>The Spanish flu pandemic of 1918 infected an estimated 500 million people worldwide and killed an estimated 20 million to 50 million victims, including some 675,000 Americans. The 1918 flu was first observed in Europe, the United States and parts of Asia before swiftly spreading around the world. <span class="blank-marker">___</span> Citizens were simply ordered to wear masks; schools, theatres and businesses were shuttered; and bodies piled up in makeshift morgues before the virus ended its deadly global march.</p>`, questions: [{ id: 'p2t3q13', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['However, a second, highly contagious wave of influenza appeared with a vengeance in the fall of that same year.', 'The first wave of the pandemic occurred in the spring and was generally mild.', 'At the time, there were no effective drugs or vaccines to treat this killer flu strain.', 'Additionally, whoever touched something with the virus on it became infected.', 'Moreover, people with certain medical conditions faced a higher risk of flu-related complications.'], answer: 2, highlight: 'At the time, there were no effective drugs or vaccines to treat this killer flu strain.' }] },
                    { id: 'p2t3q14', label: 'Soru 14', text: `<p>Tracking of time via mechanical or other means appeared over 5,500 years ago in ancient Egypt and Sumer, southern region of the ancient Mesopotamia that is today regarded as the birthplace of modern civilization. With thousands of years of tradition building various types of sundials, sand clocks and water clocks, knowledge of these devices soon spread across the Mediterranean. <span class="blank-marker">___</span> As centuries went on, time was measured with candle clocks, incense clocks, oil-lamp clocks, simple gear clocks, astronomical clocks, all up to the appearance of the first modern devices in 15th and 16th century.</p>`, questions: [{ id: 'p2t3q14', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['Clocks were available since the dawn of ancient human civilizations, and ever since then they had striven to improve them.', 'Greek and Roman empires quickly embraced them and started their own wave of advancements.', 'To measure time easily, they separated daytime into 10 equal parts.', 'For this reason, ancient Greeks and Romans focused much more attention on developing water clocks.', 'Expansion of shipping in Europe could have occurred earlier with reliable time measuring devices.'], answer: 1, highlight: 'Greek and Roman empires quickly embraced them and started their own wave of advancements.' }] },
                    { id: 'p2t3q15', label: 'Soru 15', text: `<p>Taipei was the capital of Taiwan in 1886, during the Qing Dynasty of China. While it was the capital, it first became an important centre for overseas trade. After another fifty years, China once again assumed control of the island following the Japanese surrender in 1945. Right after World War II, the Republic of China relocated the capital to Taiwan, and since then, Taipei has been the provisional capital of the Republic. <span class="blank-marker">___</span></p>`, questions: [{ id: 'p2t3q15', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['When people travel to Taipei, they usually first want to see the National Chiang Kai-shek Memorial Hall.', 'Taipei 101 is a 101-floor landmark skyscraper that claimed the title of world\'s tallest building in 2004.', 'Taipei has the world\'s best international Chinese language program for foreigners.', 'The Taipei Arena was originally designed for sports events, but surprisingly, it has hosted more cultural and art activities than sports events.', 'Approximately one hundred years later, the Japanese acquired Taipei in 1895 after the first Sino-Japanese War.'], answer: 4, highlight: 'Approximately one hundred years later, the Japanese acquired Taipei in 1895 after the first Sino-Japanese War.' }] },
                    { id: 'p2t3q16', label: 'Soru 16', text: `<p>In the town of Portsmouth, England, during the reign of Henry VIII, warships with big cannons were built to fight against the French. These ships were top-heavy; that is, the weight from the cannons made it very easy for these ships to turn upside-down and capsize, especially when the ship was changing direction. The way to avoid this was to close the gun ports so that water could not get into the ship while it was manoeuvring. <span class="blank-marker">___</span></p>`, questions: [{ id: 'p2t3q16', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['Imagine what amazing Spanish jewels might have been found on the crew members in that shipwreck hundreds of leagues below the sea.', 'The presence of a heavy isotope of oxygen suggests that some crew members were Spanish and therefore did not understand English.', 'To accomplish this, Spanish crew members were stationed at the gun ports, and when the English captain gave the command, they closed them.', 'The ship probably had a hundred Spanish crew members, and the captain probably had to give complicated orders to the shipmates.', 'Scientists recently used mass spectrometry to analyze the teeth from the remains of the Spanish crew members.'], answer: 2, highlight: 'To accomplish this, Spanish crew members were stationed at the gun ports, and when the English captain gave the command, they closed them.' }] },
                    { id: 'p2t3q17', label: 'Soru 17', text: `<p>There are many instances of special forms of English that are simplified or shortened to aid in communication. One example is "sea-speak" which was used by sailors sailing in international waters. Sea-speak was probably very useful since there were so many non-native speaker seamen posted on English warships. Also, pilots never ask the air traffic controller, "Would it be OK if the plane landed?" but rather "Request permission to land," which is simpler and easier to understand. <span class="blank-marker">___</span></p>`, questions: [{ id: 'p2t3q17', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['The captain of the ship often had to yell out orders, and the seamen could not hear him.', 'Another example is in aviation: a pilot never says "no", but rather "negative" which is less ambiguous.', 'Music is often considered a language since it carries cultural and spiritual messages, and since it has its own orthography.', 'Mathematics is also a language with a written aspect; however, many applied linguists often claim that they hate maths.', 'The inventor of Esperanto eliminated a great deal of the ambiguity inherent in the English language.'], answer: 1, highlight: 'Another example is in aviation: a pilot never says "no", but rather "negative" which is less ambiguous.' }] },
                    { id: 'p2t3q18', label: 'Soru 18', text: `<p>Karate translates, as is generally accepted, to "empty hand" in Japanese. It is a martial art that uses weaponless techniques such as punching and kicking to overcome the opponent. The development of Karate began in Okinawa, an island in the south of Japan. <span class="blank-marker">___</span> On their return to Okinawa they set about blending their own martial arts with what they had learnt in China.</p>`, questions: [{ id: 'p2t3q18', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['The sport of karate masters the soul, causing it to be more perfect and disciplined.', 'The practice of karate is divided into three elements: kihon (basics), kata (forms) and kumite (sparring).', 'Okinawans travelled to China, where they learnt the Chinese martial arts.', 'Funakoshi introduced Shotokan to Japan in the early 20th century.', 'Karate was founded in the 16th century and formalized into different styles in the early 20th century.'], answer: 2, highlight: 'Okinawans travelled to China, where they learnt the Chinese martial arts.' }] }
                ]
            }
        ]
    },

            {

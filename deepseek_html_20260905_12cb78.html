                    { id: 't6p1', label: 'Early flight', text: `<p>The origin of mankind's desire to fly is lost in the distant past. From the earliest legends there have been stories of men strapping birdlike wings, stiffened cloaks or other devices to themselves and attempting to fly, typically by jumping off a tower. The Greek legend of Daedalus and Icarus is one of the earliest known; others originated from India, China and the European Middle Age. During this early period, the issues of lift, stability and control were not understood, and most attempts ended in serious injury or death. In medieval Europe, the earliest recorded tower jump dates from 852 AD, when Armen Firman, also known as Abbas ibn Firnas, made a jump in Cordoba, Spain, reportedly covering his body with vulture feathers and attaching two wings to his arms. According to some resources, he flew a considerable distance and survived with minor injuries. Eilmer of Malmesbury soon followed. He is said to have attached wings to his hands and feet and managed to fly the length of two football fields. Many others have continued the attempts to fly over the centuries.</p>`, questions: [{ id: 't6q1', text: 'It is stated in the passage that we cannot know for sure', options: ['when exactly mankind\'s desire to fly emerged', 'how flight patterns differed across some countries', 'why Armen Firman adopted a different name', 'whether Eilmer of Malmesbury was inspired by those who flew before', 'how Daedalus and Icarus managed to fly for the first time in history'], answer: 0, highlight: 'The origin of mankind\'s desire to fly is lost in the distant past.' }, { id: 't6q2', text: 'According to the passage, the majority of the early attempts to fly', options: ['followed calculations regarding lift, stability and control', 'involved separating facts from legends', 'failed and led to casualties', 'necessitated figuring out what gravity was', 'were success stories'], answer: 2, highlight: 'most attempts ended in serious injury or death.' }, { id: 't6q3', text: 'We can infer from the passage that, usually, men first tried to fly', options: ['by moving up vertically', 'for military reasons', 'even if they knew it meant instant death', 'in order to impress some vultures', 'by using wing-like attachments and jumping off towers'], answer: 4, highlight: 'strapping birdlike wings, stiffened cloaks or other devices to themselves and attempting to fly, typically by jumping off a tower.' }] },
                    { id: 't6p2', label: 'Need for achievement', text: `<p>Individuals with a high need for achievement function best in competitive situations and are fast learners. They are driven by the need to live up to a high self-imposed standard of performance rather than the desire for fame or fortune. They are usually self-confident, willing to take on individual responsibility and are relatively resistant to outside social pressures. They allow little to get in the way of accomplishing their goals. However, they are also likely to be tense and to suffer psychosomatic illnesses, which are bodily ailments caused by mental or emotional disturbance. Once we know that individuals are high in need for achievement, the question remains: How did they get to be that way? Children who are exposed to adult standards of excellence and whose success is reinforced by these standards will soon learn how to differentiate between good and poor performance. They will know that they will be praised for achievement or punished for lack of it. This will lead them to a desire to do things well.</p>`, questions: [{ id: 't6q4', text: 'According to the passage, people who are high in need for achievement', options: ['do whatever they can to become renowned one day', 'are so much affected by the society that they suffer from some psychological illnesses in the end', 'show a tendency to succeed in competitive circumstances', 'had too strict parents when they were children', 'are such sensitive people that they get upset very easily'], answer: 2, highlight: 'Individuals with a high need for achievement function best in competitive situations' }, { id: 't6q5', text: 'Which of the following is true according to the passage?', options: ['Individuals start developing this desire for accomplishment in childhood.', 'The parents of people with a high need for achievement have had no influence on their children.', 'People who desire to perform really well is said to have a difficult childhood.', 'People with a high need for achievement can only succeed in competitive posts.', 'The more some individuals succeed, the more their parents force them.'], answer: 0, highlight: 'Children who are exposed to adult standards of excellence ... will lead them to a desire to do things well.' }, { id: 't6q6', text: 'The passage is mainly about', options: ['the hardships individuals with a high need for achievement may encounter in life', 'how parents force their children to become individuals who always perform well', 'the activities individuals with a high need for achievement are interested in', 'the differences between an adult\'s need for achievement and that of a child', 'the general traits of individuals with a high need for achievement'], answer: 4, highlight: 'Individuals with a high need for achievement function best in competitive situations and are fast learners.' }] },
                    { id: 't6p3', label: 'Amish', text: `<p>The Amish largely share a Swiss-German ancestry. Although more Amish immigrated to America in the 19th century than during the 18th century, most of today's Amish descend from the 18th century immigrants. The Amish are known for simple living, plain clothing and reluctance to adopt many conveniences of modern technology. However, no summary of Amish lifestyle and culture can be totally adequate because there are few generalities that are true for all the Amish. However, it is known that the Amish do not generally educate their children past the eighth grade, believing that the basic knowledge offered up to that point is sufficient to prepare one for the Amish lifestyle. Almost no Amish go to high school, much less to college. In many communities, the Amish operate their own schools, which are typically one-room schoolhouses with teachers from the Amish community.</p>`, questions: [{ id: 't6q7', text: 'Which of the following can be understood from the passage?', options: ['More Amish people used to live in America in the 19th century than now.', 'The Amish most probably first came to live in America in the 18th century.', 'It took the Amish a long time to get used to the modern way of life.', 'Although there are many Amish groups, all of them share the same traditions and customs.', 'The great grandparents of the Amish were all Swiss-Germans.'], answer: 1, highlight: 'most of today\'s Amish descend from the 18th century immigrants.' }, { id: 't6q8', text: 'The underlined word \'adequate\' in the passage is closest in meaning to', options: ['enough', 'correct', 'regular', 'common', 'polite'], answer: 0, highlight: 'no summary of Amish lifestyle and culture can be totally adequate' }, { id: 't6q9', text: 'According to the passage,', options: ['almost no Amish children attend college or university', 'the Amish believe that education at school after grade eight is insufficient, so they don\'t send their children to school', 'the lifestyle of the Amish has always attracted the attention of Americans', 'since Amish traditions aren\'t based on too strict rules, we can notice some different practices in different Amish groups', 'most Amish people detest having to follow the traditions dating back to the 18th century'], answer: 0, highlight: 'Almost no Amish go to high school, much less to college.' }] },
                    { id: 't6p4', label: 'Earth sheltering', text: `<p>Earth sheltering is the architectural practice of using earth against building walls for external thermal mass, to reduce heat loss and to easily maintain a steady indoor air temperature. It is popular in modern times among advocates of passive solar and sustainable architecture. Earth-sheltered homes are typically made of concrete. Construction costs can run 10% higher than that of a conventional house. However, enthusiasts say that the lower maintenance and energy costs make earth-sheltered homes a good buy. Another advantage of the earth-sheltered house is protection from tornado and storm damage. In addition, these homes are much quieter than their above-ground counterparts. Even when cold winter winds blow, the earth-sheltered house is quiet and comfortable inside. Except for cutting the lawn on the roof, these houses need little exterior maintenance.</p>`, questions: [{ id: 't6q10', text: 'It is understood from the passage that earth-sheltered homes', options: ['have got only one disadvantage: The lawn is on the roof, which results in much more exterior work', 'are not affected much by adverse weather conditions such as a decrease in temperature', 'are as peaceful as above-ground houses', 'are disliked especially by the proponents of passive solar and sustainable architecture', 'are not as economical as the above-ground houses because more electricity is used in these houses'], answer: 1, highlight: 'Even when cold winter winds blow, the earth-sheltered house is quiet and comfortable inside.' }, { id: 't6q11', text: 'According to the passage, an earth-sheltered house is', options: ['designed to cool and heat itself', 'not preferred by environmentalists', 'worth the higher construction cost', 'relatively more expensive to maintain than a conventional house', 'preferred when the weather conditions are too hard to live'], answer: 2, highlight: 'enthusiasts say that the lower maintenance and energy costs make earth-sheltered homes a good buy.' }] },
                    { id: 't6p5', label: 'Subliminal messages', text: `<p>Subliminal messages have always been an uncanny phenomenon and often subject to scientific and public debate. A subliminal message is a signal in the form of a picture or sound that is designed to pass the normal limits of perception. This technique is sometimes used in movies and advertising to influence the subconscious of the viewer. Actually, public awareness of what we now term subliminal advertising began with the 1957 publication of Vance Packard's book, The Hidden Persuaders. Although Packard didn't use the term subliminal advertising, he did describe many of the new 'motivational research' marketing techniques being employed to sell products in the developing post-war American market. Advertisements that focused on consumers' hopes, fears, guilt and sexuality were designed to persuade them to buy products they had never realised they needed. Marketers who could reach into the hearts and minds of American consumers soon found consumers' wallets to be within easy grasp as well.</p>`, questions: [{ id: 't6q12', text: 'According to the passage, which of the following is true about subliminal messages?', options: ['They are perceived easily by people who are exposed to them.', 'They are meant to convey hidden messages.', 'They are found only in visual advertisements.', 'They started to be used in 1957.', 'They are a short kind of advertisement.'], answer: 1, highlight: 'A subliminal message is a signal in the form of a picture or sound that is designed to pass the normal limits of perception.' }, { id: 't6q13', text: 'One can understand from the passage that', options: ['it was Vance Packard who coined the term \'subliminal advertising\'', '\'subliminal advertising\' has attracted more attention recently than it did in the past', 'advertisements do not have any effect on consumers\' purchasing habits', 'it is not certain scientifically whether \'subliminal messages\' are effective or not', '\'subliminal advertising\' is the term used for the influence an advertisement has on people'], answer: 3, highlight: 'Subliminal messages have always been an uncanny phenomenon and often subject to scientific and public debate.' }, { id: 't6q14', text: 'Which of the following can be inferred from the passage?', options: ['The advertisements in the post-war America could not affect the consumers.', '\'Subliminal advertising\' has never attracted ordinary people\'s attention.', 'The number of advertisements containing subliminal messages decreased after the publication of Packard\'s book.', 'The advertisements in the post-war America targeted the needs of people.', 'Even something people do not consciously realise can alter their choices.'], answer: 4, highlight: 'Advertisements that focused on consumers\' hopes, fears, guilt and sexuality were designed to persuade them to buy products they had never realised they needed.' }] },
                    { id: 't6p6', label: 'Special needs education', text: `<p>Decades ago, mentally challenged kids were relegated to institutions, training programmes and group homes. Regarded as unteachable, they were trained to do basic menial tasks instead of being taught through reading and maths. That began to change in the 70s, when activist parents, backed by new federal laws, began pressing local school districts to mainstream intellectually disabled children and provide more community-based resources for them. At the same time, education specialists determined that many cognitively impaired children could learn more provided they received early, intensive intervention. School districts began devising programmes that mixed kids with disabilities into regular schools. Mainstreaming intellectually disabled kids paid off. The goal of many of the recent programmes is to help the children develop the skills they need to live more independently, and that means they can get jobs. For example, Ruth Barker, 23, an education major at Eagle Mountain College, is a typical undergraduate in many ways but has Down syndrome.</p>`, questions: [{ id: 't6q15', text: 'According to the passage, one reason for the development of programmes for intellectually disabled children was that', options: ['education specialists concluded that many of these children could be taught more as long as they were given early, intensive help', 'local schools forced parents to send their intellectually impaired children to school', 'the federal laws made the parents of intellectually disabled children send their children to mainstream schools', 'the parents of cognitively impaired children supported the local schools to educate their children', 'the intellectually challenged students were so bored with the basic daily tasks that they wanted to study reading and maths'], answer: 0, highlight: 'education specialists determined that many cognitively impaired children could learn more provided they received early, intensive intervention.' }, { id: 't6q16', text: 'It can be inferred from the passage that', options: ['Ruth is an average college student stereotype', 'if Ruth had been born before 70\'s, she couldn\'t have gone to college', 'only the ones with Down syndrome study at Eagle Mountain College', 'if Ruth continues her studies, she will be sent to an institution', 'more research should be done into the cognitively impaired college students'], answer: 1, highlight: 'Decades ago, mentally challenged kids were relegated to institutions ... That began to change in the 70s' }, { id: 't6q17', text: 'Which of the following could be the best title for the passage?', options: ['Mainstream Schools', 'The Education System', 'Intelligence', 'Special Needs Education', 'Cognitive Impairments'], answer: 3, highlight: 'mainstream intellectually disabled children and provide more community-based resources for them.' }] },
                    { id: 't6p7', label: 'Cavitation', text: `<p>Although cavitation is actually an engineering principle, the term is now known by almost everybody as aesthetic cavitation, which is a very smart way to reduce fat. If you are someone who can't eliminate those stubborn bulges through healthy exercise and diet and don't want to undergo surgery, this fat reduction technique may be suitable for you. In this revolutionary technology, ultrasound waves tuned to a low frequency produce microscopic bubbles that break the membranes of adipocytes (fat cells) without affecting other adjacent structures, respecting the integrity of circulatory and lymphatic system. The released fat is then eliminated gradually by the body in two days, thanks to the normal process of energy production. The results which can be obtained are obvious after very few sessions: Accumulations of fat and cellulite are eliminated. The treatment is best suited for the average to moderately overweight person who has a healthy lifestyle and who exercises regularly.</p>`, questions: [{ id: 't6q18', text: 'According to the passage, cavitation is', options: ['a way to treat the diseases of circulatory and lymphatic systems', 'known by many people since they are interested in engineering', 'a kind of operation, but it does not cause much pain', 'less effective than regular exercise and a healthy diet', 'a term used both in engineering and aesthetics'], answer: 4, highlight: 'cavitation is actually an engineering principle, the term is now known by almost everybody as aesthetic cavitation' }, { id: 't6q19', text: 'Which of the following is not true according to the passage?', options: ['It does not take a long time to see the expected results of cavitation.', 'The ultrasound waves are so low that they do not harm any structures but fat cells.', 'No other treatments are necessary after aesthetic cavitation.', 'Obese people benefit the best from cavitation.', 'After cavitation, the normal energy production system naturally gets rid of the broken fat cells.'], answer: 3, highlight: 'The treatment is best suited for the average to moderately overweight person' }, { id: 't6q20', text: 'One can understand that the author of the passage', options: ['does not think that cavitation is a good technique for fat reduction', 'recommends having an operation rather than receiving cavitation treatment', 'is critical of the cavitation treatment as a way to eliminate fat', 'thinks that people should lead healthy lives if they do not want to put on weight', 'is in favour of aesthetic cavitation'], answer: 0, highlight: 'If you are someone who can\'t eliminate those stubborn bulges through healthy exercise and diet and don\'t want to undergo surgery, this fat reduction technique may be suitable for you.' }] },
                    { id: 't6p8', label: 'Automobiles', text: `<p>The earliest automobiles were actually steam engines attached to wagons in the late 18th century. They were heavy and slow. It was not until the early 19th century that more practical cars became common. The internal combustion engine changed the way automobiles were powered. The engine used gasoline to work. When the gas is exploded in a cylinder, it pushes the piston down and turns the wheel. Although many people tried to make a car that would work well, Karl Benz is considered the inventor of the modern automobile. For a while, cars were primarily owned by the wealthy. In the early 1900s, a man named Henry Ford came up with a new assembly line system, which paved the way for mass production. This was definitely a game-changer as it changed its role from being a rich person's luxury to an everyday tool for the common man. Since then, many different kinds of cars have been designed and built, from minivans to sports cars. In the 1950s, the USA made more cars than all the rest of the world. In the following years, the world caught up, and China has become the largest manufacturer.</p>`, questions: [{ id: 't6q21', text: 'It is pointed out in the passage that it was only in the early 20th century that', options: ['Karl Benz manufactured economical cars', 'steam engines were introduced', 'China became the largest car producer, surpassing the USA', 'cars began to be produced in large quantities', 'the first modern car was invented'], answer: 3, highlight: 'In the early 1900s, a man named Henry Ford came up with a new assembly line system, which paved the way for mass production.' }, { id: 't6q22', text: 'Which of the following could be the best title for the passage?', options: ['A Brief History of Automobiles', 'How Steam Engine Changed the World', 'Automobile for the Common', 'Henry Ford: The Game Changer', 'Early Automobiles'], answer: 0, highlight: 'The earliest automobiles were actually steam engines attached to wagons in the late 18th century.' }, { id: 't6q23', text: 'Which of the following is true about Karl Benz?', options: ['He is known as the first man to mass produce cars.', 'He introduced low-cost cars to the automobile market.', 'He is regarded as the creator of the modern automobiles.', 'He believed that car ownership should not be a privilege of the rich.', 'The cars he manufactured didn\'t run well.'], answer: 2, highlight: 'Karl Benz is considered the inventor of the modern automobile.' }] }
                ]
            },
            // ===== TEST 7 (Tam) =====
            {
                id: 't7',
                passages: [
                    { id: 't7p1', label: 'Ethical consumerism', text: `<p>Ethical consumerism is a form of political activism based on the premise that purchasers consume not only goods but also, implicitly, the process used to produce them. From the point of view of ethical consumerism, consumption is a political act that sanctions the values embodied in a product's manufacture. By choosing certain products over others, consumers can embrace or reject particular environmental and labour practices and make other value claims based on the ethical values they hold. Exercising choice in this way creates incentives for producers to make production practices conform to consumer values. Successful campaigns waged by ethical consumer movements have popularized dolphin-free tuna, foods that are free of genetically modified organisms, fair-trade coffee and cosmetic products free from animal testing. The idea of using consumption as a lever of political change is rooted in boycotts organized by social movements against products, firms and even countries. As production migrates from the developed to the developing world, escaping the regulatory spheres of Western nation-states, consumer activists increasingly see ethical consumerism as a way to influence labour and environmental practices in faraway places.</p>`, questions: [{ id: 't7q1', text: 'What can be inferred from the passage about ethical consumer movements?', options: ['Their influence is not restricted to a specific country.', 'They caused a dramatic decrease in profits made by some companies.', 'Their involvement in politics has caused considerable controversy.', 'They pretend to be ethically motivated so as to appeal to more people.', 'Newly implemented laws have crippled those movements.'], answer: 0, highlight: 'consumer activists increasingly see ethical consumerism as a way to influence labour and environmental practices in faraway places.' }, { id: 't7q2', text: 'According to the principles of ethical consumerism,', options: ['customers should avoid boycotting particular products', 'one is responsible for the way in which the product he bought was produced', 'people are supposed to purchase as few products as possible', 'companies that damage the environment must compensate for that damage', 'companies should increase production in developing countries'], answer: 1, highlight: 'purchasers consume not only goods but also, implicitly, the process used to produce them.' }] },
                    { id: 't7p2', label: 'Witchcraft', text: `<p>Witchcraft originated with the human civilization itself. The fear of the unknown and its imagined role in making our day-to-day life easy or difficult created witches and their craft. Even though witchcraft as such was practised mainly by experienced and old women, men also practised it. In ancient times, witchcraft was known as 'craft of the wise' as the wise persons were those who followed the path of nature and were in tune with its forces, had the knowledge of herbs and medicines, gave wise counsel and were held in high esteem as shamanic healers and leaders in their community. They understood that nature was superior to human beings and that human beings were simply one of the many parts of nature, both the visible and the invisible that combine to form one whole. As Chief Seattle said, "We do not own the earth; we are a part of it." They understood, unlike modern people, that what we take from nature or use, we must return in kind to maintain the balance.</p>`, questions: [{ id: 't7q3', text: 'According to the passage, witchcraft', options: ['deals with concrete things that can be perceived through the senses', 'was mainly practised by ignorant women whom their community despised', 'actually had little to do with remedial processes', 'partly owed its existence to lack of knowledge, which scared people', 'involves deceiving uneducated people purely for personal gain'], answer: 3, highlight: 'The fear of the unknown and its imagined role in making our day-to-day life easy or difficult created witches and their craft.' }, { id: 't7q4', text: 'What can be inferred from the passage about Chief Seattle?', options: ['He learned to respect nature thanks to the guidance of white men.', 'He didn\'t regard nature as something that human beings possessed.', 'He firmly believed that nature was inferior to mankind in several respects.', 'He proved through his actions that he was in favour of exploiting nature entirely.', 'He bitterly complained about not having enough land left due to white settlers.'], answer: 1, highlight: '"We do not own the earth; we are a part of it."' }, { id: 't7q5', text: 'What is the author\'s primary purpose in this passage?', options: ['To contrast the way people currently view nature with the way they viewed it before', 'To severely criticize people who still preserve their faith in supernatural forces', 'To urge people to quit their modern philosophy and adopt the Indian way of life', 'To give a brief account of contemporary issues related to magic and its uses', 'To praise the shamans\' medical training and their wisdom along with it'], answer: 0, highlight: 'They understood, unlike modern people, that what we take from nature or use, we must return in kind to maintain the balance.' }] },
                    { id: 't7p3', label: 'Victoria Falls', text: `<p>It is difficult to stand in front of this spectacular African waterfall without feeling small. One of the Seven Natural Wonders of the World, Victoria Falls is about twice as high as Niagara Falls. It inspires awe and respect in all who see it. Victoria Falls lies on the border between Zambia and Zimbabwe in southern Africa along the course of the Zambezi River. The falls span the entire breadth of the Zambezi River at one of its broadest points, which is around 1,700 metres. There is a constant roaring sound as the river falls. A dense blanket of mist covers the entire area. The Kalolo-Lozi people who live in the area call this mist "the smoke that thunders". The waters of Victoria Falls drop down a deep gorge. All the water of the Zambezi River flows in through this gorge. At the end of the gorge is the Boiling Pot, a deep pool into which the waters churn and foam during floods.</p>`, questions: [{ id: 't7q6', text: 'It is stated in the passage that', options: ['Niagara Falls isn\'t such a high waterfall as Victoria Falls', 'people show respect to Niagara Falls', 'it is amazing to stand in front of African waterfall which is as twice low as Niagara Falls', 'Victoria Falls is surrounded by spectacular and silent nature', 'only short people can stand in front of the waterfall'], answer: 0, highlight: 'Victoria Falls is about twice as high as Niagara Falls.' }, { id: 't7q7', text: 'We can understand from the writer\'s statement that', options: ['Victoria Falls is the most spectacular falls in the world', 'Victoria Falls forms a bridge from one side to another over the widest point of the Zambezi River', 'thunderstorms are so common in the Southern Africa', 'it is so freezing that one needs a blanket to watch the view', 'the temporary sound in the area isn\'t disturbing'], answer: 0, highlight: 'It is difficult to stand in front of this spectacular African waterfall without feeling small.' }, { id: 't7q8', text: 'Which of the following is not true according to the passage?', options: ['When people see Victoria Falls, they feel great respect and admiration.', 'The Boiling Pot is the place where all the waters of the falls foam at the time of floods.', 'The waters of Victoria Falls drop down a valley.', 'The entire area is covered by fog produced by small drops of water.', 'Victoria Falls is located between two African countries.'], answer: 2, highlight: 'The waters of Victoria Falls drop down a deep gorge.' }] }
                ]
            },
            // ===== TEST 8 (Tam) =====
            {
                id: 't8',
                passages: [
                    { id: 't8p1', label: 'Glass history', text: `<p>Glass is said to have been produced as far back as the 18th dynasty (1500-1350 BCE) by the Egyptians. It was very much later that a new method, glass blowing, would revolutionise glass production. This art was probably discovered along the Eastern Mediterranean coast. The establishment of the Roman Empire provided motivation for glass production using this method. However, after the decline of the Roman Empire, the craft of glass making waned in Europe. The industry continued to thrive in Iran, Iraq and Egypt. In Europe, there was a limited revival of glass making in the early 12th century. A flourishing glass industry developed in Europe by the 15th or 16th century when Venice had become the major producer of glassware, and great quantities of glass objects were being produced in most European countries. Houses that did not have at least some glazed windows were becoming extremely rare.</p>`, questions: [{ id: 't8q1', text: 'It is obvious from the passage that', options: ['all ancient Egyptians used glass products', 'the glassmakers of Egypt used processes that are still used today', 'glass production in Venice was dramatically lower than previously', 'no one knows when or where glass was first made', 'the roots of glass-making date back to 1350-1500 BCE'], answer: 4, highlight: 'Glass is said to have been produced as far back as the 18th dynasty (1500-1350 BCE) by the Egyptians.' }, { id: 't8q2', text: 'The underlined word \'wane\' in the passage is closest in meaning to', options: ['build', 'decrease', 'appear', 'grow', 'arrive'], answer: 1, highlight: 'after the decline of the Roman Empire, the craft of glass making waned in Europe.' }, { id: 't8q3', text: 'We can conclude from the passage that by the 16th century,', options: ['houses with glass windows were no longer unusual', 'the Venetians had developed different skills from the ones the Romans had', 'glass-making techniques had spread worldwide', 'glass was more popular than other materials', 'Venice hired craftsmen from Egypt'], answer: 0, highlight: 'Houses that did not have at least some glazed windows were becoming extremely rare.' }] },
                    { id: 't8p2', label: 'Dog training', text: `<p>Probably the most commonly known method in dog training is positive and negative reinforcement; however, those are only two amongst many different techniques. One shouldn't limit themselves to only using one technique or selected few because doing so limits the ability to train a dog as an individual instead of adopting and mending certain techniques to benefit a specific dog. Positive techniques, methods that don't involve adverse stimuli, are the most effective because they don't make dogs feel stressed, which would inhibit their learning abilities. Alpha dog or dominance training, which relies on a dog's instinctual pack mentality and clicker training, which involves the use of a device to make a quick noise when a wanted behaviour is accomplished are some of the examples of positive techniques. Negative techniques usually require real expertise lest the action has unwanted effects. Punishment which can be defined as the removal of a pleasant or reinforcing stimulus in order to decrease some certain behaviour is widely used in this technique. A good example for this kind of training is neglecting to give the dog attention when he jumps on you.</p>`, questions: [{ id: 't8q4', text: 'When comparing the positive and negative techniques of dog training, the latter', options: ['doesn\'t involve adverse stimuli', 'is the most affective technique in dog training', 'cannot avoid unwanted effects', 'uses punishment to decrease a behaviour', 'doesn\'t require anyone with high level of knowledge'], answer: 3, highlight: 'Punishment which can be defined as the removal of a pleasant or reinforcing stimulus in order to decrease some certain behaviour is widely used in this technique.' }, { id: 't8q5', text: 'In the writer\'s opinion, the positive technique', options: ['inhibits the learning of a dog', 'is only effective for a short period of time', 'is the most efficacious technique', 'requires an expert', 'creates a real expedited dog'], answer: 2, highlight: 'Positive techniques ... are the most effective' }, { id: 't8q6', text: 'It can be inferred from the passage that', options: ['if one technique is used for training, a dog cannot adopt', 'trainers can combine various techniques to benefit a specific dog', 'it is impossible to mend behaviour problems by using one technique', 'adding an adverse stimuli while training a dog hardly causes stress', 'punishment doesn\'t work at all'], answer: 1, highlight: 'One shouldn\'t limit themselves to only using one technique or selected few because doing so limits the ability to train a dog as an individual instead of adopting and mending certain techniques to benefit a specific dog.' }] }
                ]
            },
            // ===== TEST 9 (Tam) =====
            {
                id: 't9',
                passages: [
                    { id: 't9p1', label: 'Business & economy', text: `<p>The business community in the country laments the hardships in doing business due to discount rate hike and energy shortages. Deteriorating economic health is known to all. The ability to create new job opportunities is shrinking. New income and job opportunities mainly depend on how resilient an economy is. Presently the economy is passing through a problematic phase, but it has every potential to catapult itself onto high growth trajectory provided that a realistic investment strategy is pursued with adequate allocation of resources. For a prosperous and developed country, it is imperative to resolve the energy crisis and implement strict law and order situation. With the assistance of the local people and friendly countries, it can convert the constraints it is facing today into new opportunities.</p>`, questions: [{ id: 't9q1', text: 'The passage tells us that', options: ['business community puts the blame on hardships like energy shortages', 'the government stands accused of hardships', 'business community expresses sadness because of hardships in doing business', 'to create new job opportunities is ascending', 'almost half of the businessmen are aware of deteriorating economic health'], answer: 2, highlight: 'The business community in the country laments the hardships in doing business' }, { id: 't9q2', text: 'It is clear from the passage that', options: ['were the business community to follow a realistic investment strategy, economy would grow', 'despite the crisis, it is still possible to create job opportunities at a tremendous rate', 'business community pursues a real investment strategy lest there should be energy shortages', 'with insufficient allocation of resources, a realistic investment strategy is pursued', 'the problem is not discount rate hike but rather energy shortages'], answer: 0, highlight: 'it has every potential to catapult itself onto high growth trajectory provided that a realistic investment strategy is pursued' }, { id: 't9q3', text: 'Which of the following is not mentioned in the passage?', options: ['The country ought to be free from energy crisis to develop.', 'Economic problems of the country arouses the interest of friendly countries.', 'Not only the help of local people but also the help of other countries is needed to get away with the problem.', 'Present limitations can be changed into new opportunities with assistance.', 'There is a possibility of speedy growth of economy.'], answer: 1, highlight: 'The passage mentions energy crisis, investment strategy, local people and friendly countries, but not that economic problems arouse the interest of friendly countries.' }] }
                ]
            },
            // ===== TEST 10 (Tam) =====
            {
                id: 't10',
                passages: [
                    { id: 't10p1', label: 'Fireplaces', text: `<p>Fireplaces were the main source of heat for homes in the 18th century. Most fireplaces of the day were very inefficient. They produced a lot of smoke, and most of the heat that was generated went right out of the chimney. Benjamin Franklin developed a new style of stove with a hood like enclosure in the front and an air box in the rear. Later in the same century, Count Rumford came up with a design that had a tall, shallow firebox, which was better at drawing the smoke up and out of the building. The shallow design also allowed most of the heat to be projected into the room. All these changes allowed for a more efficient fire, one that used one quarter as much wood and generated twice as much heat. These revolutionary ideas soon made open fireplaces obsolete. In those days, an energy crisis broke out, and everybody exclaimed to have alternative ways to heat homes, so the woodstove industry boomed to fulfil the demands of people.</p>`, questions: [{ id: 't10q1', text: 'It is understood from the passage that', options: ['decreased the effects of the energy crisis', 'increased the demand for open fireplaces', 'didn\'t make any sense to woodstove industry at all', 'included a device for generating more efficient fire', 'pushed the producers to design new stoves consuming less energy but giving more heat'], answer: 4, highlight: 'All these changes allowed for a more efficient fire, one that used one quarter as much wood and generated twice as much heat.' }, { id: 't10q2', text: 'The underlined word \'obsolete\' in the passage is closest in meaning to', options: ['out-of-date', 'popular', 'effective', 'suitable', 'useful'], answer: 0, highlight: 'These revolutionary ideas soon made open fireplaces obsolete.' }] }
                ]
            },
            // ===== TEST 11 (Tam) =====
            {
                id: 't11',
                passages: [
                    { id: 't11p1', label: 'Panama Canal', text: `<p>France was the first to attempt to create a water passage across the Isthmus of Panama to link the Atlantic and Pacific. Led by de Lesseps, the builder of the Suez Canal in Egypt, the construction team broke ground on a planned sea-level canal in 1880. The French soon comprehended the monumental challenge ahead of them. Along with the incessant rains that caused heavy landslides, there was no effective means for combating the spread of yellow fever and malaria. De Lesseps belatedly realized that a sea-level canal was too difficult and reorganized efforts toward a lock canal, but funding was pulled from the project in 1888. The US purchased the French assets in the canal zone for $40 million in 1902. When a proposed treaty over rights to build in what was then a Colombian territory was rejected, the US threw its military weight behind a Panamanian independence movement, eventually negotiating a deal with the new government. On November 6, 1903, the United States recognized the Republic of Panama, and on November 18, the Hay-Bunau-Varilla Treaty was signed with Panama, granting the US exclusive and permanent possession of the Panama Canal Zone.</p>`, questions: [{ id: 't11q1', text: 'It can be concluded from the passage that the French', options: ['couldn\'t complete the canal project due to environmental factors', 'were determined to keep funding the canal project despite the obstacles', 'quit financially supporting the canal project at the first sign of trouble', 'backed the previous government in Panama', 'initially devised a lock canal in Panama'], answer: 0, highlight: 'Along with the incessant rains that caused heavy landslides, there was no effective means for combating the spread of yellow fever and malaria.' }, { id: 't11q2', text: 'We can infer from the passage that the United States', options: ['engaged in battle with Colombia over rights to build a canal', 'launched the Panama Canal project a decade before the French', 'temporarily controlled the Panama Canal Zone', 'signed a deal with France in order to avoid a military conflict', 'used its power to determine who would govern Panama'], answer: 4, highlight: 'the US threw its military weight behind a Panamanian independence movement, eventually negotiating a deal with the new government.' }, { id: 't11q3', text: 'The passage mainly deals with', options: ['the significance of the Panama Canal', 'American victories', 'a French failure', 'the building of a canal', 'the defeat Panama suffered'], answer: 3, highlight: 'France was the first to attempt to create a water passage across the Isthmus of Panama' }] }
                ]
            }
        ]
    },

    part2: {

            // Test 1 (Tam – 18 soru)
            {
                id: 'p2t1',
                passages: [
                    { id: 'p2t1q1', label: 'Soru 1', text: `<p>Neptune has 13 known moons, six of which were discovered by Voyager 2. <span class="blank-marker">___</span> This moon is the coldest body yet visited in our solar system as temperatures on its surface are about -235 degrees Celsius. Despite this deep freeze, Voyager 2 discovered geysers spewing icy material upward more than eight kilometres.</p>`, questions: [{ id: 'p2t1q1', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['Neptune\'s winds are three times stronger than Jupiter\'s winds and nine times stronger than those of Earth.', 'The main axis of Neptune\'s magnetic field is "tipped over" by about 47 degrees compared with the planet\'s rotation axis.', 'Neptune\'s atmosphere extends to great depths, gradually merging into water.', 'The largest, Triton, orbits Neptune in a direction opposite to the direction of the planet\'s rotation.', 'Nearly 4.5 billion kilometres from the Sun, Neptune orbits the Sun once every 165 years.'], answer: 3, highlight: 'The largest, Triton, orbits Neptune in a direction opposite to the direction of the planet\'s rotation.' }] },
                    { id: 'p2t1q2', label: 'Soru 2', text: `<p>There is no fixed length for a musical. However, most musicals range from one and a half hours to three hours. They are generally presented in two acts with one intermission ten to twenty minutes long. The first act is frequently longer than the second act. <span class="blank-marker">___</span></p>`, questions: [{ id: 'p2t1q2', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['In addition, there are vibrant musical theatre scenes in many countries in Europe.', 'The three main components of musicals are the music, the lyrics and the book.', 'It can range from a short one-act entertainment to several acts and several hours in length.', 'It is better if it is performed in the language of its audience.', 'There is less time to develop drama in a musical than in a straight play of equivalent length.'], answer: 2, highlight: 'It can range from a short one-act entertainment to several acts and several hours in length.' }] },
                    { id: 'p2t1q3', label: 'Soru 3', text: `<p>Tristan and Isolde were two lovers who were much more popular before Romeo and Juliet. As in Shakespeare's, the legend of Tristan and Isolde is the tragic tale of two lovers fated to share a forbidden but undying love. <span class="blank-marker">___</span> However, while Shakespeare doesn't tell us what happens after their characters' death, we know that Tristan and Isolde are buried in Cornwall. From Isolde's grave a rose tree grows, and from Tristan's comes a vine that wraps itself around the tree. It's a sign that the two lovers cannot be parted in death.</p>`, questions: [{ id: 'p2t1q3', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['Every time the vine is cut, it gracefully grows again.', 'Romeo and Juliet are two lovers who both pass away tragically.', 'Tristan and Isolde are a lot more than mythological characters.', 'Tristan dies of grief, thinking that Isolde has betrayed him, and Isolde dies over his dead body.', 'While the details of the story may differ, the overall plot structure remains much the same.'], answer: 3, highlight: 'Tristan dies of grief, thinking that Isolde has betrayed him, and Isolde dies over his dead body.' }] },
                    { id: 'p2t1q4', label: 'Soru 4', text: `<p>Sign language is often used by people with hearing loss. In the United States, for example, American Sign Language is primarily used, while in the United Kingdom, British Sign Language is most commonly used. <span class="blank-marker">___</span> Although it may seem that all forms of sign language are universal, they are usually very different from one another.</p>`, questions: [{ id: 'p2t1q4', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['One of the earliest written records of a sign language is in Plato\'s Cratylus.', 'There are many kinds of sign language in different places all over the world.', 'Sign languages do not have a formal written form.', 'American Sign Language is thought to be the fourth most commonly used language.', 'The Internet now allows people who are hard of hearing to talk via video links.'], answer: 1, highlight: 'There are many kinds of sign language in different places all over the world.' }] },
                    { id: 'p2t1q5', label: 'Soru 5', text: `<p>The Gulf Stream is an ocean current that brings warm water from the Gulf of Mexico into the Atlantic Ocean. It extends along the eastern coast of the United States and Canada and influences the climate of the east coast of Florida, keeping temperatures there warmer in the winter and cooler in the summer than the other south-eastern states. Since the Gulf Stream also extends towards Europe, it warms western European countries as well. <span class="blank-marker">___</span> If it weren't for the warm water of the Gulf Stream, it would suffer from much lower temperatures.</p>`, questions: [{ id: 'p2t1q5', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['While the waters of the North Atlantic will cool as a result of changes in the flow, it\'s likely that the UK will see impacts of climate change.', 'For instance, England is the same distance from the equator as cold regions of Canada, yet England enjoys a much warmer climate.', 'As the warm water comes in, colder, denser water sinks and begins moving south, eventually flowing along the bottom of the ocean all the way to Antarctica.', 'Whether they are located far inland or right by the coast, all the European countries greatly benefit from the current\'s warming effect.', 'Satellite images of sea surface temperature can show the path of the warm Gulf Stream current with great precision.'], answer: 1, highlight: 'For instance, England is the same distance from the equator as cold regions of Canada, yet England enjoys a much warmer climate.' }] },
                    { id: 'p2t1q6', label: 'Soru 6', text: `<p>Humans have always looked at the heavens and wondered about the nature of the objects seen in the night sky. With the advances in technology in the 20th century, it became possible to send machines and animals and then people above Earth's atmosphere into outer space. Well before technology made these achievements possible, however, space exploration had already captured the minds of many people. <span class="blank-marker">___</span> It perhaps also reveals why space exploration has been a common and enduring theme in literature and art.</p>`, questions: [{ id: 'p2t1q6', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['For most of the latter 20th century, only national governments could afford the very high costs of launching people and machines into space.', 'Space flight enables humans to explore the universe and understand the many objects and phenomena that are better observed from a space perspective.', 'The strong hold that space travel has always had on the imagination may well explain why people consent at their great peril to travel into space.', 'As centuries of speculative fiction in books make clear, one giant leap for mankind was taken by the human spirit.', 'Regardless, Gagarin still set the record as the first person to leave Earth\'s orbit and travel into space.'], answer: 2, highlight: 'The strong hold that space travel has always had on the imagination may well explain why people consent at their great peril to travel into space.' }] },
                    { id: 'p2t1q7', label: 'Soru 7', text: `<p>Rembrandt is generally considered one of the greatest painters in European art history and the most important in Dutch history. His contributions to art came in a period that historians call the Dutch Golden Age. <span class="blank-marker">___</span> On the other hand, his paintings were popular throughout his lifetime and his reputation as an artist remained high.</p>`, questions: [{ id: 'p2t1q7', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['Rembrandt\'s greatest creative triumphs are exemplified especially in his portraits of his contemporaries.', 'At the end of 1631 Rembrandt began to practise as a professional artist for the first time.', 'At one time ninety paintings were counted as his self-portraits, but it is now known that he had his students\' copies.', 'Although having achieved youthful success as a painter, he later led a tragic life and suffered financial hardship.', 'In the 1650s, Rembrandt\'s style changed again, in which colours became richer and brush strokes more pronounced.'], answer: 3, highlight: 'Although having achieved youthful success as a painter, he later led a tragic life and suffered financial hardship.' }] },
                    { id: 'p2t1q8', label: 'Soru 8', text: `<p>She was raised by her father because her mother had passed away when she was young. One year on Mother's Day, she decided that the hard work of fathers like her own and like many others deserved a day for recognition too. She decided to celebrate her new holiday in June because that was the month her wonderful father had been born in. <span class="blank-marker">___</span></p>`, questions: [{ id: 'p2t1q8', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['Father\'s Day in Iran is celebrated on the birth anniversary of Imam Ali.', 'In the United States, the third Sunday in June is Father\'s Day.', 'Father\'s Day was created to complement Mother\'s Day.', 'Father\'s Day was made a national holiday when the president signed it into law in 1972.', 'Father\'s Day dates back to 1909, when Sonora Smart Dodd wanted to honour her father.'], answer: 4, highlight: 'Father\'s Day dates back to 1909, when Sonora Smart Dodd wanted to honour her father.' }] },
                    { id: 'p2t1q9', label: 'Soru 9', text: `<p>Water shortages can occur in any country because the average daily consumption of water has risen dramatically per person in recent years. <span class="blank-marker">___</span> To overcome these problems, people are encouraged to limit their consumption, and the water companies are being forced to repair pipes.</p>`, questions: [{ id: 'p2t1q9', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['Therefore, the demand for water will increase throughout this century.', 'The technology currently being developed is hoped to lower the costs as well.', 'In addition, they can occur due to leakages and consequent loss of billions of litres of water.', 'The number of people living in places that have periodic water shortages is expected to increase to over 5 billion by 2030.', 'Besides, new filtration systems have been developed to replace the traditional methods.'], answer: 2, highlight: 'In addition, they can occur due to leakages and consequent loss of billions of litres of water.' }] },
                    { id: 'p2t1q10', label: 'Soru 10', text: `<p>Although tornadoes can happen at any time of the year, they are especially common during spring and early summer. <span class="blank-marker">___</span> However, April appears to be the deadliest month—an average of 27 tornado deaths occurred during this month between 1950 and 1999, and one of the all-time worst tornado disasters occurred on April 26, 1989.</p>`, questions: [{ id: 'p2t1q10', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['Those which form in a dry environment can be nearly invisible.', 'The diameter of a tornado can vary between a few feet and a mile.', 'May and June are the peak months in terms of numbers of tornadoes.', 'These tornadoes are capable of lifting houses off their foundations.', 'Tornadoes have been observed on every continent except Antarctica.'], answer: 2, highlight: 'May and June are the peak months in terms of numbers of tornadoes.' }] },
                    { id: 'p2t1q11', label: 'Soru 11', text: `<p>The word Iguana is derived from a Spanish form of the Taino name for the species Iwana. <span class="blank-marker">___</span> In the more than two centuries since then, no less than 17 species and subspecies have been identified. They are organised into nine broad categories including rock iguanas, desert iguanas and green iguanas.</p>`, questions: [{ id: 'p2t1q11', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['The spiny-tailed iguanas are found from Central America into northern Mexico.', 'They use visual signals to communicate with other members of the same species.', 'Most nest individually, but marine iguanas nest communally.', 'The species was first officially described by the Swedish botanist Carolus Linnaeus in 1758.', 'They have a large round scale on their cheek.'], answer: 3, highlight: 'The species was first officially described by the Swedish botanist Carolus Linnaeus in 1758.' }] },
                    { id: 'p2t1q12', label: 'Soru 12', text: `<p><span class="blank-marker">___</span> Their tunnelling mixes and aerates the soil, in some places replacing the activity of earthworms. Moreover, many species feed on small insects that are serious crop pests. Insect-eating ants, such as fire ants, sting their prey and cut them into smaller pieces so they can easily carry them back to their colony.</p>`, questions: [{ id: 'p2t1q12', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['Ants as a group are beneficial to humans.', 'Ant societies have division of labour.', 'An ant\'s head contains many sensory organs.', 'The life of an ant starts from an egg.', 'Many animals can learn behaviours by imitation.'], answer: 0, highlight: 'Ants as a group are beneficial to humans.' }] },
                    { id: 'p2t1q13', label: 'Soru 13', text: `<p><span class="blank-marker">___</span> Their tunnelling mixes and aerates the soil, in some places replacing the activity of earthworms. Moreover, many species feed on small insects that are serious crop pests. Insect-eating ants, such as fire ants, sting their prey and cut them into smaller pieces so they can easily carry them back to their colony.</p>`, questions: [{ id: 'p2t1q13', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['Ants as a group are beneficial to humans.', 'Ant societies have division of labour.', 'An ant\'s head contains many sensory organs.', 'The life of an ant starts from an egg.', 'Many animals can learn behaviours by imitation.'], answer: 0, highlight: 'Ants as a group are beneficial to humans.' }] },
                    { id: 'p2t1q14', label: 'Soru 14', text: `<p>Some are made with 100% fruit juice while others have been artificially sweetened. <span class="blank-marker">___</span> Juices made with 100% fruit will have more vitamins and nutrients than the sweetened variety even though they might be almost equal in calories.</p>`, questions: [{ id: 'p2t1q14', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['In the USA, fruit juice can only legally be used to describe a product which is 100% fruit juice.', 'A juice or nectar including concentrate must state that it does.', 'Roughly 70% of Americans aren\'t meeting the recommendations for fruit and vegetable intake.', 'Some medications carry a warning that taking them alongside grapefruit juice could cause an overdose.', 'Not all fruit juices are created equal.'], answer: 4, highlight: 'Not all fruit juices are created equal.' }] },
                    { id: 'p2t1q15', label: 'Soru 15', text: `<p>The advantages of biomass energy, obtained by burning organic material, may be offset by environmental concerns. Unlike most other renewable sources, biomass fuels can create air pollution and desertification problems when used on a wide scale. Moreover, in arid regions, a common sequence of events produces a scenario of environmental destruction, which ultimately leads to desertification. <span class="blank-marker">___</span></p>`, questions: [{ id: 'p2t1q15', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['As with oil and coal, burning of this resource introduces poisonous gases and particles into the air.', 'Forest wastes like fallen leaves, branches, dead trees, tree stumps and wood chips are used to yield biomass energy.', 'When solid waste is utilized as biomass, the problem of environmental pollution in landfills is solved.', 'Converting farmlands and crops for the production of biomass will damage the world\'s food supply on a global scale.', 'Crops which grow quickly can easily be used as biomass fuels since they are easily replaced by new crops.'], answer: 3, highlight: 'Converting farmlands and crops for the production of biomass will damage the world\'s food supply on a global scale.' }] },
                    { id: 'p2t1q16', label: 'Soru 16', text: `<p>Divers need a series of equipment for scuba diving including a wetsuit, scuba and regulator. They wear the scuba, so they can breathe under water. The scuba contains a cylinder of compressed air, which divers carry on their backs. Divers breathe through a regulator, which decompresses the air as it comes out of the cylinder. <span class="blank-marker">___</span></p>`, questions: [{ id: 'p2t1q16', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['For recreational diving, the scuba consisting of two stages is usually used.', 'The air is compressed into the cylinder to increase the amount of air the divers can carry.', 'Finding the right diving equipment is essential to having a safe diving experience.', 'Almost all living things, including humans, need oxygen to survive.', 'Diving is an internationally-recognized sport that is part of the Olympic Games.'], answer: 0, highlight: 'For recreational diving, the scuba consisting of two stages is usually used.' }] },
                    { id: 'p2t1q17', label: 'Soru 17', text: `<p>While many people associate traditional spas with Roman baths, there is evidence of spa-type therapies dating back thousands of years when there was a belief in the curative powers of mineral waters. One of the first written accounts of bathing being used as a curative process was by ancient Greek philosopher Hippocrates, who advocated that the way to health is to have an aromatic bath every day. <span class="blank-marker">___</span> Its influence can be seen today in everything from mineral-infused treatments to thalassotherapy—swimming in seawater to heal the skin.</p>`, questions: [{ id: 'p2t1q17', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['Therefore, it\'s fair to say that spas are at the forefront of the holistic health and wellness movement today.', 'The expansion of the modern-day spa\'s demographic is largely due to a redefinition that has been developing over the last 10 years.', 'Although this idea, generally accepted back then, approaches to health and treatment changed over the course of centuries.', 'However, the modern-day spa has deep roots, having grown from some of the most longstanding health practices in the world.', 'This process, using bathing as a treatment of disease, is considered the founding principle of spa-going.'], answer: 4, highlight: 'This process, using bathing as a treatment of disease, is considered the founding principle of spa-going.' }] },
                    { id: 'p2t1q18', label: 'Soru 18', text: `<p>Polio is an infectious disease which has been eradicated from many countries through vaccination programmes. <span class="blank-marker">___</span> Others may be advised when travelling to parts of the world where there is a special risk of a disease. Most are given by injection, although one form of polio vaccine is given by drops, for swallowing.</p>`, questions: [{ id: 'p2t1q18', text: 'Boşluğa getirilebilecek en uygun cümle hangisidir?', options: ['Polio was first recognized as a distinct condition by Jakob Heine in 1840.', 'Some of the vaccines for preventing polio are offered routinely in childhood.', 'The virus enters the central nervous system in about 3% of infections.', 'It enters the body through your nose or mouth and almost immediately starts spreading.', 'The first inactivated virus vaccine for polio was developed by Jonas Salk.'], answer: 1, highlight: 'Some of the vaccines for preventing polio are offered routinely in childhood.' }] }
                ]

                    { id: 't4p1', label: 'Car consciousness', text: `<p>One of the most prominent professors of economics says that while British people have class consciousness, in many other countries people have car consciousness instead. In North Europe, status depends heavily on somebody's education and profession. Conversely, in Southern Europe, people tend to pay more attention to wealth. This, in turn, creates an urge to exhibit wealth, to buy expensive cars as status symbols. Of course, in wealthy countries such as Sweden or England, Ferraris and Porsches are a frequent occurrence. Yet, they usually belong to well-established professionals. In Southern European countries, however, people often buy cars to show off even if they have to borrow large amounts of money for this vain task. People who adopt such a superficial and frivolous mentality are unlikely to honour good education and professional integrity. At least, they can drive a BMW loaded with debt.</p>`, questions: [{ id: 't4q1', text: 'It is evident that the writer of the passage', options: ['disapproves of the car consciousness mentality', 'believes that personal taste is important', 'thinks that expensive cars should circulate only in wealthy countries', 'claims that luxurious cars are not sold very much in countries like Sweden', 'has an aversion to expensive car owners and despises them'], answer: 0, highlight: 'People who adopt such a superficial and frivolous mentality are unlikely to honour good education and professional integrity.' }, { id: 't4q2', text: 'The underlined word \'frivolous\' in the passage is closest in meaning to', options: ['serious', 'careful', 'smart', 'foolish', 'brave'], answer: 3, highlight: 'People who adopt such a superficial and frivolous mentality' }, { id: 't4q3', text: 'Which of the following is not true according to the passage?', options: ['Southern European people buy cars beyond their means in order to gain more respect in their society.', 'People from Southern European countries have different priorities in life compared to the people in North Europe.', 'People in Southern Europe go through a lot of trouble in order to drive more luxury cars.', 'People get loans to buy cars because they cannot become successful professionals.', 'It\'s usually respected people that have luxury cars in Northern Europe.'], answer: 3, highlight: 'In Southern European countries, however, people often buy cars to show off even if they have to borrow large amounts of money for this vain task.' }] },
                    { id: 't4p2', label: 'Vitamin C', text: `<p>Vitamin C is an essential nutrient for our health. Therefore, our body needs a constant supply of it. It can be found in many different forms such as effervescent or chewable tablets and pills. Of course, it can also be found in food sources such as fruit, but people seem to prefer its manufactured forms as they offer large doses. For example, a 1000 mg tablet is equivalent to a large number of oranges. Swallowing a pill instead of having to eat a dozen of oranges is an obvious advantage. What the pharmaceutical companies which sell them avoid mentioning is that our body cannot absorb more than 200 mg in one go. Our greed for more is one of the factors which add pressure on these manufacturers to increase the doses to the impressive mark of 1000 mg or more. But in the end, we get our 200 mg and the satisfaction of consuming 1000 mg. The public are happy.</p>`, questions: [{ id: 't4q4', text: 'It is clear from the passage that companies which manufacture vitamin C', options: ['can have an adverse effect on people\'s health due to their misleading products', 'produce pills which have no effect at all', 'do not disclose a piece of information that is of vital importance to public health', 'tend to market their products in illegal ways', 'tell half-truths about their products'], answer: 2, highlight: 'What the pharmaceutical companies which sell them avoid mentioning is that our body cannot absorb more than 200 mg in one go.' }, { id: 't4q5', text: 'The main purpose of this passage is to', options: ['encourage readers to take vitamin C supplements', 'show the advantages and disadvantages of vitamin C intake', 'give examples of vitamin C resources', 'convince people that taking vitamin C tablets is unnecessary', 'inform readers about vitamin C resources and how much of it they need'], answer: 4, highlight: 'Vitamin C is an essential nutrient for our health.' }, { id: 't4q6', text: 'The writer of the passage implies that a vitamin C pill or tablet', options: ['often contains more vitamin than necessary', 'cannot replace a large amount of oranges', 'is useful only when it contains more than 200 mg', 'can be dangerous when it contains more than 1000 mg', 'is not as beneficial to health as a large number of oranges'], answer: 0, highlight: 'a 1000 mg tablet is equivalent to a large number of oranges. ... our body cannot absorb more than 200 mg in one go.' }] },
                    { id: 't4p3', label: 'Flamingos & salmon', text: `<p>Flamingos are long-legged wading birds that are usually covered in bright pink feathers. With a name that derives from the Spanish or Portuguese word meaning "flame-coloured," the birds are known for their vibrant appearance. Though it is their most-famous quality, the pink of the flamingo's feathers is not a hereditary trait. They are in fact born dull grey, but, as Encyclopaedia Britannica explains, "the bright pink colour of flamingos comes from beta carotene, a red-orange pigment that's found in high numbers within the algae, larvae, and brine shrimp that flamingos eat in their wetland environment." Salmon are similar in that sense—their meat is naturally grey as well, and wild salmon fillets are pink because the fish, when alive, feast on krill and shrimp. Farm-raised salmon fillets, therefore, shouldn't be pink when they hit our dinner plates, but they are because consumers would object to grey salmon. It is stated that salmon farmers spike their artificial diet with pinkifying pellets to make the fish look natural even though in reality, the exact opposite is true.</p>`, questions: [{ id: 't4q7', text: 'Which of the following could be the best title for the passage?', options: ['Unnatural Pinkness', 'Salmon Are Actually Grey', 'Nature Changes Colour', 'They Aren\'t Innately Pink', 'Wildly Grey Becomes Pinkish'], answer: 3, highlight: 'the pink of the flamingo\'s feathers is not a hereditary trait. They are in fact born dull grey' }, { id: 't4q8', text: 'Which of the following statements is true of the colour of flamingos and salmon?', options: ['Grey turns into pink because of their excessive diets', 'They are artificially made pink to attract consumers', 'What they prey on alters their pigmentation', 'They are solely notorious for their pinkness', 'Even when raised in farms, their diet reflects their nature'], answer: 2, highlight: 'the bright pink colour of flamingos comes from beta carotene... wild salmon fillets are pink because the fish, when alive, feast on krill and shrimp.' }, { id: 't4q9', text: 'It is pointed out in the passage that', options: ['flamingos have a genetic feature that makes them look different', 'depending on what they eat in dry areas, flamingos can stay grey', 'untamed salmon mainly eats what keeps its natural colour grey', 'the name \'flamingo\' is not originally an English word but a borrowed one', 'people who consume salmon do not know where it comes from and hence prefer them pink'], answer: 3, highlight: 'With a name that derives from the Spanish or Portuguese word meaning "flame-coloured"' }] },
                    { id: 't4p4', label: 'Sunlight & brain', text: `<p>Sunlight produces a so-called 'feel good' psychological factor. This is related to the chemical balance of the brain which regulates mood. Sunlight triggers the production of a specific type of chemical in the brain called endorphins which condition the way we feel. So, it is not only the case that a sunny day makes us feel happier because we like the sun, but the sun literally influences our brain in biochemical terms. Of course, it is not easy to distinguish between emotional and biochemical terms when it comes to the function of the human brain. Yet, we respond emotionally to many things we like without experiencing the immediate influx of endorphins that sunlight causes. Chronic depression in wealthy countries such as Finland is epidemic, and it shows the consequences of sunlight deprivation. As in most cases of relevant research, it is mostly the extreme chronic conditions which reveal how the brain works.</p>`, questions: [{ id: 't4q10', text: 'It can be understood from the passage that Finns face a high rate of depression', options: ['because Finland suffers from economic problems', 'due to their specific brain characteristics', 'mostly because of social problems and health issues', 'as a result of the local weather', 'because brain science is not advanced'], answer: 3, highlight: 'Chronic depression in wealthy countries such as Finland is epidemic, and it shows the consequences of sunlight deprivation.' }, { id: 't4q11', text: 'It is clear from the passage that the human brain', options: ['needs a doctor\'s assistance', 'is influenced by ambient light', 'needs to produce chemicals so that we can get the most health benefit from sunlight', 'functions effectively just with the help of sunlight', 'runs on chemicals, not natural food sources'], answer: 1, highlight: 'the sun literally influences our brain in biochemical terms.' }, { id: 't4q12', text: 'Which of the following could be the best title for the passage?', options: ['Mind over Matter', 'The Effects of Sunlight on Emotional State', 'Biology, Psychology and Physics', 'Brain Science', 'Depression and Northern Countries'], answer: 1, highlight: 'Sunlight produces a so-called \'feel good\' psychological factor.' }] },
                    { id: 't4p5', label: 'Population', text: `<p>About 8 billion people inhabit the Earth now. To get a better picture of this, one should consider that there are, among a huge number of threatened and endangered species, perhaps 100,000 gorillas, half as many polar bears and no more than a few thousand tigers. The human population has grown nearly tenfold especially over the last three hundred years and has increased four times in the last hundred years. This monumental historical development has had profound implications on the relationship of our species to its habitats and has greatly intensified our impact on the environment. However, no less noteworthy are the signs that the human population explosion has begun to abate in our generation. It is expected that our numbers will have risen to one and a half times what it is now by the time it stops doing so, and what's more, quite a few researchers estimate that a decline will be inevitable.</p>`, questions: [{ id: 't4q13', text: 'Which of the following could be deduced from the passage?', options: ['The rise in the human population is a relatively recent development.', 'Scientists have recently been observing a drop in the human population.', 'The acceleration of the rise in the human population cannot be curbed.', 'A century ago there were four times as few people as there are now.', 'The earth is capable of sustaining any number of people.'], answer: 3, highlight: 'has increased four times in the last hundred years.' }, { id: 't4q14', text: 'It is clear from the passage that', options: ['technology will help curb the sharp rise soon', 'there are four times more humans than the next most populous species', 'when the human population peaks, it will have risen to almost twelve billion', 'scientists doubt the rise will stop once it becomes one and a half times what it is now', 'very few researchers believe a drop in the number of people cannot be stopped'], answer: 2, highlight: 'It is expected that our numbers will have risen to one and a half times what it is now' }, { id: 't4q15', text: 'According to the passage, which of the following is true?', options: ['Gorillas are by far the most crowded mammals after humans.', 'There has hardly been any difference in the number of other species in the last three hundred years.', 'There are nearly as many bears as there are gorillas.', 'The changes in our environment are the main cause of the population rise.', 'The fact that there are more humans on earth now has considerable effects on it.'], answer: 4, highlight: 'This monumental historical development has had profound implications on the relationship of our species to its habitats and has greatly intensified our impact on the environment.' }] },
                    { id: 't4p6', label: 'Collective intelligence', text: `<p>Since antiquity, the social organization of insects such as ants and bees has been a source of inspiration for thinkers, politicians and philosophers. These insects appear to have highly sophisticated ways of structuring their 'societies', dividing labour, communicating information and even making collective decisions. However, on the flip side, when an insect such as an ant becomes isolated, it seems unable to behave in any meaningful way. According to scientists, this can be described as a form of collective intelligence. A colony of ants, or a beehive, is not a sum of quirkily intelligent insects, but, rather, a sum of 'units' which automatically mirror, or adapt to, what their peer group does. A very large number of insects with limited intelligence come together and form a unit which behaves in sophisticated, intelligent ways. Nowadays, computer scientists draw inspiration from these models of intelligent organization and try to develop large clusters of computers or small robots which combine forces, forming an extremely capable whole which is more than merely the sum of its parts.</p>`, questions: [{ id: 't4q16', text: 'It can be understood from the passage that insects such as bees and ants', options: ['cannot make decisions without elaborating their options with their peer group', 'help many scientists to design computers', 'cannot form societies of high intelligence', 'would not be able to form complex social structures if they were not guided by robots', 'appear to reflect behaviour rather than think independently'], answer: 4, highlight: 'A colony of ants, or a beehive, is not a sum of quirkily intelligent insects, but, rather, a sum of \'units\' which automatically mirror, or adapt to, what their peer group does.' }, { id: 't4q17', text: 'Which of the following can be inferred from the passage?', options: ['Scientists try to draw inspiration from the same sources with ancient thinkers.', 'Science often draws on nature in order to make technological breakthroughs.', 'Biologists work with computer scientists as they hope to benefit from exchanging ideas.', 'The close study of insects has recently gained great importance for science today.', 'Scientists from different fields combine forces in order to explain the mystery of insects.'], answer: 0, highlight: 'Since antiquity, the social organization of insects such as ants and bees has been a source of inspiration for thinkers, politicians and philosophers. ... computer scientists draw inspiration from these models' }, { id: 't4q18', text: 'Which of the following could be the best title for the passage?', options: ['Insects, Ants and Bees', 'Insects\' Social Behaviour', 'Nature versus Science', 'Collective Intelligence and its Uses', 'Recreating a Natural Phenomena'], answer: 3, highlight: 'this can be described as a form of collective intelligence.' }] },
                    { id: 't4p7', label: 'London tube', text: `<p>'Tube chaos' is a phrase which is all too familiar to Londoners. London has, in theory, one of the most reliable metro systems in Europe. In practice, however, the 'tube' faces a failure somewhere every 10 minutes on average. Of course, the London Underground has a vast network with many lines and numerous stations, so a passenger is not bound to come across such a failure on any given day. But the ageing system can turn a Londoner's day into a nightmare quite often as entire lines break down almost every week. Many think that what has caused this worsening situation is the fact that the tube has been privatized. The owners of the network aim to maximize profits, according to critics. They allegedly reduce costs by compromising maintenance. If this proves to be true, it is a textbook case of irresponsible entrepreneurship. Trying to keep costs low is one thing, putting the safety of thousands at risk is another matter. After a day of tube chaos, the owners merely stated that their main business is buses, not trains, a peculiar excuse, to say the least.</p>`, questions: [{ id: 't4q19', text: 'It can be understood from the passage that the tube in London', options: ['is unreliable because it is the oldest in Europe', 'can be compared to the metro systems in developing countries', 'is problematic for different reasons', 'is dangerous to use on a daily basis', 'has a track record of fatal accidents'], answer: 2, highlight: 'the ageing system can turn a Londoner\'s day into a nightmare quite often as entire lines break down almost every week. Many think that what has caused this worsening situation is the fact that the tube has been privatized.' }, { id: 't4q20', text: 'It can be inferred from the passage that the current owners of the tube', options: ['face criticism which appears to have a sound basis as failures are on the rise', 'should not be held responsible for the failures since the system is old', 'reject accusations that they cannot cope with', 'must invest in infrastructure irrespective of cost even if they go bankrupt', 'should not care about profits at all'], answer: 0, highlight: 'The owners of the network aim to maximize profits, according to critics. They allegedly reduce costs by compromising maintenance.' }, { id: 't4q21', text: 'It is implied in the passage that the problems the London tube experiences', options: ['are linked only to its amateurish management', 'have nothing to do with its age', 'will be solved only with a change of ownership', 'are related to both management and the age of the network', 'have made Londoners seek alternative ways of travelling'], answer: 3, highlight: 'the ageing system ... Many think that what has caused this worsening situation is the fact that the tube has been privatized.' }] },
                    { id: 't4p8', label: 'Carnivorous plants', text: `<p>Carnivorous plants are predatory flowering plants that kill animals in order to derive nutrition from their bodies. They capture and kill prey, and they have a mechanism to facilitate digestion of the prey. They also derive a significant benefit from nutrients assimilated from the prey. To put it in more human terms, carnivorous plants eat things like insects, spiders and other small soil and water-living invertebrates, lizards, mice, rats and other small vertebrates. Carnivorous plants pull off this trick using specialized leaves that act as traps. Many traps lure prey with bright colours and nectar. Once caught and killed, the prey is digested by the plant. The plant then absorbs the nutrients made available from the corpse. Most carnivorous plants will grow without consuming prey, but they grow much faster and reproduce much better with nutrients derived from their prey. Not all plants that trap or kill animals are considered carnivorous, though. Some plants capture insects in their flowers to facilitate pollination. They don't kill the pollinators, and if some of the pollinators do die in the flower, it is not to the advantage of the plant.</p>`, questions: [{ id: 't4q22', text: 'It is understood from the passage that some carnivorous plants', options: ['may help facilitate some animals\' digestive process', 'are trapped by the specialized leaves of other plants', 'can survive even if they don\'t feed on prey', 'avoid killing pollinators because it could harm them as well', 'need to feed on each other in order to survive'], answer: 2, highlight: 'Most carnivorous plants will grow without consuming prey' }, { id: 't4q23', text: 'One can understand from the passage that carnivorous plants', options: ['are able to use their colouring to attract insects', 'release digestive juices before they trap their prey', 'grow faster by means of a soil-based diet', 'have mistakenly been named plant-eaters', 'fail to trick certain species'], answer: 0, highlight: 'Many traps lure prey with bright colours and nectar.' }, { id: 't4q24', text: 'The main purpose of the passage is to', options: ['highlight how carnivorous plants are preyed on', 'clarify a misunderstanding about some plants', 'find middle ground between two conflicting theories', 'explain how carnivorous plants feed', 'teach how to avoid traps set by carnivores'], answer: 3, highlight: 'Carnivorous plants are predatory flowering plants that kill animals in order to derive nutrition from their bodies.' }] }
                ]
            },

                    { id: 't5p1', label: 'Drones in disasters', text: `<p>The first thing disaster responders do in an emergency is find out what happened, how many people need help and what assistance the survivors need. To get an overview as quickly as possible, disaster managers use everything at their disposal: They read reports, call their local counterparts, drive to the scene of the disaster, request satellite images and check social media. Nowadays, disaster responders have another source of information at their disposal: drones. Drones are small, comparatively cheap and can quickly provide images of a disaster-affected area. Compared to satellites they have two big advantages. Firstly, drone images have a much higher resolution than satellite images, which means that disaster managers get a clearer picture of what is going on. Secondly, drones can fly under the clouds. This is particularly important after hurricanes or typhoons when it often takes two to three days before clouds dissipate and satellites are able to see the ground again. In Ecuador, for instance, following a recent earthquake, the local authorities worked closely with a network of volunteer drone pilots to find out which roads were at risk of being buried by landslides.</p>`, questions: [{ id: 't5q1', text: 'We can conclude from the passage that, following a recent earthquake, the local authorities', options: ['felt obliged to resign on account of the massive landslides', 'attempted to cover up the issue with the help of drone pilots', 'expected to be consulted by drone pilots about the issue', 'accurately predicted which roads would be buried by landslides', 'benefited from some drone pilots free of charge'], answer: 4, highlight: 'the local authorities worked closely with a network of volunteer drone pilots' }, { id: 't5q2', text: 'We can infer from the passage that drones', options: ['are not likely to replace satellites', 'barely provide instant imaging of disasters', 'are not affordable to some countries', 'are superior to satellites in certain respects', 'have helped to eliminate disaster risks'], answer: 3, highlight: 'Compared to satellites they have two big advantages.' }, { id: 't5q3', text: 'The passage mainly deals with', options: ['landslides and their impact on the surrounding areas', 'how drones can be of use after a disaster', 'when drones were first manufactured', 'the ways in which drones differ from satellites', 'several methods employed to predict disasters'], answer: 1, highlight: 'disaster responders have another source of information at their disposal: drones.' }] },
                    { id: 't5p2', label: 'King Midas', text: `<p>In mythology, Dionysus decided, one day, to reward King Midas for his hospitality and granted him one wish. Midas wished that everything he touched be turned to gold. Dionysus warned him about the dangers of such a wish, but Midas did not take his advice as he was not aware of the consequences. Dionysus gave him the gift. Initially, King Midas was fascinated by his new gift and turned everything he could to gold, including his beloved roses. His attitude changed, however, when he was unable to eat or drink since his food and drink were also changed to gold. He even accidentally killed his daughter when he touched her, and this truly made him realize the depth of his mistake. He prayed Dionysus to take this curse from him. He was told to go to river Pactolous and wash his hands. Then everything he had touched became normal again.</p>`, questions: [{ id: 't5q4', text: 'The passage mainly describes', options: ['Dionysus\'s generosity', 'King Midas\'s hospitality', 'a myth about King Midas', 'a regret Dionysus had', 'the value of gold for people'], answer: 2, highlight: 'In mythology, Dionysus decided, one day, to reward King Midas' }, { id: 't5q5', text: 'We learn from the passage that in the beginning, Midas', options: ['had difficulty in deciding on his gift', 'felt sorry about the wish he had made', 'wanted Dionysus to turn his roses into gold', 'was happy about being able to turn objects to gold', 'did not want his guest to be turned into gold'], answer: 3, highlight: 'Initially, King Midas was fascinated by his new gift and turned everything he could to gold' }, { id: 't5q6', text: 'According to the passage, the very first thing that changed Midas\'s attitude to his gift was', options: ['the golden food and drink he could not consume', 'losing his amazing appetite', 'the death of his daughter', 'Dionysus\'s warnings about his wish', 'the fact that his roses turned gold'], answer: 0, highlight: 'His attitude changed, however, when he was unable to eat or drink since his food and drink were also changed to gold.' }] },
                    { id: 't5p3', label: 'Sugar & hyperactivity', text: `<p>Many concerned parents believe that there is a link between a child's diet and behaviour. They limit sugary foods, thinking they cause hyperactivity. It is right to restrict these treats, but the reasoning is wrong. These high-calorie foods offer little nutrition and can lead to many health problems, but no scientific evidence says sugar causes hyperactivity. Sugar can provide a short-term energy boost, but that is not the same as hyperactivity. The children at a birthday party acting like little tornadoes probably have more to do with the excitement of being around other kids, rather than the cake. And that unruly boy in the grocery store throwing a fit with a candy clutched in each fist? His parents probably have not set appropriate behaviour limits, and they most likely give him what he wants, which is more candy.</p>`, questions: [{ id: 't5q7', text: 'According to the passage, many parents do not want their children to eat sugary foods because they', options: ['do not want their children to consume junk food as it may cause malnutrition', 'know that the kids will gain a lot of weight', 'are afraid that their children will become lazy if they eat too much sugar', 'do not want their children to run around due to the high energy given by sugar', 'believe that such foods make their children overactive'], answer: 4, highlight: 'They limit sugary foods, thinking they cause hyperactivity.' }, { id: 't5q8', text: 'Which of the following is true according to the passage?', options: ['People who associate hyperactivity with consuming sugary foods are wrong.', 'There are hazardous chemicals in sugary foods.', 'Sugary foods have nothing to do with providing energy.', 'Sugary foods pose no threats to health.', 'Scientists warn people against the negative effects of sugary foods.'], answer: 0, highlight: 'no scientific evidence says sugar causes hyperactivity.' }, { id: 't5q9', text: 'It can be understood from the passage that \'the unruly boy in the grocery store\'', options: ['is overweight if not obese', 'likes to eat lollies very much', 'has been spoilt by his parents', 'is happy because he has some candy in his hands', 'is fed up with eating candy all the time'], answer: 2, highlight: 'His parents probably have not set appropriate behaviour limits, and they most likely give him what he wants, which is more candy.' }] },
                    { id: 't5p4', label: 'Sign language with babies', text: `<p>Is making sign language with babies the new fad? The answer to this question is a resounding 'no'. People have been making signs—paralinguistic signals—with their babies for years. The most common reason for doing so is an intense desire on the part of a parent or caregiver to find out exactly what is going on in a baby's mind: What does she need? What does she want? What does she observe? It is a fact that infants develop the fine muscles in their hands before they develop those required for speech, so they are equipped to communicate with you before they can speak. That is why most babies invent their own 'signs' to get their meaning across. Communicating with babies via sign language has been proven to be beneficial to speech acquisition through years of research, and it is fun and inspirational.</p>`, questions: [{ id: 't5q10', text: 'It can be understood from the passage that signing with babies', options: ['has recently become so fashionable that more and more parents are learning it', 'can help them learn how to speak', 'is just a waste of time if you want to learn what your baby really needs', 'has been globally used since it is fun both for the parent and the baby', 'is a must for any caregiver to be able to understand the baby'], answer: 1, highlight: 'Communicating with babies via sign language has been proven to be beneficial to speech acquisition' }, { id: 't5q11', text: 'According to the passage, one advantage of using signs with babies is that it helps', options: ['caregivers to have many job opportunities', 'babies develop their fine muscles', 'babies learn how to use their hands', 'parents understand the baby\'s needs, wants and thoughts', 'parents to find a qualified caregiver'], answer: 3, highlight: 'the most common reason for doing so is an intense desire on the part of a parent or caregiver to find out exactly what is going on in a baby\'s mind' }, { id: 't5q12', text: 'Which of the following can be understood from the passage?', options: ['There is no scientific evidence on whether or not signing with babies is of any use.', 'Only the babies who have their own special signs can communicate with their parents.', 'What babies enjoy most is making their caregiver understand what they want.', 'Many people think it is no use trying to communicate with babies through sign language.', 'The muscles in infants\' hands develop before the ones needed to speak.'], answer: 4, highlight: 'infants develop the fine muscles in their hands before they develop those required for speech' }] },
                    { id: 't5p5', label: 'Ancient dams', text: `<p>The oldest known dam in the world is a masonry and earthen embankment at Jawa in the Black Desert of modern Jordan. The Jawa Dam was built in the 4th millennium BCE to hold back the waters of a small stream and allow increased irrigation production on arable land downstream. Evidence exists of another masonry-faced earthen dam built about 2700 BCE at Sadd el-Kafara, about 30km south of Cairo, Egypt. The Sadd el-Kafara failed shortly after completion when, in the absence of a spillway that could resist erosion, it was overtopped by a flood and washed away. The oldest dam still in use is a rockfill embankment about 6 metres high on the Orontes River in Syria, built about 1300 BCE for local irrigation use. The Assyrians, Babylonians and Persians built dams between 700 and 250 BCE for water supply and irrigation. Contemporary with these was the earthen Ma'rib Dam in the southern Arabian Peninsula, which was more than 15 metres high and nearly 600 metres long. Flanked by spillways, this dam delivered water to a system of irrigation canals for more than 1,000 years. Remains of the Ma'rib Dam are still evident in present-day Ma'rib, Yemen.</p>`, questions: [{ id: 't5q13', text: 'Which statement is true about the Jawa Dam?', options: ['It is still in use, serving its original purpose.', 'The goal was to enable a rise in irrigation capacity.', 'It is made up of solely stone blocks.', 'It has been in existence for four thousand years.', 'The dam in Sadd el-Kafara was modelled after the Jawa Dam.'], answer: 1, highlight: 'The Jawa Dam was built in the 4th millennium BCE to hold back the waters of a small stream and allow increased irrigation production' }, { id: 't5q14', text: 'It is pointed out in the passage that the Ma\'rib Dam', options: ['was superior to its contemporaries in terms of height', 'disappeared without a trace', 'lost in competition to other dams', 'was used for over a millennium', 'was regarded as an instant success'], answer: 3, highlight: 'this dam delivered water to a system of irrigation canals for more than 1,000 years.' }, { id: 't5q15', text: 'Which of the following could be the best title for the passage?', options: ['Ancient Dams', 'Benefits of Dams', 'How to Build a Dam', 'Modern Dams vs Ancient Dams', 'Irrigation in the Past'], answer: 0, highlight: 'The oldest known dam in the world...' }] },
                    { id: 't5p6', label: 'Gardening', text: `<p>Gardening for food extends far back into prehistory. Gardening for ornamental purposes was also popular in ancient times. Cultivating gardens purely for pleasure as opposed to the production of food is known to have originated in the Fertile Crescent. A famous example for this was the Hanging Gardens of Babylon. The earliest forms of gardens emerged from the people's need to grow herbs and vegetables for consumption or medicinal use. And yet, many rich individuals in the past had gardens for only decorative purposes and leisure. Today, many countries, including England, the garden traditions of which go back to the landscape artists of the 18th and 19th centuries, admire gardening too, and the interest in English gardens crosses all age and social boundaries.</p>`, questions: [{ id: 't5q16', text: 'It is stated in the passage that one of the purposes of the gardens was to', options: ['be a part of the ancient history', 'be one of the wonders of the world', 'show off', 'grow food', 'discover different kinds of fruit'], answer: 3, highlight: 'Gardening for food extends far back into prehistory.' }, { id: 't5q17', text: 'We learn from the passage that rich people had gardens for', options: ['spending their free time and making their surroundings more attractive', 'decorating their historical buildings', 'continuing the traditions that came from their ancestors growing flowers', 'helping poor people find food', 'exhibiting the works of artists who painted those imaginary gardens long ago'], answer: 0, highlight: 'many rich individuals in the past had gardens for only decorative purposes and leisure.' }, { id: 't5q18', text: 'The passage points out that today the people interested in English gardens', options: ['are the rich and the wealthy', 'are the artists living in the countryside', 'started gardening in the 18th and 19th centuries', 'like decorative ornaments', 'can be at any age or from all walks of life'], answer: 4, highlight: 'the interest in English gardens crosses all age and social boundaries.' }] },
                    { id: 't5p7', label: 'Bermuda Triangle', text: `<p>Bermuda Triangle is the section of the North Atlantic Ocean off North America in which more than 50 ships and 20 airplanes are said to have mysteriously disappeared. Reports of unexplained occurrences in the region date to the mid-19th century. Some ships were discovered completely abandoned for no apparent reason; others transmitted no distress signals and were never seen or heard from again. Aircraft have been reported and then vanished, and rescue missions are said to have vanished when flying in the area. However, wreckage has not been found, and some of the theories advanced to explain the repeated mysteries have been fanciful. Although theories of supernatural causes for these disappearances abound, geophysical and environmental factors are most likely responsible. One hypothesis is that the missing vessels were felled by so-called "rogue waves," which are massive waves that can reach heights of up to 30.5 metres and would theoretically be powerful enough to destroy all evidence of a ship or airplane.</p>`, questions: [{ id: 't5q19', text: 'According to the passage, the Bermuda Triangle', options: ['no longer poses a challenge to experienced sailors', 'has never been easy for sailors to locate', 'is believed by some to have sunk many vessels mysteriously', 'is known around the world for its calm waters', 'derives its power from the magnetic field surrounding it'], answer: 2, highlight: 'in which more than 50 ships and 20 airplanes are said to have mysteriously disappeared.' }, { id: 't5q20', text: 'The underlined word \'abound\' in the passage most nearly means', options: ['explain in a more detailed way', 'state something indirectly', 'have not enough of something', 'move away from a place', 'exist in great numbers'], answer: 4, highlight: 'Although theories of supernatural causes for these disappearances abound' }, { id: 't5q21', text: 'The main purpose of the passage is to', options: ['provide a detailed account of the disappearance of a particular ship', 'enlighten the reader on how to navigate the Bermuda Triangle', 'disprove some theories regarding disappearances in the Bermuda Triangle', 'scientifically explain the disappearances in the Bermuda Triangle', 'discourage pilots and captains from approaching the Bermuda Triangle inexhaustively'], answer: 3, highlight: 'geophysical and environmental factors are most likely responsible.' }] },
                    { id: 't5p8', label: 'Maldives', text: `<p>The Maldives is a group of coral islands scattered across the equator in the middle of the Indian Ocean. The gemlike islands show the rare beauty of a tropical paradise. Marco Polo referred to the Maldives as the 'Flower of the Indies'. The Maldives, whose closest neighbours are India and Sri Lanka, measures 820 kilometres north to south and 120 kilometres east to west at its greatest width. There are 1190 coral islands grouped in a double chain of twenty-seven atolls and only 202 of them are inhabited. The islands are very small and with many being no more than two metres above sea level. In fact, the highest island is situated at three metres above sea level. Their common features are tall coconut palms and white sandy beaches. There are no hills, mountains or rivers in the Maldives. Although some larger atolls are approximately fifty kilometres long from north to south and thirty kilometres wide from east to west, no individual island is longer than eight kilometres.</p>`, questions: [{ id: 't5q22', text: 'We can understand from the passage that the writer thinks', options: ['everyone should visit the Maldives', 'the Maldives are home to many rare species', 'the islands more than two metres above sea level have a greater view', 'the Maldives has a unique beauty', 'there should be more accommodation on the islands'], answer: 3, highlight: 'The gemlike islands show the rare beauty of a tropical paradise.' }, { id: 't5q23', text: 'Which statement is true about the Maldives?', options: ['It is bordered by India and Sri Lanka.', 'It is the birthplace of Marco Polo.', 'It was discovered by the Indians.', 'It has nearly 1,000 islands that no one lives on.', 'It is the biggest island of the Indian Ocean.'], answer: 3, highlight: 'There are 1190 coral islands ... and only 202 of them are inhabited.' }, { id: 't5q24', text: 'It is stated in the passage that one of the characteristics of the Maldives is that', options: ['it is the smallest country in land area', 'it is a group of flat islands which are about two metres above sea level', 'its economy depends on coconut production', 'many explorers such as Marco Polo lived there', 'it is the only island country of India'], answer: 1, highlight: 'many being no more than two metres above sea level.' }] }
